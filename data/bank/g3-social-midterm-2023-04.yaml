    options:
      - "[拿|ㄋㄚˊ][美工刀|ㄇㄟˇ ㄍㄨㄥ ㄉㄠ][和|ㄏㄜˊ][弟弟|ㄉㄧˋ ㄉㄧˋ][嬉鬧|ㄒㄧ ㄋㄠˋ]"
      - "[離開|ㄌㄧˊ ㄎㄞ][家|ㄐㄧㄚ][前|ㄑㄧㄢˊ][注意|ㄓㄨˋ ㄧˋ][電器|ㄉㄧㄢˋ ㄑㄧˋ]、[瓦斯|ㄨㄚˇ ㄙ][是否|ㄕˋ ㄈㄡˇ][關閉|ㄍㄨㄢ ㄅㄧˋ][才|ㄘㄞˊ][出門|ㄔㄨ ㄇㄣˊ]"
