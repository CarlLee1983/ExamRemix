questions:
  - no: 1
    type: multi-select
    subject: 社會
    grade: 3
    stem: 班上有同學剛轉來，說自己還不熟悉校園。哪些做法能關心他，也讓他自己選擇？請勾選所有正確選項。
    options:
      - 告訴他如果願意，我可以陪他認識教室位置
      - 直接拉著他到處跑，不讓他說話
      - 問他想先了解哪個地方，再一起看校園圖
      - 因為他不熟悉環境就嘲笑他
      - 未經他同意，把他的電話貼到班級群組
    answer:
      - 1
      - 3
    explanation: 提出可拒絕的陪同邀請、先詢問想了解的地方，都兼顧協助與自主。強拉、嘲笑和公開私人電話，沒有尊重他的意願與隱私。
    derivedFrom:
      - g3-social-midterm-2025-02-34
  - no: 2
    type: multi-select
    subject: 社會
    grade: 3
    stem: 同學說他在吵雜的教室裡不容易聽清楚討論內容，想請大家協助。哪些回應適合？請勾選所有正確選項。
    options:
      - 叫他別再參與討論
      - 輪到發言時一次一人說，讓內容更清楚
      - 取笑他沒有把話聽好
      - 詢問他是否希望把重要事項寫下來
      - 不理會他的意見，替他完成所有決定
    answer:
      - 2
      - 4
    explanation: 一次一人發言和詢問是否需要文字，能回應他已表達的需要。排除、取笑或替他做全部決定，都沒有尊重他的參與。
    derivedFrom:
      - g3-social-midterm-2025-02-34
  - no: 3
    type: multi-select
    subject: 社會
    grade: 3
    stem: 同學因為家中的寵物過世很難過。他說想找人安靜聊一下。哪些做法能給他合適的陪伴？請勾選所有正確選項。
    options:
      - 在老師同意的安靜位置，聽他願意說的事
      - 要求他立刻高興起來，才願意陪他
      - 把他難過的樣子拍下來給全班看
      - 不逼他說不想說的細節
      - 如果他想找老師談談，陪他一起去
    answer:
      - 1
      - 4
      - 5
    explanation: 安靜傾聽、尊重不想說的細節，以及依意願陪同找老師，都回應了他的需要。強迫立刻開心或公開他的樣子，可能讓他更不舒服。
    derivedFrom:
      - g3-social-midterm-2025-02-34
  - no: 4
    type: multi-select
    subject: 社會
    grade: 3
    stem: 同學表示自己對花生過敏，還不確定桌上的點心能不能吃。哪些做法能關心他的安全與意願？請勾選所有正確選項。
    options:
      - 告訴他吃一小口試試看就好
      - 不勉強他吃，陪他請老師確認食品標示
      - 大家一起起鬨，直到他願意吃
      - 聽他說明需要，詢問是否要幫忙找老師
      - 不問他就把點心塞進他的嘴巴
    answer:
      - 2
      - 4
    explanation: 不勉強進食，並依需要找老師確認，能兼顧安全與尊重。過敏食物不能靠試吃判斷；起鬨或強迫餵食都不恰當。
    derivedFrom:
      - g3-social-midterm-2025-02-34
  - no: 5
    type: multi-select
    subject: 社會
    grade: 3
    stem: 同學坐輪椅參加班級活動。他說想自己選工作，需要時會提出協助。哪些安排尊重他的參與？請勾選所有正確選項。
    options:
      - 詢問他想負責的工作，和他一起討論安排
      - 整理活動通道，避免物品擋住輪椅
      - 認為他一定做不好，直接取消他的工作
      - 需要移動他的輪椅前，先問他是否同意
      - 尊重他表示暫時不需要幫忙的回答
    answer:
      - 1
      - 2
      - 4
      - 5
    explanation: 詢問工作意願、保持通道暢通、接觸輪椅前取得同意，以及接受暫時不需協助，都尊重他的參與。未了解能力就取消工作，是預先排除他。
    derivedFrom:
      - g3-social-midterm-2025-02-34
  - no: 6
    type: multi-select
    subject: 社會
    grade: 3
    stem: 同學在走廊找不到遺失的鉛筆盒，表示想請人陪他找。哪些做法是合適的協助？請勾選所有正確選項。
    options:
      - 沒問就打開其他同學的書包翻找
      - 說他粗心，叫全班一起責備他
      - 陪他回想走過的地方，再一起找
      - 沒有線索就指控別人偷走了
      - 陪他到失物招領處詢問
    answer:
      - 3
      - 5
    explanation: 依他的請求一起回想、到失物招領處詢問，都是合適且尊重他人的做法。擅翻別人的書包、責備或沒有證據就指控他人，都不恰當。
    derivedFrom:
      - g3-social-midterm-2025-02-34
  - no: 7
    type: multi-select
    subject: 社會
    grade: 3
    stem: 生病請假的同學傳話說，希望有人幫忙記下當天作業，但不想公開病情。哪些做法符合他的需要？請勾選所有正確選項。
    options:
      - 記下作業，依雙方約好的方式交給他
      - 要求他先公開看診紀錄，才幫他記作業
      - 在班上反覆追問他生了什麼病
      - 不在群組轉傳他的病情
      - 詢問是否需要老師協助取得學習資料
    answer:
      - 1
      - 4
      - 5
    explanation: 記錄作業、保護病情隱私及詢問學習資料需求，符合他已表達的需要。幫忙不應以公開病情為條件，也不應追問不願透露的資訊。
    derivedFrom:
      - g3-social-midterm-2025-02-34
  - no: 8
    type: multi-select
    subject: 社會
    grade: 3
    stem: 同學不小心打翻水，說自己能擦桌面，但想請人提醒大家別踩到地上的水。哪些回應兼顧關心與尊重？請勾選所有正確選項。
    options:
      - 取笑他做事笨手笨腳
      - 提醒經過的人先繞開積水
      - 搶走抹布，說他什麼都不能做
      - 請老師協助處理濕滑地面
      - 不聽他的說明，就強迫他接受全部幫助
    answer:
      - 2
      - 4
    explanation: 提醒他人繞開積水並請老師協助濕滑地面，回應了他提出的需要，也保留他能自己完成的工作。取笑、貶低能力或強迫接受幫助都不合適。
    derivedFrom:
      - g3-social-midterm-2025-02-34
