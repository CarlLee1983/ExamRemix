questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 兩位新同學都姓林，只知道這件事，不知道他們父母之間的關係。有同學直接說「他們一定是堂兄弟姊妹」。只根據已知資料，哪個判斷正確？
    options:
      - 只憑同姓不能確定堂親，還要了解他們的家族關係
      - 所有同姓的人都一定是堂兄弟姊妹
      - 兩人同姓，就一定是同一對父母的孩子
      - 兩人同姓，就一定完全沒有任何親屬關係
    answer: 1
    explanation: 堂兄弟姊妹需要有相應的家族關係依據，同姓本身不足以證明。資料不足時，既不能肯定是堂親，也不能肯定完全沒有親屬關係。
