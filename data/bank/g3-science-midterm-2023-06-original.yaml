  - no: 7
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 植物的枝條會向外、向上生長，儘量讓葉子都能爭取到陽光。
    answer: true
    explanation: 植物生長時枝條開展伸長，使葉片能錯開排列，避免彼此遮蔽，儘量爭取更多的陽光進行光合作用。答案依原題獨立推核，非官方答案。
