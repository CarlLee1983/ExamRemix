# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 物質溶解
    stem: 溶解實驗中，甲杯的紀錄卡寫「40℃」，乙杯的紀錄卡寫「40毫升」，兩張卡沒有其他資料。小安說兩張卡都是40，所以兩杯水量一樣多。下列哪個判斷合理？
    options:
      - 甲杯一定比乙杯冷
      - 小安說得對，數字相同就表示水量相同
      - 甲卡記的是水溫，還不知道甲的水量，不能比較兩杯水量
      - 乙杯一定比甲杯熱
    answer: 3
    explanation: ℃是溫度單位，毫升是容量單位。甲卡的40是水溫，乙卡的40是水量，不能把不同測量項目的同一數字當成相同水量；還需要測甲的水量。
    derivedFrom:
      - g3-science-midterm-2023-07-original-01
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 物質溶解
    stem: 物質溶解實驗中，每做完一次測量，就記下最多能完全溶解的平匙數；測得0也照實記0，「—」表示還沒做。小安三格依序記「0、0、—」，小玉三格依序記「0、0、0」。誰實際完成的測量次數較多？
    options:
      - 兩人都完成3次，因為都填了三格
      - 兩人都沒完成，因為沒有大於0的結果
      - 小安，他完成3次，小玉沒有完成
      - 小玉完成3次，小安完成2次
    answer: 4
    explanation: 0是已做完測量的結果，仍算一次；破折號才是尚未做。小安有兩個測量結果，完成2次；小玉有三個測量結果，完成3次，所以小玉較多。不能把零結果當沒做，也不能把未測的格子當一次測量。
    derivedFrom:
      - g3-science-midterm-2023-07-original-01
