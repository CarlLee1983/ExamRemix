questions:
  - no: 1
    type: make-sentence
    subject: 國語
    grade: 3
    stem: 用「由於……因此……」造句，寫出「連續幾天沒給盆栽澆水」造成的結果。
    answer: 由於我連續幾天沒給盆栽澆水，因此盆栽的葉子枯萎了。
    explanation: 範例答案以缺水為原因、葉子枯萎為結果。可寫其他合理結果；只要使用指定句式、包含題目情境、因果合理且句意完整，均可接受。
