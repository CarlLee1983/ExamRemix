questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 家庭經濟
    stem: 爸爸收到公司的通知：「本月薪水下週才會發放。」今天記錄家庭已收到的工作收入時，哪個做法正確？
    options:
      - 先不把這筆尚未收到的薪水記成今天已收到的收入
      - 通知上有金額，就寫成今天已經收到兩次
      - 把全家今天的支出都改寫成這筆薪水
      - 只要有工作，就認為每天收到的薪水都相同
    answer: 1
    explanation: 題目限定記錄「今天已收到」的收入。發薪通知表示預定發放，尚未收到的薪水不能寫成今天已收到；實際領到時再依紀錄登記。
