# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 兩支各有N、S兩極的長條形磁鐵沿同一直線放置，原本相向的兩端會互相吸引。把兩支磁鐵各自在原位置前後轉向，讓每支磁鐵的N、S兩端都交換位置，再沿原來的直線靠近。這時原本的相吸一定會變成相斥。
    answer: false
    explanation: 原本相向的是異極。一支的兩端交換時，另一支也交換，所以兩個相向端仍是異極，會繼續相吸。例如原本N對S，兩支都轉向後就是S對N。
