  - no: 6
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 阿文一開始提出哪一種遊戲？
    options:
      - 跳繩
      - 踢足球
      - 躲避球
      - 畫畫
    answer: 3
    explanation: 第一段明說阿文提出躲避球，因此選③。跳繩是數票後得到最多票的遊戲；本文沒有提議踢足球或畫畫。
    derivedFrom: [ g3-chinese-reading-midterm-2020-01-02 ]
  - no: 7
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 兩人最後為什麼選擇跳繩？
    options:
      - 跳繩的歡呼聲最大
      - 每人寫下選擇後，跳繩得到的票最多
      - 小庭規定全班只能選跳繩
      - 阿文找不到躲避球
    answer: 2
    explanation: 第二段寫每人各寫一種遊戲，數票後跳繩票最多；第三段說兩人依照結果選擇。因此唯一符合原因的是②。歡呼是在阿文提出躲避球時出現，沒有強迫選跳繩或找不到球的情節。
    derivedFrom: [ g3-chinese-reading-midterm-2020-01-03 ]
  - no: 8
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 這個故事主要想告訴我們什麼？
    options:
      - 遊戲時間一定只能玩跳繩
      - 聲音大的人才能提出意見
      - 沒開口的人就沒有自己的想法
      - 讓每個人表示意見，不能只用歡呼聲判斷大家的選擇
    answer: 4
    explanation: 故事的轉折是安靜的同學也有選擇，紙條結果與歡呼聲帶來的印象不同。結尾阿文指出每個人都應有表示意見的機會，故選④；①把本次結果當通則，②③均與故事意思相反。
    derivedFrom: [ g3-chinese-reading-midterm-2020-01-04 ]
