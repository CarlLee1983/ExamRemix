  - no: 7
    type: true-false
    subject: 社會
    grade: 3
    stem: 想買的物品超出目前存款時，可以先存錢，等金額足夠再購買。
    answer: true
    explanation: 延後購買並有計畫累積金錢，是合理的儲蓄方式。
