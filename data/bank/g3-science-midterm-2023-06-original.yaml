questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 一年四季都可以看到不同的植物在開花。
    answer: true
    explanation: 不同植物的花期不一樣，在臺灣一年四季都可以找到開花的植物。這不表示每一種植物都全年開花。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 112學年度第一學期三年級自然科期中定期評量試卷
      section: 一、是非題（每題2分，共24分）
      number: 7
  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 植物的莖可以支撐植物的身體。
    answer: true
    explanation: 莖可以支撐植物的身體，並連接根與葉。不同植物的莖有不同的外形和支撐方式；本題沒有說所有莖都能獨立直立。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 112學年度第一學期三年級自然科期中定期評量試卷
      section: 三、自然科學題組／（四）下列關於植物「莖」的敘述，正確的打✓，錯誤的打×（每格1分，共7分）
      number: 1
  - no: 3
    type: true-false
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 物體受力時，有些物體形狀會改變，有些不會。
    answer: true
    explanation: 物體受力時，有些物體（如海綿、黏土、皮球）容易發生形狀改變，有些堅硬的物體（如木桌、硬幣、水泥牆）受力時形狀則不易看出改變。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 112學年度第一學期三年級自然科期中定期評量試卷
      section: 一、是非題（每題2分，共24分）
      number: 1
  - no: 4
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 動物會移動，是生物，植物不會移動，是非生物。
    answer: false
    explanation: 植物具有生長、繁殖、行光合作用等生命特徵，雖然不能自主行走移動，但仍然屬於生物。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 112學年度第一學期三年級自然科期中定期評量試卷
      section: 一、是非題（每題2分，共24分）
      number: 2
