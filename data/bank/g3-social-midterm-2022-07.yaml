# 普仁111上期中，原第2頁二6；答案自行解題，非官方答案。
questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: "[下列|ㄒㄧㄚˋ ㄌㄧㄝˋ][哪|ㄋㄚˇ][一|ㄧˊ][項|ㄒㄧㄤˋ][是|ㄕˋ][安全|ㄢ ㄑㄩㄢˊ][的|˙ㄉㄜ][行為|ㄒㄧㄥˊ ㄨㄟˊ]？"
    options:
      - "[在|ㄗㄞˋ][停車場|ㄊㄧㄥˊ ㄔㄜ ㄔㄤˇ][玩|ㄨㄢˊ][捉迷藏|ㄓㄨㄛ ㄇㄧˊ ㄘㄤˊ]"
      - "[在|ㄗㄞˋ][教室|ㄐㄧㄠˋ ㄕˋ][裡|ㄌㄧˇ][玩|ㄨㄢˊ][躲避球|ㄉㄨㄛˇ ㄅㄧˋ ㄑㄧㄡˊ]"
      - "[體育|ㄊㄧˇ ㄩˋ][課|ㄎㄜˋ][先|ㄒㄧㄢ][做|ㄗㄨㄛˋ][熱身操|ㄖㄜˋ ㄕㄣ ㄘㄠ][再|ㄗㄞˋ][跑|ㄆㄠˇ][操場|ㄘㄠ ㄔㄤˇ]"
      - "[在|ㄗㄞˋ][外掃區|ㄨㄞˋ ㄙㄠˇ ㄑㄩ][揮舞|ㄏㄨㄟ ㄨˇ][掃把|ㄙㄠˋ ㄅㄚˇ]。"
    answer: 3
    explanation: "體育課先做熱身操，再進行跑步，是四項中安全的運動安排。停車場可能有車輛進出，不適合玩捉迷藏；教室有桌椅等物品，不適合玩躲避球；揮舞掃把可能傷到旁人。本答案為依題意獨立解題，非官方答案。"
    source:
      originalPaper: 111(上)期中評量社會領域試卷
      section: 二、選擇題：每題2分，共34分。
      number: 6
