      - g3-social-midterm-2025-02-12
  - no: 3
    type: true-false
    subject: 社會
    grade: 3
    stem: 小新買腳踏車前，先看看已有多少存款，再規劃還要存多少錢，是有計畫的做法。
    answer: true
    explanation: 了解目標金額與現有存款，能規劃儲蓄。
