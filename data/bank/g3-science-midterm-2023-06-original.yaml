  - no: 6
    type: true-false
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 圓形磁鐵一定比長條形磁鐵的磁力強。
    answer: false
    explanation: 磁鐵磁力的大小與其製造材質、磁鐵體積及充磁強度有關，不能單純從磁鐵的外形（圓形或長條形）來斷定磁力強弱。答案依原題獨立推核，非官方答案。
