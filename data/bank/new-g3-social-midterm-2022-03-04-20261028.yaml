questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 三位同學做完全相同、每次同樣時間的輪值。前三次甲做2次、乙做1次、丙做0次。後面還有3次，若希望六次結束後每人都做2次，後三次應怎麼分？
    options:
      - 甲1次、乙1次、丙1次，完全不必看前面的紀錄
      - 甲0次、乙1次、丙2次
      - 甲2次、乙0次、丙1次
      - 甲3次、乙0次、丙0次
    answer: 2
    explanation: 目標每人總共2次。甲已做2次不必再加，乙還差1次，丙還差2次；0加1加2正好是剩下3次。
    derivedFrom:
      - g3-social-midterm-2022-03-04
