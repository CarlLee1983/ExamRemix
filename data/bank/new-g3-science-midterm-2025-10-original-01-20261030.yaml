# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 生活中的力
    stem: 一件小物品停在水面附近，下方另放有一個小支架，但不知道支架有沒有承受它的重量。保持水量及其他條件不變，慢慢撤去支架，物品便沉下去。因此，這次撤去支架前後的結果，顯示原來的支架有幫忙支撐物品。
    answer: true
    explanation: 原先不知道支架是否承重；保持其他條件不變，撤去支架後物品才沉下，才有證據顯示支架原來有幫忙支撐。不能把原先停在那裡的原因全部歸給水；沉下的物品仍受到水的浮力，並非完全沒有浮力。
