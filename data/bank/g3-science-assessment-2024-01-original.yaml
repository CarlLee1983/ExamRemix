groups:
  - no: 1
    paragraphs:
      - 乾冷而強勁的「九降風」，打造新竹地區特有的柿餅產業。將削皮的柿子，吹風、曝晒後，還要慢慢的捏壓，將水分排出。
      - 一般柿餅製作需要七天至十天，這時吹起的「九降風」乾冷又強勁，成了製作柿餅最佳的助力。
    members:
      - 4
      - 5
    source:
      originalPaper: 113學年度第一學期第一次評量三年級自然科評量試卷
      section: |-
        八、科學閱讀：共2分
        閱讀文章後，選出正確答案填在（　）裡
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 空氣和水
    stem: 可以利用下列哪一種物品收集空氣？
    options:
      - 捕蟲網
      - 塑膠袋
      - 買菜籃
      - 濾網
    answer: 2
    explanation: 塑膠袋的袋身沒有網孔，張開袋口可收集空氣，再收緊袋口留住空氣；其他三種物品有較大的孔洞，空氣容易穿過，不能用相同方式留住所收集的空氣。官方答案為②，獨立推核一致。
    source:
      originalPaper: 113學年度第一學期第一次評量三年級自然科評量試卷
      section: 一、選擇題：每題2分、共20分
      number: 7
  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物的身體
    stem: 果實愈大，裡面的種子愈多。
    answer: false
    explanation: 果實的大小不能單獨用來判定種子數量。不同種類的果實所含種子數量可能不同，不能說較大的果實一定有較多種子。官方答案為╳，獨立推核一致。
    source:
      originalPaper: 113學年度第一學期第一次評量三年級自然科評量試卷
      section: 二、是非題：每題2分、共18分
      number: 2
  - no: 3
    type: true-false
    subject: 自然
    grade: 3
    unit: 空氣和水
    stem: 堵住裝有空氣的注射筒出口，用力壓活塞，活塞會往下移動，放開手後，活塞會往上升。
    answer: true
    explanation: 在一般課堂使用、活塞可正常滑動的注射筒中，出口堵住時，空氣受壓而占的空間變小；放手後，受壓的空氣會把活塞往回推。這是觀察受壓後放手的回升，不是空氣消失。官方答案為○，獨立推核一致。
    source:
      originalPaper: 113學年度第一學期第一次評量三年級自然科評量試卷
      section: 二、是非題：每題2分、共18分
      number: 5
  - no: 4
    type: choice
    subject: 自然
    grade: 3
    unit: 空氣和水
    stem: 下列哪一個不是九降風的特性？
    options:
      - 溫度低
      - 只有晚上才有
      - 風力強
    answer: 2
    explanation: 依本文「乾冷」可對應溫度低，「強勁」可對應風力強；文中沒有「只有晚上才有」的限制。官方答案為②，依文意獨立推核一致；不把未提到的夜間限制加進文章。
    source:
      originalPaper: 113學年度第一學期第一次評量三年級自然科評量試卷
      section: |-
        八、科學閱讀：共2分
        閱讀文章後，選出正確答案填在（　）裡
      number: 1
  - no: 5
    type: choice
    subject: 自然
    grade: 3
    unit: 空氣和水
    stem: 下列哪一項不是製作柿餅時所需要的步驟？
    options:
      - 利用捏壓將柿餅水分排出
      - 利用強勁九降風協助風乾
      - 利用冷凍庫降低柿餅的溫度
    answer: 3
    explanation: 本文提到吹風、曝晒和慢慢捏壓排水，沒有使用冷凍庫的步驟，故選③。官方答案為③，依本文所述製法獨立推核一致；不是宣稱所有現代柿餅製法都不能使用低溫設備。
    source:
