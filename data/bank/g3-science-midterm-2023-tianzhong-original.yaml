    type: true-false
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: "在水上划龍舟，可以看出和風有關。"
    answer: false
    explanation: "划龍舟是靠人用槳划水前進，不是靠風力，所以看不出和風有關；高速列車遇強風停駛、路樹搖晃、海邊掛風向袋才和風有關。答案依原題獨立推核，非官方答案。"
