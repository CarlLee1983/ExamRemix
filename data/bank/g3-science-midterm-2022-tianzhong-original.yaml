    unit: 水的特性
    stem: 暖水袋在熱敷時，會順著身體改變形狀，是因為水沒有固定形狀。
    answer: true
    explanation: 水沒有固定的形狀，會隨容器改變形狀，所以暖水袋能貼合身體。答案依原題獨立推核，非官方答案。
