# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 空氣與水
    stem: 甲、乙面對面站著，兩人的面向相反。同一瞬間，他們觀察同一條被風吹直的布帶，並且都依自己的面向記錄左、右。甲說「布帶向我的左邊伸」，乙說「布帶向我的右邊伸」。這兩筆紀錄一定互相矛盾，至少有一個人看錯了。
    answer: false
    explanation: 兩人的面向相反，甲的左邊可能正是乙的右邊。兩人可以都正確描述同一條布帶，所以不能只看左、右兩個字不同就斷定有人看錯；必須先換成共同的觀察方向。
