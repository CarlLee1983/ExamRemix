questions:
  - no: 1
    type: multi-select
    subject: 社會
    grade: 3
    stem: 圖書館進行安全巡查。哪些地方有題目已說明的危險，需要先避開並通知老師？請勾選所有正確選項。
    options:
      - 書架頂端的重箱已經傾斜，快要掉下來
      - 老師在場帶領閱讀的平整地墊區
      - 逃生門前堆了高高的紙箱，擋住出口
      - 燈光明亮、通道沒有雜物的書桌旁
      - 窗玻璃已裂開，地面還散落碎片
    answer:
      - 1
      - 3
      - 5
    explanation: 重箱可能掉落、出口被堵及玻璃碎片都可能造成傷害，應避開並通報。有人帶領的平整地墊區和通道清空的書桌旁，題目沒有描述危險。
    derivedFrom:
      - g3-social-midterm-2025-02-33
  - no: 2
    type: multi-select
    subject: 社會
    grade: 3
    stem: 大風雨後，學校先檢查戶外環境。哪些區域應暫時停止使用，等老師確認安全？請勾選所有正確選項。
    options:
      - 已檢查完畢並由老師帶隊通行的走道
      - 大樹有折斷的粗樹枝懸在步道上方
      - 排水蓋不見，留下沒有圍住的深洞
      - 已清除積水、確認地面平整的集合區
      - 籃球架歪斜，底座螺絲也鬆脫
    answer:
      - 2
      - 3
      - 5
    explanation: 懸掛的斷枝可能掉落，無蓋深洞可能使人跌入，歪斜籃球架也可能倒下，這些地方應先停用。已檢查並由老師帶領的走道，以及清理確認安全的集合區，不屬題中需要停用之處。
    derivedFrom:
      - g3-social-midterm-2025-02-33
  - no: 3
    type: multi-select
    subject: 社會
    grade: 3
    stem: 自然教室旁的物品存放區有以下情況。哪些情況會增加受傷或誤用物品的風險？請勾選所有正確選項。
    options:
      - 破損瓶子漏出不明液體，周圍沒有警示
      - 工具收在上鎖櫃內，鑰匙由老師保管
      - 清潔藥劑裝在飲料瓶中，瓶身沒有標示
      - 使用剪刀的區域由老師指導，桌面整齊
      - 清掃用具排列整齊，沒有擋住走道
    answer:
      - 1
      - 3
    explanation: 不明液體不應接觸；藥劑裝進未標示的飲料瓶容易被誤認為飲品，應通報老師。其餘選項已說明工具妥善保管、有人指導或走道暢通，沒有上述風險。
    derivedFrom:
      - g3-social-midterm-2025-02-33
  - no: 4
    type: multi-select
    subject: 社會
    grade: 3
    stem: 下課前，老師請大家辨識遊戲場中要避開的危險。哪些觀察需要立刻提醒老師？請勾選所有正確選項。
    options:
      - 老師已檢查過、扶手完整的低矮遊具
      - 地面平坦、沒有車輛的開放活動區
      - 有排隊規則且由老師看顧的遊戲區
      - 鞦韆座板破裂，還露出尖銳金屬
      - 攀爬架下的軟墊破了一大片，露出硬地面
    answer:
      - 4
      - 5
    explanation: 尖銳金屬可能割傷人，攀爬架下缺少完整軟墊會增加跌落受傷的風險，都應先避開並提醒老師。其餘區域已有完整設施或明確管理，題中沒有描述破損危險。
    derivedFrom:
      - g3-social-midterm-2025-02-33
  - no: 5
    type: multi-select
    subject: 社會
    grade: 3
    stem: 放學前，樓層巡查表記下五個位置。哪些位置有妨礙安全通行的情況？請勾選所有正確選項。
    options:
      - 樓梯轉角堆滿掃具，只剩很窄的縫可走
      - 教室門口的地墊捲起，容易絆到人
      - 走廊地面整潔，大家靠邊慢走
      - 廁所出口正在漏水，地上積了一大片水
      - 飲水機旁的電線橫跨走道，沒有固定
    answer:
      - 1
      - 2
      - 4
      - 5
    explanation: 窄縫、捲起地墊、積水及橫跨走道的電線，都會妨礙通行或造成跌倒，應通報處理。整潔且慢走的走廊沒有這些情況。
    derivedFrom:
      - g3-social-midterm-2025-02-33
  - no: 6
    type: multi-select
    subject: 社會
    grade: 3
    stem: 電器使用區正在接受檢查。下列哪些地方有已知的用電危險，學生應遠離並通知老師？請勾選所有正確選項。
    options:
      - 閱讀燈外殼完整，老師已確認正常
      - 插座外蓋破裂，裡面的電線露在外面
      - 電風扇護網完整，放在穩固位置
      - 延長線插頭冒煙，還傳出焦味
      - 電器開關上方沒有滴水，設備也正常
    answer:
      - 2
      - 4
    explanation: 露出的電線與冒煙有焦味的插頭，都是應立即通報的危險；學生應遠離，不自行碰觸或拆修。其餘選項已說明設備完整正常，沒有題中這些異常。
    derivedFrom:
      - g3-social-midterm-2025-02-33
  - no: 7
    type: multi-select
    subject: 社會
    grade: 3
    stem: 學校屋頂有一區正在修繕。哪些描述能讓我們判斷該處不適合學生進入？請勾選所有正確選項。
    options:
      - 入口貼著禁止進入告示，地板卻已拆開
      - 老師帶隊使用的室內教室，地面完整
      - 欄杆已拆除，邊緣沒有防護
      - 工具與尖釘散落在施工區地上
      - 上鎖工具櫃外的安全走廊，已開放通行
    answer:
      - 1
      - 3
      - 4
    explanation: 地板拆開、邊緣無防護和尖釘散落都有明確危險，施工區也已禁止進入。完整教室與確認開放的安全走廊不屬這個修繕危險區。
    derivedFrom:
      - g3-social-midterm-2025-02-33
  - no: 8
    type: multi-select
    subject: 社會
    grade: 3
    stem: 午休後有一處校園角落出現大量蜂隻，老師設好封鎖線並通知人員處理。哪些位置現在應避開？請勾選所有正確選項。
    options:
      - 封鎖線外、老師已確認可走的替代路線
      - 蜂群仍在飛入飛出的巢穴旁
      - 老師帶大家暫時使用的另一間教室
      - 封鎖線內、靠近巢穴的花圃
      - 已由老師確認安全、遠離蜂巢的集合點
    answer:
      - 2
      - 4
    explanation: 蜂巢旁和封鎖線內靠近蜂巢的花圃，都在已知風險範圍，應避開。其餘位置已由老師確認為替代或安全區域，不應把整個校園都當作不能使用。
    derivedFrom:
      - g3-social-midterm-2025-02-33
