questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 家庭經濟
    stem: 小晴已存20元，想在兩週後買50元的書。期限前只會再領兩次零用錢，每次最多可存10元，沒有其他可用的錢，也不借錢或挪用指定用途款項。若兩次都存滿10元，哪個判斷正確？
    options:
      - 只要兩次都有存錢，就能保證到時一定買到50元的書
      - 原來的20元每週都重新算一次，再加20元，就會變成60元
      - 期限前最多有40元，還少10元，原計畫不能如期買到，需調整期限或目標
      - 只算最後一次存的10元，原有存款與前一次存入都不必計算
    answer: 3
    explanation: 原有20元加兩次各10元，共40元；50減40還差10元。持續儲蓄是方法，但仍要核對期限前最多能累積多少，不能把有計畫當成必然已達標。
