questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 戶外學習
    stem: 根據以下小朋友的敘述，哪一位的戶外學習地點最有可能在溫泉區？
    options:
      - 小夫：我看到路邊的小溪冒出熱氣
      - 靜香：門口的龍柱雕刻栩栩如生
      - 大雄：我最喜歡看獅子和老虎
      - 小山：太陽系有八大行星
    answer: 1
    explanation: 小溪冒出熱氣，是四個敘述中最直接與溫泉區熱水現象相關的線索，因此選①。龍柱雕刻較像廟宇的觀察，獅子和老虎較像動物園的觀察，太陽系行星則較像天文學習內容；這些敘述都沒有①那樣直接的溫泉線索。本題問「最有可能」，不是說只憑看到熱氣就能確定是溫泉。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 112學年度上學期三年級社會領域期中評量
      section: 二、選擇題：（每題2分，共30分）
      number: 11
