      alt: 杜鵑花構造示意，四條引線連接四個編號空白作答括號，上方保留A至D的構造名稱代號字庫。
    labels:
      - { x: 25.7143, y: 20, width: 15.0857, height: 8.4, answer: C }
      - { x: 25.7143, y: 86.6, width: 15.0857, height: 8.4, answer: A }
      - { x: 69.4857, y: 20, width: 14.7429, height: 8.4, answer: B }
      - { x: 69.4857, y: 42.4, width: 14.7429, height: 8.4, answer: D }
    explanation: 依原圖引線逐一判讀：①指向單一較長、前端彎曲的雌蕊，填C；②指向具花藥的雄蕊，填A；③指向展開的花瓣，填B；④指向花基部的花萼，填D。四格共用原圖及字庫，依①②③④順序為C、A、B、D，整題四格計一題。答案依完整原圖獨立推核，未取得官方答案。
