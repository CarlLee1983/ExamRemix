    type: choice
    subject: 數學
    grade: 3
    unit: 四位數、倍與長度
    stem: 數線上有一個數在 2100 的右邊，而且在 2200 的左邊。下列哪個數不可能符合？
    options:
      - "2101"
      - "2198"
      - "2099"
      - "2143"
    answer: 3
    explanation: 符合條件的數須大於 2100 且小於 2200。2101、2143、2198 都符合；2099 小於或等於 2100，因此不可能。以每一選項代入兩個不等式核對，只有 2099 不符合。
