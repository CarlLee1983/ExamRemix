questions:
  - no: 1
    type: multi-select
    subject: 自然
    grade: 3
    unit: 植物
    stem: 到校園中觀察植物時，必須要注意的事項？請在（　）中打○。
    options:
      - 要集體行動，不可脫隊。
      - 觸摸植物後，要將手洗乾淨。
      - 盡量撿拾落葉，避免摘取植物身體上的葉子。
      - 盡量到人少、偏僻的地方，這樣才可以採集到比較特別的葉子。
    answer: [1, 2, 3]
    explanation: 觀察時應集體行動、觸摸植物後洗手，並盡量撿拾落葉，避免傷害植物；不應為了採集而到人少偏僻的地方。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 106學年度第一學期三年級自然科期中定期評量試卷
      section: 二、觀察題（每題2分、共30分）
      number: 3
