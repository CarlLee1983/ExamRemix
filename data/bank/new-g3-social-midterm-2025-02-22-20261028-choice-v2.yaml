questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 紀錄顯示小文提出提案、小美附議，接著因時間到而暫停，尚未討論表決。現在能說什麼？
    options:
      - 小美附議就等於全班已通過
      - 提案人能立刻強制全班執行
      - 既然有人附議就不准再問問題
      - 有人支持討論，但不能說已形成通過的決議
    answer: 4
    explanation: 附議表示支持提案進入討論，不能取代後續討論及決定。
    derivedFrom:
      - g3-social-midterm-2025-02-22
