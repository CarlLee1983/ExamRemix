questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 爸爸的哥哥比爸爸年長，但比媽媽年輕。依一般親屬關係，我應怎麼稱呼爸爸這位哥哥？
    options:
      - 叔叔，因為只要比媽媽年輕就都叫叔叔
      - 舅舅，因為他和媽媽年齡接近
      - 外公，因為他比爸爸年長
      - 伯伯，因為他是爸爸的哥哥，與他是否比媽媽年輕無關
    answer: 4
    explanation: 爸爸的哥哥一般稱伯伯，爸爸的弟弟稱叔叔。這項長幼比較以爸爸和其兄弟的關係為準，不是拿他與媽媽比較。
