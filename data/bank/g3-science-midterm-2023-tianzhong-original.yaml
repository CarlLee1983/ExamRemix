    unit: 植物
    stem: "所有植物的葉子一定都是綠色的，不會有其他顏色的葉子。"
    answer: false
    explanation: "有些植物的葉子不是綠色，例如彩葉草的葉子有紅、黃、紫等顏色，所以不能說所有葉子都一定是綠色。答案依原題獨立推核，非官方答案。"
