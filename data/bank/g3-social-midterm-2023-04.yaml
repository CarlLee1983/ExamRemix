    answer: 2
    explanation: "出門前注意電器及瓦斯的關閉情形，有助發現並避免居家危險。拿美工刀嬉鬧可能割傷人，把樓梯扶手當滑梯可能跌落，玩打火機可能燙傷或引發火災，因此只有第2項是預防意外的做法。本答案為依題意獨立解題，非官方答案。"
