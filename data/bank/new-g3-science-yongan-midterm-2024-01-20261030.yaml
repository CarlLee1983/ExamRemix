# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 空氣與水
    stem: 已調平的等臂天平，左盤放甲物品和一顆標準砝碼，右盤放乙物品和另一顆完全相同的標準砝碼，天平正好平衡。現在兩邊各取走那顆砝碼，可以判定甲、乙物品的重量相同。
    answer: true
    explanation: 兩盤原本總重量相同，取走的兩顆砝碼也一樣重，所以剩下的甲、乙物品仍然一樣重。
