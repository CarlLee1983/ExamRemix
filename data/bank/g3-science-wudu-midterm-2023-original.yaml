    stem: 風大時，小草會隨風搖擺、不容易被吹斷，是因為草本莖具有柔軟的特性。
    answer: true
    explanation: 小草的草本莖較柔軟，受風時容易彎曲搖擺；「不容易」不表示無論風多強都不會折斷。答案依題意獨立推核，未取得官方答案。
