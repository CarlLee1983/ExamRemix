    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 有些樹木的枝幹，可以讓鳥類或小動物築巢和休息。
    answer: true
    explanation: 樹木高大繁茂的枝葉與樹幹，提供了許多動物良好的遮蔽與棲息環境，是自然生態中不可或缺的一部分。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
