questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 學習方法
    stem: 下列哪個是有效的學習方法？
    options: [標記、畫線, 畫心智圖, 多練習, 以上皆是]
    answer: 4
    explanation: 標記、畫線能協助找出重點，畫心智圖能整理概念與關係，多練習能幫助熟悉及運用所學；三者都可以是有效的學習方法，因此選④。實際學習仍須理解內容並適當使用方法。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 111學年度第一學期三年級社會科期中定期評量試卷
      section: 二、選擇題：(每個答案2分，共40分)
      number: 8
