# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 兩組果實都已取出全部種子，並核對沒有遺漏。同組每顆果實的種子數相同。甲組3顆果實，共18粒種子；乙組2顆果實，共16粒種子。哪個判斷正確？
    options:
      - 甲組每顆較多，因為3顆比2顆多
      - 甲組每顆較多，因為18粒比16粒多
      - 乙組每顆較多，甲每顆6粒、乙每顆8粒
      - 兩組每顆相同，因為都是果實
    answer: 3
    explanation: 要比較每顆果實，須先分別計算。甲每顆18÷3＝6粒，乙每顆16÷2＝8粒，所以乙每顆較多，不能直接拿兩組總粒數比較。
