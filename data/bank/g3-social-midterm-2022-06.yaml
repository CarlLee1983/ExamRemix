questions:
  - no: 1
    type: multi-select
    subject: 社會
    grade: 3
    stem: |-
      請仔細閱讀下面短文，再回答問題

      大家好，我叫周小齊，我是從臺中轉學來的，現在和爸爸、媽媽和弟弟住在一起。爸爸常說我很開朗大方又外向，我喜歡打棒球和跑步，希望長大以後可以成為職棒選手。
      很高興認識大家，希望能成為大家的好朋友。

      下面哪些項目包含在小齊的自我介紹中，請打ˇ：
    options:
      - 族群
      - 家人
      - 姓名
      - 志願
      - 個性
      - 興趣
    answer:
      - 2
      - 3
      - 4
      - 5
      - 6
    explanation: 短文寫出周小齊的姓名、同住的家人、開朗大方外向的個性、打棒球和跑步的興趣，以及成為職棒選手的志願；從臺中轉學不等於說明族群，因此不勾族群。
    source:
      originalPaper: 111學年度第一學期三年級社會科期中學業評量試卷（一）
      section: 三、綜合題每個答案2分共62分
      number: 2
