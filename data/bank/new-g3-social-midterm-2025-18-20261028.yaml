questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 班級平時約定「上課留在座位上」，學校也已公告「疏散演練時，依老師指示離開教室」。今天演練開始，老師指示全班按路線離開。哪個做法符合這兩項約定？
    options:
      - 不論任何已公告情況，都只讀平時留座位一句而拒絕疏散
      - 依已公告的演練安排，跟著老師離開教室
      - 認為今天有演練，所以以後每堂課都可以自行離開
      - 不管老師指定路線，想去哪裡就去哪裡
    answer: 2
    explanation: 平時留座位與演練依指示疏散有不同適用情境。今天已符合公告的演練情況，應依老師指示離開，不能擴大成平日都可任意離座。
    derivedFrom:
      - g3-social-midterm-2025-18
