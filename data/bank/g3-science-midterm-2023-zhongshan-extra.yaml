questions:
  - no: 1
    type: table-fill
    subject: 自然
    grade: 3
    unit: 植物與物質溶解
    stem: 根據食鹽、二砂和粗粒黑胡椒的特性，在空格中填入正確的代號。甲．黃色　乙．黑色　丙．白色　丁．甜甜的　戊．辛辣刺激　己．沒氣味。
    columns:
      - 食鹽
      - 二砂
      - 粗粒黑胡椒
    rows:
      - label: 顏色
        answers: [ 丙, 甲, 乙 ]
      - label: 氣味
        answers: [ 己, 丁, 戊 ]
    explanation: 食鹽是白色顆粒，沒有特殊氣味，所以填丙、己。二砂是偏黃褐色的砂糖，有甜味，所以填甲、丁。粗粒黑胡椒是黑色，聞起來辛辣刺激，所以填乙、戊。原題未明寫，但顏色與氣味各三個代號、各用一次才能填滿表格，評分依此為準（二砂是甜味而非氣味，但沒氣味已屬食鹽）。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 112學年度第一學期自然科三年級期中考定期評量卷
      section: 十三、根據食鹽、二砂和粗粒黑胡椒的特性回答下面問題，在空格中填入正確的代號：(每個答案1分，共6分)
    doubt: 氣味列混入甜味，且未明示代號不得重用，原答案不適合作為評分依據。
