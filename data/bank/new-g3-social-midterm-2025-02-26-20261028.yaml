questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 我的鉛筆盒還能正常使用，卻想再買一個，家人提醒這個月先保留買課本的錢。哪個做法最符合有計畫的消費？
    options:
      - 立刻把買課本的錢全拿去買新鉛筆盒
      - 故意弄壞原來的鉛筆盒，要求換新
      - 先繼續用原來的鉛筆盒，保留買課本的錢
      - 不和家人說，就拿走預留的錢
    answer: 3
    explanation: 先區分需要和想要，保留購買課本的錢，能兼顧家庭支出安排。其餘做法不是重複購買，就是逃避共同討論。
    derivedFrom:
      - g3-social-midterm-2025-02-26
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    stem: 爸爸的哥哥有一個比我年長的女兒。依一般親屬稱謂，我應稱呼她為什麼？
    options:
      - 堂姊
      - 表姊
      - 姑姑
      - 姪女
    answer: 1
    explanation: 爸爸的哥哥是伯父，伯父的女兒與我是堂親；她比我年長，所以稱堂姊。
    derivedFrom:
      - g3-social-midterm-2025-02-31
  - no: 3
    type: choice
    subject: 社會
    grade: 3
    stem: 班上充分討論兩個都符合校規的活動方案後，約好每人投一票，得票多的方案通過。甲方案得18票，乙方案得10票，接下來哪個做法符合約定？
    options:
      - 改採乙方案，因為提出的人聲音比較大
      - 把乙方案的10票擦掉，當作沒有人反對
      - 不准支持乙方案的同學參加活動
      - 採甲方案，並尊重支持乙方案的同學
    answer: 4
    explanation: 甲方案得票較多，依事先約定應採甲方案；不同意見仍應受到尊重。不能任意更改票數或排除同學。
    derivedFrom:
      - g3-social-midterm-2025-17
  - no: 4
    type: choice
    subject: 社會
    grade: 3
    stem: 班會要從下列提議中選一項，處理全班共同使用物品的問題。哪一項最符合這次目的？
    options:
      - 請同學公布家中的門鎖密碼
      - 討論班上共用球具的借還方式
      - 要求每位同學說出家人的銀行密碼
      - 公布同學不願公開的私人日記
    answer: 2
    explanation: 全班共用球具的借還方式是共同物品的管理問題，適合一起討論；其餘三項涉及個人秘密或私人資料。
    derivedFrom:
      - g3-social-midterm-2025-22
  - no: 5
    type: choice
    subject: 社會
    grade: 3
    stem: 朗讀比賽結束後，我沒有得名，卻發現得獎同學的聲音很清楚。哪個做法最能讓這次競賽成為進步的機會？
    options:
      - 散播得獎同學作弊的假消息
      - 把自己的朗讀稿丟掉，再也不練習
      - 有禮貌地請教他練習的方法，再試著練習
      - 認為沒得獎就代表自己永遠學不會
    answer: 3
    explanation: 欣賞別人的長處、請教方法並練習，可以把競賽經驗轉成自己的學習。其餘做法無助改進。
    derivedFrom:
      - g3-social-midterm-2025-19
  - no: 6
    type: choice
    subject: 社會
    grade: 3
    stem: 班上已討論並修改了圖書借閱規定，也開始試行新規定。接下來哪項工作最有助了解修改是否有效？
    options:
      - 記錄試行時的借還情形，收集同學意見
      - 宣布以後都不能再提出任何意見
      - 不看試行情形，直接認定一定成功
      - 只檢查公告字寫得漂不漂亮，不了解借還情形
    answer: 1
    explanation: 規定修改後仍須觀察執行情形，收集問題與意見，才能了解是否改善原本的問題。
    derivedFrom:
      - g3-social-midterm-2025-26
  - no: 7
    type: choice
    subject: 社會
    grade: 3
    stem: 外婆說她每天晚上八點後就關掉電話準備休息。我想打電話分享學校生活，哪個做法最體貼？
    options:
      - 每晚十點連續打到她接聽
      - 認為她不接電話就是不喜歡我
      - 半夜請家人叫醒她接電話
      - 先和她約好晚上八點前方便通話的時間
    answer: 4
    explanation: 依外婆已說明的作息，先約好她方便且尚未休息的時間通話，能關心親人也尊重休息。
    derivedFrom:
      - g3-social-midterm-2025-02-27
