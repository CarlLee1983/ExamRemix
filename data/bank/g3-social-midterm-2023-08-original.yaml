questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 學習習慣
    stem: 新聞報導：「本屆會考成績優秀的花輪同學，平常回到家就會溫習功課，妥善分配時間，睡前會固定做體操，讓自己有充足的體力。」請問下面哪一個是這位花輪同學成績優秀的主要原因？
    options:
      - 有謙虛有禮的態度
      - 有聰明的頭腦
      - 有上新聞的資格
      - 有良好的習慣
    answer: 4
    explanation: 報導具體寫出溫習功課、妥善分配時間及固定做體操，這些內容都支持「有良好的習慣」，因此依本文提供的證據選④。報導沒有提供謙虛有禮或聰明程度的資料；上新聞是報導的情境，不是文中指出的成績原因。本題是依報導判斷，不是說習慣是實際成績的唯一因素。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 112學年度上學期三年級社會領域期中評量
      section: 二、選擇題：（每題2分，共30分）
      number: 12
