questions:
  - no: 1
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 這位老人為什麼要請年輕人幫助他過馬路？
    options:
      - 老人生病了，沒有人幫助無法過馬路
      - 老人忘記回家的路，需要人幫忙
      - 老人眼睛看不見，要求年輕人協助他
      - 老人希望年輕人能從幫助人中獲得快樂
    answer: 4
    explanation: 老人過馬路後立即挺直腰桿走去，並先問年輕人是否好些；結尾直接點明付出可帶來快樂。依整篇事件與主旨可推④，沒有生病、忘路或看不見的文本證據。
    source:
      originalPaper: 112學年度第一學期三年級國語第一次評量試卷
      section: 五、閱讀測驗(每題2分，共16分)
      number: 1
  - no: 2
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 年輕人原本不想幫助老人，最後還是扶老人過馬路，從這裡可以看出這個年輕人是怎樣的一個人？
    options:
      - 鐵石心腸
      - 心地善良
      - 口是心非
      - 似是而非
    answer: 2
    explanation: 第一段雖說他無心理會，但仍發揮善良本性扶老人過路，支持心地善良。
    source:
      originalPaper: 112學年度第一學期三年級國語第一次評量試卷
      section: 五、閱讀測驗(每題2分，共16分)
      number: 2
  - no: 3
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 全文主旨是在說明什麼？
    options:
      - 幫助老人是天經地義的事
      - 失意時就到路口幫助老人過馬路
      - 付出就是一種快樂
      - 想到有人比自己的處境更糟，就感到快樂
    answer: 3
    explanation: 末兩段將快樂連到付出與幫助他人。④截取處境比較而漏掉幫助行動，與「些許的付出」主旨不符；③完整表達。
    source:
