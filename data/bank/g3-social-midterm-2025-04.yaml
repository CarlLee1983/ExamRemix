# 普仁114上期中；原答案卷未見，以下答案自行解題。
questions:
  - no: 1
    type: true-false
    subject: 社會
    grade: 3
    stem: "[兄友弟恭|ㄒㄩㄥ ㄧㄡˇ ㄉㄧˋ ㄍㄨㄥ][的|˙ㄉㄜ][道理|ㄉㄠˋ ㄌㄧˇ][和|ㄏㄜˊ][我們|ㄨㄛˇ ˙ㄇㄣ][家庭|ㄐㄧㄚ ㄊㄧㄥˊ][的|˙ㄉㄜ][倫理|ㄌㄨㄣˊ ㄌㄧˇ][相關|ㄒㄧㄤ ㄍㄨㄢ]。"
    answer: true
    explanation: "兄友弟恭指兄弟之間相互友愛、尊敬，是家人相處應遵循的道理，因此與家庭倫理有關。教育部《國語辭典簡編本》「兄友弟恭」詞條也以兄弟間相互友愛尊敬解釋。本答案為獨立解題，非官方答案。"
    source:
      originalPaper: 114(上)期中評量社會領域試卷
