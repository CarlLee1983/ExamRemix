  - no: 2
    paragraphs:
      - 小傑和阿凱一起參加班上的跑步比賽。小傑一心想拿第一，還對阿凱說：「等我贏了，一定請你看我的獎狀！」比賽開始後，兩人都努力往前跑，卻是阿凱先到終點。
      - 小傑站在旁邊，心裡酸酸的，不想拍手。他看著阿凱，想起阿凱常常提早到操場練習，下雨時也會留在走廊做伸展。小傑這才想到，阿凱為了比賽，付出了不少努力。
      - 阿凱上臺領獎時，小傑用力拍手。比賽後，他對阿凱說：「雖然我沒拿第一，還是要恭喜你！下次我們再一起練習。」他明白，輸了比賽，也可以真心肯定別人的努力。
