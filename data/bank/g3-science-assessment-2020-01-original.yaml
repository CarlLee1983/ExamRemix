questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 絲瓜花的哪一種構造可以發育成果實？
    options:
      - 花瓣
      - 花萼
      - 雄花
      - 雌花
    answer: 4
    explanation: 絲瓜的雌性花（雌花）帶有子房，子房可以發育成果實。雄性花提供花粉，本身沒有可發育成果實的子房；花瓣和花萼也不是發育成果實的部位。因此四個選項中只有④合理，與校方筆跡式答案④一致。原題以「構造」統稱不同層級的選項，措辭不精確，保留原字；不解作整朵花所有部位都變成果實，也不是說每一朵雌花必定結實。
    source:
      originalPaper: 109學年度第一學期第一次評量三年級自然與生活科技評量試卷
      section: 二、選出正確的答案（選擇題）：每題2分，共26分
      number: 5
