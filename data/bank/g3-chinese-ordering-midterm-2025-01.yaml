groups:
  - no: 1
    paragraphs:
      - |-
        （ㄅ）按照媽媽的指示，我先用盆子裝麵粉，把奶油混入麵粉中。然後，小心翼翼的把雞蛋、牛奶和麵粉攪拌，變成黏黏的麵糊，再用餅模印出自己喜歡的造型。不一會兒，烤盤就排滿了小熊、小花、星星、月亮這幾種形狀。
        重頭戲到了！當餅乾被輕輕的放進烤箱後，餅乾的邊緣慢慢變成焦黃色，我看了感到非常興奮。等了幾分鐘，我就把烤好的餅乾放在盤子上，並且端上餐桌。
      - （ㄆ）我吃了一口，餅乾香脆的口感和濃郁的乳香在口中散開，這一道親手做的點心，真可說是人間美食啊！
      - （ㄇ）昨天媽媽答應我，今天下午要教我做餅乾，我心裡既高興又期待。
    members:
      - 1
    source:
