questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 操場旁有車輛正在進出的通道，老師已規定學生不能進入。玩球時，自己的球滾進通道，車輛還在移動。哪個做法最適當？
    options:
      - 球是自己的，所以可以立刻衝進去拿
      - 先停下來留在安全區，請老師協助處理，不為追回球衝進車道
      - 找另一位同學一起衝進去，兩人就一定安全
      - 自己站到車道中央攔車，再慢慢找球
    answer: 2
    explanation: 取回物品不能優先於人身安全。車輛仍在移動且學生不得進入，應停留安全處由老師協助，不能因物品屬於自己或有人陪伴就忽略危險。
    derivedFrom:
      - g3-social-midterm-2023-03-02
