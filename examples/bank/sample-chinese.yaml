  - no: 3
    type: choice
    subject: 國語
    grade: 3
    unit: 修辭
    stem: "「月亮像一個大銀盤掛在天上。」這句話用了哪一種修辭？"
    options:
      - "擬人"
      - "排比"
      - "譬喻"
      - "設問"
    answer: 3
    explanation: "句中以「像」把月亮比作銀盤，是譬喻。"
    confirmed: true
    source:
      originalPaper: 虛構三年級國語小考
      number: 3
  - no: 4
    type: true-false
    subject: 國語
    grade: 3
    unit: 修辭
    stem: "「小鳥在樹上唱歌」這句話用了擬人的修辭。"
    answer: true
    explanation: "小鳥不會真的唱歌，把小鳥當成人來寫，是擬人。"
    confirmed: true
    source:
      originalPaper: 虛構三年級國語小考
      number: 4
