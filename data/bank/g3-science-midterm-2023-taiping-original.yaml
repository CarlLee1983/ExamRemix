questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 將海綿放入水中擠壓產生氣泡，表示只要有縫隙可能就有空氣。
    answer: true
    explanation: 海綿內部有許多微小縫隙，裡面充滿了空氣；壓入水中擠壓時，空氣被擠出而形成氣泡。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 一、是非題
      number: 10
  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 我們可以觀察物體擺動的幅度，判斷風的強弱，物體擺動的幅度越大，代表風越強。
    answer: true
    explanation: 風吹動樹枝、旗幟或紙條時，擺動幅度越大代表風力越強。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 一、是非題
      number: 11
  - no: 3
    type: true-false
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 風無法用人力製造，一定要靠機器才能產生風，例如：電風扇。
    answer: false
    explanation: 人力也可以製造風，例如用手拿扇子搧風、用嘴吹氣或快速揮動墊板，都能使空氣流動產生風。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 一、是非題
      number: 12
  - no: 4
    type: true-false
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 風對我們的生活有幫助，但風太大時，可能會帶來災害。
    answer: true
    explanation: 適度的風可以吹乾衣物、帶來涼爽、推動風力發電，但強風（如颱風）可能會吹倒路樹與招牌造成災害。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 一、是非題
      number: 13
  - no: 5
    type: true-false
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 搭乘摩天輪時，風可以幫助摩天輪旋轉。
    answer: false
    explanation: 摩天輪是依靠電力馬達帶動旋轉，並不是靠風力驅動；強風時為了安全甚至會暫停營運。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 八、下列哪些是風和我們生活有關的敘述
      number: 3
  - no: 6
    type: true-false
    subject: 自然
    grade: 3
    unit: 水的特性
    stem: 帆船航行在海面上是靠水力來推動的。
    answer: false
    explanation: 帆船主要是利用風吹在船帆上的風力推動船隻前進，而不是靠水力。答案依原題獨立推核，非官方答案。
    source:
