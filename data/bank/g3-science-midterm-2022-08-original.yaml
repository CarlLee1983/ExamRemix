groups:
  - no: 1
    paragraphs:
      - 許多校園裡種植著桃花心木。它的果實成熟後會裂開，裡面的種子就會如同螺旋槳般飛翔，到適合的地方生長。
      - 我們常見的非洲鳳仙花，在開花後會結蒴果。在蒴果成熟時，如果你輕輕碰蒴果，果袋會裂開；接著，小小的種子會彈跳出來，好讓自己到另一個地方成長。
      - 生長在海邊的椰子樹，在椰子成熟以後，可以隨海水漂流到遠方。當浪花把椰子沖到某個適合生長的海岸上時，就會長出新的椰子樹。
      - 每種生物各自有繁衍後代的方法。不會走動的植物，各有獨特的方式讓種子移動，讓他們在另一片天空下生根、發芽、長大。
    members: [2, 3, 4, 5]
    source:
      originalPaper: 111學年度第一學期期中評量試卷自然領域（三年級，麥芽教案公開預覽）
      section: 四、科學閱讀：閱讀下列短文，並選出正確的答案。(2分，8分)
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力
    stem: 進行水的浮力實驗時，把膠泥捏成下列哪一種形狀，最容易浮在水面上？
    options:
      - 像磚頭一樣的塊狀膠泥
      - 像容器一樣的碗形膠泥
      - 像甜甜圈形狀的膠泥
      - 圓球形狀的膠泥
    answer: 2
    explanation: 在一般課堂浮力實驗條件下，將膠泥捏成像容器的碗形，能排開較多水，較容易浮在水面上。
    source:
