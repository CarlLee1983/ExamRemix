  - no: 5
    paragraphs:
      - 星期日，小安在家寫信給住在外地的外婆。他把學校運動會的事寫在信裡，還畫了一張自己跑步的圖，想讓外婆知道他最近的生活。
      - 姐姐在旁邊畫了一張生日卡片，準備一起寄給外婆。爸爸則找出外婆的新地址，幫忙核對信封上的收件姓名和地址。媽媽提醒小安：「收件地址要寫完整，郵差才知道要把信送到哪裡。」
      - 大家把信和卡片放進信封，貼好郵票。傍晚五點，小安和媽媽一起出門，把信投入住家附近的郵筒。小安看著郵筒說：「等外婆收到，就能知道我們想跟她說的事了！」
