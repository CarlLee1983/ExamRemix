questions:
  - no: 1
    type: fill-blank
    writingGuide: four-line
    subject: 英語
    grade: 3
    stem: >-
      依字母順序填寫 A 到 O 的大小寫字母，先大寫再小寫。

      A ___ B b ___ c D d E ___ ___ f G g H ___ I i J j ___ k L ___ M m N ___
      ___ o
    answer:
      - a
      - C
      - e
      - F
      - h
      - K
      - l
      - n
      - O
    explanation: 完整順序是 A a B b C c D d E e F f G g H h I i J j K k L l M m N n O
      o；依空格出現順序填 a、C、e、F、h、K、l、n、O。
    derivedFrom:
      - original-english-sequence-01
