questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 家庭經濟
    stem: 小安共有100元存款，沒有其他錢。他把其中60元規劃買書，又把同一筆100元中的50元規劃買球。兩樣都還沒買。若要同時完成兩個目標，哪個判斷正確？
    options:
      - 60元和50元各自都不到100元，所以一定能同時買齊
      - 兩個目標共需要110元，目前還差10元，不能把同一筆錢重複算
      - 把存款簿上的100元寫兩次，就真的會有200元
      - 只要先想好要買什麼，就不用再比較存款總額
    answer: 2
    explanation: 60加50等於110元，比實際存款100元多10元。同一筆存款不能同時當作兩筆各自完整可用的錢。
    derivedFrom:
      - g3-social-midterm-2021-02-09
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    unit: 家庭經濟
    stem: 家人今天必須付30元急用款。家中有50元儲蓄，今天可取用；另有100元儲蓄放在外地親人家，已確認下週才能拿回。只依這些條件，哪個安排能應付今天的急用？
    options:
      - 只因外地那筆有100元，就說今天已能拿它來付款
      - 把下週才能拿回的100元寫在紙上，當成今天手上的現金
      - 先從今天可取用的50元儲蓄中拿30元
      - 不看取用時間，認為所有存款今天都一定能付出
    answer: 3
    explanation: 應付今天的急用，不只要有足夠金額，也要今天能取用。家中的50元符合這兩項，外地100元還未能拿回。
    derivedFrom:
      - g3-social-midterm-2021-02-09
