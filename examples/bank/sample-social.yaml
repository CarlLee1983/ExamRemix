groups:
  - no: 1
    paragraphs:
      - "社區準備舉辦親子環境日，小朋友和大人一起參加。大家先到圖書館查資料，再到公園整理環境。"
    members: [1, 3, 5]
    source: { originalPaper: 虛構三年級社會小考, section: 社區生活 }
questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 社區生活
    stem: "社區裡的哪一個地方，可以讓居民借書、看報紙？"
    options:
      - "郵局"
      - "圖書館"
      - "消防隊"
      - "市場"
    answer: 2
    explanation: "圖書館提供書籍和報紙，讓居民借閱。"
    source:
      originalPaper: 虛構三年級社會小考
      number: 1
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    unit: 班級生活
    stem: "班上要選出一位值日生，下面哪一種做法最公平？"
    options:
      - "由老師的好朋友當"
      - "大家輪流（輪值表寫成 \\[甲|乙]），每個人都有機會"
      - "只讓成績最好的人當"
      - "誰先搶到誰當"
    answer: 2
    explanation: "輪流讓每位同學都有機會，才是公平的做法。"
    source:
      originalPaper: 虛構三年級社會小考
      number: 2
  - no: 3
    type: choice
    subject: 社會
    grade: 3
    unit: 社區生活
    stem: "社區[公園|ㄍㄨㄥ ㄩㄢˊ]裡的垃圾桶滿出來了，可以請哪一個單位來清理？"
    options:
      - "學校"
      - "醫院"
      - "清潔隊"
      - "銀行"
    answer: 3
    explanation: "清潔隊負責收運垃圾、維護環境整潔。"
    source:
      originalPaper: 虛構三年級社會小考
      number: 3
  - no: 4
    type: true-false
    subject: 社會
    grade: 3
    unit: 班級生活
    stem: "班級的公約是大家一起討論後訂出來，所有同學都要遵守。"
    answer: true
    explanation: "班級公約由全班討論訂定，每個人都有遵守的責任。"
    source:
      originalPaper: 虛構三年級社會小考
      number: 4
  - no: 5
    type: true-false
    subject: 社會
    grade: 3
    unit: 社區生活
    stem: "社區裡的活動只有大人才可以參加。"
    answer: false
    explanation: "許多社區活動，例如市集和環保志工，小朋友也可以參加。"
    source:
      originalPaper: 虛構三年級社會小考
      number: 5
  - no: 6
    type: true-false
    subject: 社會
    grade: 3
    unit: 班級生活
    stem: "班級投票的紀錄表上，同意要寫成 \\[是|否] 中的「是」；方括號在這裡只是符號。"
    answer: true
    explanation: "\\[是|否] 是原樣顯示的符號，不是注音標注。"
    source:
      originalPaper: 虛構三年級社會小考
      number: 6
  - no: 7
    type: classification
    subject: 社會
    grade: 3
    unit: 生活場域
    stem: "請依活動所屬的生活場域，在括號中填入對應符號。"
    categories:
      - { name: "[家庭|ㄐㄧㄚ ㄊㄧㄥˊ]生活", symbol: "△" }
      - { name: "學校生活", symbol: "○" }
      - { name: "社區生活", symbol: "□" }
    statements:
      - { text: "和家人一起整理客廳。", answer: 1 }
      - { text: "參加班會，和同學討論班級公約。", answer: 2 }
      - { text: "和鄰居一起參加社區清潔活動，整理大家共同使用的公園，並將收集的垃圾分類後交給清潔隊。", answer: 3 }
      - { text: "晚餐後和家人分享今天的生活。", answer: 1 }
    explanation: "整理家務及家人分享屬於家庭生活；班會屬於學校生活；維護社區公園屬於社區生活。"
    source: { originalPaper: "虛構三年級社會小考", section: "生活場域分類", number: 7 }
  - no: 8
    type: matching
    subject: 社會
    grade: 3
    unit: 社區生活
    stem: "把左邊的活動與右邊適合的場所連起來；同一場所可以使用多次，也可能不使用。"
    left:
      - { content: "寄信給遠方的親友。", answer: "甲" }
      - { content: "借閱圖書。", answer: "乙" }
      - { content: "在館內閱讀報紙。", answer: "乙" }
    right:
      - code: "甲"
        content:
          image: { src: "sample-social/post-office.svg", alt: "郵局建築示意圖" }
      - { code: "乙", content: "[圖書館|ㄊㄨˊ ㄕㄨ ㄍㄨㄢˇ]" }
      - code: "丙"
        content:
          text: "公園"
          image: { src: "sample-social/park.svg", alt: "有樹木與長椅的公園" }
      - { code: "丁", content: "診所" }
    explanation: "寄信要到郵局，借閱圖書與閱讀館內報紙都可在圖書館進行。"
    source: { originalPaper: "虛構三年級社會小考", section: "社區場所配對", number: 8 }
