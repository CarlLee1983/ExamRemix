questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小組只能在星期一外出，學習目的是親眼觀察活的海水魚。老師已確認下面四個場所的資料，交通也都可安排。依這次的時間和學習目的，應選哪一個？
    options:
      - 甲海洋館：有活海水魚，星期一休館
      - 乙圖書館：星期一開放，只有海水魚圖鑑，沒有活魚
      - 丙美術館：星期一開放，只有魚的畫作，沒有活魚
      - 丁水族館：星期一開放，設有可觀察活海水魚的展示區
    answer: 4
    explanation: 這次要同時符合星期一可進入，以及能親眼觀察活海水魚。丁符合兩項；甲雖有活魚但當天休館，乙和丙雖開放卻只有圖鑑或畫作。答案只依題目已確認的資料，不需猜測任何真實場館的開館日。
