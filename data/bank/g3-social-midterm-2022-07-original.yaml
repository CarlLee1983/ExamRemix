questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 班級活動分工
    stem: 我們在決定班級活動分工方式時，以下哪種方式是不對的？
    options: [輪流, 透過討論, 強迫, 自由選擇]
    answer: 3
    explanation: 輪流、透過討論及自由選擇，都可以用來協調班級活動的分工；強迫他人接受分工，沒有尊重同學表達意願與參與協調，因此選③。實際分工仍須共同協調，兼顧能力與工作份量，並不是任由每個人只挑喜歡的工作。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 111學年度第一學期三年級社會科期中定期評量試卷
      section: 二、選擇題：(每個答案2分，共40分)
      number: 7
