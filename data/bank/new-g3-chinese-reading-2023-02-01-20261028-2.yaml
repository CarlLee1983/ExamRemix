questions:
  - no: 1
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 老師請阿澄到教室後面聽，是希望他發現什麼？
    options:
      - 教室後面有另一面大鼓
      - 鼓聲太響，讓人聽不清楚直笛聲
      - 小萱已經停止吹直笛
      - 站得越遠，越容易記住所有鼓點
    answer: 2
    explanation: 老師照阿澄原來的力道敲鼓，阿澄明明看見小萱還在吹，卻幾乎聽不見笛聲；老師又問除了鼓還聽見什麼，可推知用意是讓他發現鼓聲蓋過直笛，因此選②。①沒有本文證據；③與小萱仍在吹矛盾；④不是這次聆聽所呈現的問題。
    derivedFrom:
      - g3-chinese-reading-2023-02-01
  - no: 2
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 阿澄後來放輕力道，還一邊敲一邊留意笛聲，最能看出他怎樣的表現？
    options:
      - 為了自己出色，完全不管其他人
      - 認為小萱不應該參加合奏
      - 一遇到問題，就放棄自己負責的工作
      - 能顧及同伴，調整自己的做法
    answer: 4
    explanation: 阿澄發現鼓聲蓋住直笛後，主動放輕力道並留意同伴的聲音，表示能顧及同伴、調整做法，選④。①與放輕鼓聲的行動相反；②沒有證據；③與他繼續打鼓、再次練習不符。
    derivedFrom:
      - g3-chinese-reading-2023-02-02
  - no: 3
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 這篇故事主要想告訴我們什麼？
    options:
      - 合奏時要留意同伴，讓不同樂器的聲音互相配合
      - 合奏時只要鼓聲夠大，其他聲音聽不見也沒關係
      - 所有樂器都應該改由同一個人演奏
      - 練習音樂時，只要站遠一點就不用調整演奏方式
    answer: 1
    explanation: 故事從阿澄只顧用力敲，寫到他聽見問題後放輕力道，使鼓點和笛聲都能聽見；結尾也說要讓別人的聲音被聽見。因此主旨是①。②與改善方向相反；③沒有本文支持，也不是兩人一起合奏的方式；④把暫時換位置聆聽誤當成最後的解決辦法。
    derivedFrom:
      - g3-chinese-reading-2023-02-03
