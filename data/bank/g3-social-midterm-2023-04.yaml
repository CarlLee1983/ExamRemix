    answer: 1
    explanation: "本題比較面對家人情緒不穩時的四種回應。在題目沒有暴力或立即危險等其他條件下，溫和溝通較能表達關心與了解需要；離家出走、武力攻擊或故意言語刺激都不是適當的溝通方式。本答案為依題意獨立解題，非官方答案。"
