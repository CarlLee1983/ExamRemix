questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 兩株同種絲瓜都持續長大。甲株旁有支架，卷鬚攀住支架後往上生長；乙株旁沒有支架，莖仍貼著地面延伸。根據這份紀錄，哪個說法正確？
    options:
      - 沒有支架，絲瓜的莖就一定停止生長
      - 絲瓜只要碰到支架，莖就變成木板
      - 支架只能讓葉子生長，與攀爬無關
      - 支架有助絲瓜往上攀爬，沒有支架不表示莖完全不生長
    answer: 4
    explanation: 紀錄中甲株攀住支架往上長，乙株沒有支架仍貼地延伸，因此④同時符合兩株的觀察。絲瓜為蔓性植物，可用卷鬚攀附；支架提供攀附物，不會把莖變成木板，也不是植物能否生長的唯一條件。
    derivedFrom:
      - g3-science-midterm-2025-02-13
