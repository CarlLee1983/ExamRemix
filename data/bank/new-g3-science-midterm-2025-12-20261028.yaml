questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 甲、乙兩條材料原來都長8公分；輕拉時都變成10公分。放手一分鐘後，甲回到8公分，乙仍是10公分。只比較這次記錄的長度，哪個判斷正確？
    options:
      - 甲保留伸長，乙回到原長
      - 乙保留伸長，甲回到原長
      - 兩條都回到原長
      - 兩條都保留伸長
    answer: 2
    explanation: 甲放手後的8公分和原長相同，乙放手後的10公分仍大於原長8公分；所以這次記錄中，乙保留伸長，甲回到原長。只由長度判斷長度，不推論全部形狀特徵或未來一定永遠不恢復。
    derivedFrom:
      - g3-science-midterm-2025-12
