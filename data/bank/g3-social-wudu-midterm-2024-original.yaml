questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 鍾川的父母因為車禍而過世，鍾川可能會面臨什麼樣的情況？
    options:
      - 由爺爺、奶奶扶養
      - 被送到育幼院
      - 由其他家庭收養
      - 以上情形皆可能發生
    answer: 4
    explanation: 失去父母後，孩子可能由親屬照顧、接受機構安置，或在符合程序的情況下由其他家庭收養；實際安排需視孩子的情況與相關程序而定。答案依題意獨立推核，未取得官方答案。
    source:
      originalPaper: 基隆市五堵國民小學113學年度第一學期期中評量三年級社會科試卷
      section: 二、選擇題：每題3分，共36分
      number: 1
