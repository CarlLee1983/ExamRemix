questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 班級的自治活動
    stem: 班上30位同學都依約各投一票，每票只選甲或乙其中一案。計票紀錄卻寫甲17票、乙16票。此時哪個處理最合理？
    options:
      - 直接宣布甲案通過，因為17票比16票多
      - 先核對選票與計票紀錄，暫不依這組數字宣布通過案
      - 把多出的3票全從乙案扣掉，再宣布甲案通過
      - 事後把規則改成有人可以多投，再接受這份紀錄
    answer: 2
    explanation: 依條件應只有30票，但17加16是33票，紀錄與一人一票的人數不符。應先查核原因，不能只憑這份矛盾紀錄宣布結果。
    derivedFrom:
      - g3-social-midterm-2021-02-01
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    unit: 班級的自治活動
    stem: 24位同學討論兩個都可實行的活動方案後，各投一票。甲、乙各得12票。事前只約定「票較多的方案通過」，沒有約定同票時怎麼處理。哪個判斷最合理？
    options:
      - 甲案先提出，所以已依原定規則通過
      - 主席喜歡乙案，所以乙案已依原定規則通過
      - 每案都有12人支持，所以兩案都已符合票較多而通過
      - 目前沒有票較多的一案，應共同商量同票的處理方式
    answer: 4
    explanation: 12票和12票相同，沒有一案票較多。不能從未訂出的提出先後或主席喜好決定結果，應先共同處理規則未涵蓋的情況。
    derivedFrom:
      - g3-social-midterm-2021-02-01
