  - no: 3
    paragraphs:
      - 星期六，社區活動室舉辦玩具整理日。早上九點，林叔叔先清點大家送來的玩具，把完整的放在長桌上，缺少零件的放在另一張桌子上。
      - 小米和哥哥負責替完整的玩具貼上編號，再把編號和玩具名稱記在本子上。陳阿姨則在另一張桌子旁修理玩具。修好的玩具也會登記，還沒修好的放進紅箱子，暫時不能借出。
      - 下午兩點，孩子們才開始挑選要借的玩具。每個人選好後，都要在本子上寫下姓名和玩具編號，讓大家知道玩具借給了誰。
      - 小米看到一個孩子想拿紅箱子裡的小車，便指著還沒裝好的輪子提醒他：「這台車還沒修好，要等修好了才能借喔！」孩子點點頭，改選長桌上已經登記好的積木。
