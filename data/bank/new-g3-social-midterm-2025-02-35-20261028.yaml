questions:
  - no: 1
    type: multi-select
    subject: 社會
    grade: 3
    stem: 家人規畫週末出遊，並在結束後記帳。哪些記錄表示這次已經付出交通費？請勾選所有正確選項。
    options:
      - 使用付費停車場，已繳停車費
      - 步行到公園，沒有付車錢
      - 搭公車，已付車資
      - 領到公司補發的交通津貼
      - 搭計程車，已付車資
    answer:
      - 1
      - 3
      - 5
    explanation: 已繳的停車費、公車及計程車車資，都是家庭付出的交通費。免費步行沒有付錢；領到津貼是收到錢，不是這次的交通支出。
    derivedFrom:
      - g3-social-midterm-2025-02-35
  - no: 2
    type: multi-select
    subject: 社會
    grade: 3
    stem: 家人整理開學的教育支出。哪些項目已經付錢，應記在這次的教育支出欄？請勾選所有正確選項。
    options:
      - 免費借到圖書館的故事書
      - 付費買了上課需要的作業簿
      - 收到親戚送的舊書包，沒有付錢
      - 繳交學校通知的校外教學費
      - 只把想買的文具列入願望清單，還沒買
    answer:
      - 2
      - 4
    explanation: 作業簿及校外教學費已付錢，屬於這次教育支出。免費借書、接受贈送沒有付款；尚未購買的願望清單也不是已發生的支出。
    derivedFrom:
      - g3-social-midterm-2025-02-35
  - no: 3
    type: multi-select
    subject: 社會
    grade: 3
    stem: 換季時，家人記錄和衣物有關的收支。哪些記錄表示家庭付出了衣物費用？請勾選所有正確選項。
    options:
      - 付錢買一件合身的外套
      - 付費請人修改制服褲長
      - 把不合穿的衣服送給親友，沒有付運費
      - 到店裡試穿鞋子後離開，沒有購買
      - 付錢購買上學要穿的鞋子
    answer:
      - 1
      - 2
      - 5
    explanation: 買外套、修改褲長及買鞋子都已付款，是衣物相關支出。送出原有衣物且沒有費用，以及只試穿沒購買，都沒有題中所說的付款。
    derivedFrom:
      - g3-social-midterm-2025-02-35
  - no: 4
    type: multi-select
    subject: 社會
    grade: 3
    stem: 家庭記帳本要記下維持居住環境所付的錢。哪些記錄符合這項說明？請勾選所有正確選項。
    options:
      - 家人領到工作薪水
      - 把家具位置重新排列，沒有花錢
      - 繳交房屋租金
      - 付費請師傅修理漏水的水管
      - 繳交家中本月電費
    answer:
      - 3
      - 4
      - 5
    explanation: 租金、水管修理費及家用電費，都是為居住生活付出的錢。領薪水是收入；沒有付費的家具重排不產生這筆支出。
    derivedFrom:
      - g3-social-midterm-2025-02-35
  - no: 5
    type: multi-select
    subject: 社會
    grade: 3
    stem: 家人帶孩子看診後整理紀錄。哪些項目是這次實際付出的醫療支出？請勾選所有正確選項。
    options:
      - 繳交診所掛號費
      - 付費購買醫師開立的藥品
      - 醫院退還先前多收的費用
      - 付費接受醫師安排的檢查
      - 只是詢問門診時間，沒有付費
    answer:
      - 1
      - 2
      - 4
    explanation: 掛號、藥品和檢查已付款，屬醫療支出。退回多收費用是收到退款；免費詢問門診時間沒有付款。
    derivedFrom:
      - g3-social-midterm-2025-02-35
  - no: 6
    type: multi-select
    subject: 社會
    grade: 3
    stem: 家人檢查休閒活動的收據。哪些記錄表示這次已付出休閒活動費用？請勾選所有正確選項。
    options:
      - 在免費開放的河濱步道散步
      - 付錢買遊樂園門票
      - 收到朋友送的電影票，沒有付任何費用
      - 付費租借腳踏車遊玩
      - 付錢參加陶土體驗活動
    answer:
      - 2
      - 4
      - 5
    explanation: 遊樂園門票、租腳踏車及陶土體驗都已付款，屬休閒活動支出。免費散步與收到免費贈票，在題述情況下沒有付錢。
    derivedFrom:
      - g3-social-midterm-2025-02-35
  - no: 7
    type: multi-select
    subject: 社會
    grade: 3
    stem: 家人記錄這週已付出的飲食費用。哪些記錄應列入？請勾選所有正確選項。
    options:
      - 在市場付錢買蔬菜
      - 付錢購買全家的早餐
      - 自己在家喝水，這一項沒有另外付款
      - 店家退回買錯商品的款項
      - 只看餐廳菜單，還沒點餐或付款
    answer:
      - 1
      - 2
    explanation: 買蔬菜與早餐已付款，應記入題述飲食支出。這一項沒有另外付款的喝水、收到退款及只看菜單，都沒有題中要求的已付費紀錄；家用水費若另有繳付，則另外記帳。
    derivedFrom:
      - g3-social-midterm-2025-02-35
  - no: 8
    type: multi-select
    subject: 社會
    grade: 3
    stem: 下列是家人整理的一日記錄。哪些事情使家中的錢付給外面的人或店家，屬於家庭支出？請勾選所有正確選項。
    options:
      - 把錢從自己的存錢筒移到自己的抽屜
      - 家人收到工作的薪水
      - 付費寄送包裹
      - 付費修理壞掉的家用電風扇
      - 付錢買新的垃圾袋
    answer:
      - 3
      - 4
      - 5
    explanation: 寄包裹、修電風扇及買垃圾袋都把錢付給外面的人或店家，屬家庭支出。自己的錢換存放位置沒有對外付款；收到薪水則是收入。
    derivedFrom:
      - g3-social-midterm-2025-02-35
