questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物與磁鐵
    stem: 同一個指北針平放不動，磁針先停穩。把一塊磁鐵放近後，磁針偏轉；把磁鐵移遠，磁針又回到原來的方向。若要用這個指北針辨認教室的方位，下列做法較合理的是哪一個？
    options:
      - 讓磁鐵貼近指北針，偏轉得越多越準確
      - 磁針偏轉表示教室的北方跟著搬走了
      - 先把磁鐵移遠，待磁針停穩再判讀
      - 只要用手把磁針壓住，就能得到正確方位
    answer: 3
    explanation: 指北針的磁針會受附近磁鐵影響而偏轉，應移開這項干擾並等磁針停穩再判讀，故選③。磁針受影響不表示教室的方位改變；貼近磁鐵或用手壓住磁針都不能使它可靠指示方位。這裡不把磁北直接當作精確地理正北。
