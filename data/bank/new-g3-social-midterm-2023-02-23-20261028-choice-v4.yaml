questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 班會原提案是「每週三整理圖書，每次10分鐘」。接著分開表決兩項修正：改成每週五的修正獲通過；改成每次20分鐘的修正未通過。班上依這兩項表決結果形成決議。記錄應寫哪個內容？
    options:
      - 每週三整理圖書，每次10分鐘
      - 每週五整理圖書，每次20分鐘
      - 每週五整理圖書，每次10分鐘
      - 每週三整理圖書，每次20分鐘
    answer: 3
    explanation: 整理日修正通過，因此改為週五；每次20分鐘的修正沒有通過，所以仍為原案10分鐘。記錄要整合實際通過的內容，不能把所有建議都當成決議。
