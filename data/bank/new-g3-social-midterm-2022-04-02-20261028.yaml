questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 體育股長今天請假，老師同意小芸這一次幫忙借球，其他幹部安排都沒有改。有人說「小芸借過球，所以已經正式當上體育股長」。哪個判斷正確？
    options:
      - 任何同學只要碰過球，立刻都成為體育股長
      - 原體育股長請假一天，就代表全班幹部全部失去職務
      - 工作可以有人暫時幫忙，所以班上永遠不需要分配職責
      - 這次是經同意的臨時代辦，不能只因借過一次球就認為職務已改
    answer: 4
    explanation: 題目已說只是這一次代借且幹部安排未改。能幫忙執行一次工作，不等於正式職務已經轉移。
    derivedFrom:
      - g3-social-midterm-2022-04-02
