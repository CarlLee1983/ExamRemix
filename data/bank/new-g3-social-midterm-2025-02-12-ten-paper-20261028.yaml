      - g3-social-midterm-2025-02-12
  - no: 4
    type: true-false
    subject: 社會
    grade: 3
    stem: 存錢買背包時，不管自己還差多少錢就花光存款，也不會影響原來的購買計畫。
    answer: false
    explanation: 花光存款會減少累積的金額，影響原定計畫。
