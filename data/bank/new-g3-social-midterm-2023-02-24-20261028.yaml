questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 班上原本只寫「借球後要收好」，常有人不清楚誰要放回、何時放回。若要針對這兩個缺漏補得具體明確，哪個寫法最好？
    options:
      - 當天借球登記的同學，在下課鈴響前把球放回球架
      - 大家有空時，感覺差不多就可以了
      - 做個好同學，就一定完全不會有收球問題
      - 只把「收好」兩個字寫得更大，不補責任和時間
    answer: 1
    explanation: 明確的規範要讓人知道由誰、在何時完成什麼事。第一個寫法補上登記借球者與下課鈴響前，能實際檢查是否完成。
