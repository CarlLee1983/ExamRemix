questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 班上已聽取兩方案的說明與不同意見，問題都獲回應，但仍有人支持不同方案。依約定可投票決定時，哪個做法合理？
    options:
      - 必須所有人想法完全一樣才能表決
      - 把仍有不同意見的人趕出班級
      - 讓聲音最大的人取消其他選票
      - 依規則表決，不必把仍有不同意見當作禁止表決的理由
    answer: 4
    explanation: 充分討論是讓意見與問題得到表達和回應，不代表所有人必須先同意同一方案。
    derivedFrom:
      - g3-social-midterm-2020-02-21
