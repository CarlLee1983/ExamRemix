# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 物質溶解
    stem: 老師先以相同水量、水溫和同一支量匙確認：這次實驗中，食鹽最多能完全溶解4平匙，砂糖最多能完全溶解8平匙。一份未知的白色物質只可能是其中一種，以完全相同的條件測試，依序加入，前4平匙已完全溶解，第5平匙也能完全溶解。因此，即使還沒測到它的最多溶解量，也能判定這份物質是砂糖。
    answer: true
    explanation: 若是食鹽，在這次校準的條件下不可能完全溶解第5平匙，因此可以排除食鹽。只有兩種可能時，剩下的就是砂糖。4平匙與8平匙是題目提供的本次實驗紀錄，並非所有水量、水溫下的固定數字。
    derivedFrom:
      - g3-science-midterm-2025-03-additional-original-01
  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 物質溶解
    stem: 同一杯水先加入3平匙砂糖並全部溶解。沒有倒出液體、沒有加水、也沒有改變水溫，再加入2平匙砂糖，也全部溶解。同學說：「後一筆寫2，所以這杯目前總共只溶解了2平匙砂糖。」
    answer: false
    explanation: 後一筆2平匙是後來新增的量，先前已溶解的3平匙仍在同一杯中，所以目前共已溶解3＋2＝5平匙。這是目前已溶解量，不表示最多只能溶解5平匙。
    derivedFrom:
      - g3-science-midterm-2025-03-additional-original-01
