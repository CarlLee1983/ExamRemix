    type: fill-blank
    subject: 自然
    grade: 3
    unit: 植物
    stem: 請在空格中填入正確的代號。Ａ．白千層　Ｂ．椰子樹　Ｃ．木棉　Ｄ．台灣欒樹　Ｅ．槭葉牽牛。樹皮為淡褐色，會一層一層剝落。答：___。
    answer:
      - Ａ
    explanation: 白千層的樹皮呈淡褐色至褐白色，具有像薄紙般一層層剝落的特徵，故填Ａ。本題由原卷第三大題第1題第(5)小題獨立節選，保留原字庫及辨識描述；非整組五小題採錄。未取得官方答案，答案依題意與植物特徵獨立核對。
    source:
      originalPaper: 109學年度第一學期期中評量試卷自然領域（三年級，壽山國小公開原卷之獨立節選版）
      section: 三、填充題：1.下列是關於植物的莖的描述，請在（ ）中填入正確的代號。每格2分，共10分（本題僅節選第5小題，不沿用整組配分）
      number: 5
