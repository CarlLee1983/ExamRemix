questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 班級自治活動
    stem: 下列哪一項不屬於班級自治活動？
    options:
      - 開班會
      - 制定班級公約
      - 選舉班級幹部
      - 到電腦教室上資訊課
    answer: 4
    explanation: 開班會、制定班級公約及選舉班級幹部，都是同學參與處理班級共同事務的自治活動；到電腦教室上資訊課是課程學習，不屬於本題所問的班級自治活動。因此選④，並不是說資訊課不重要。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 114學年度第一學期三年級社會領域期中評量卷
      section: 班級自治活動／二、選擇題
      number: 1
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    unit: 班級自治活動
    stem: 表決的方式有很多種，下列哪一項不屬於恰當的表決方式？
    options:
      - 老師抽籤決定
      - 舉手投票決定
      - 匿名投票決定
      - 以上都不是恰當的表決方式
    answer: 1
    explanation: 舉手投票與匿名投票都能讓參與者表達選擇；老師抽籤是用抽籤結果決定，不是依參與者的投票表決。因此選①，④也不對。這裡區分抽籤和投票，不是說老師不能投票，也不是說所有經同意使用抽籤的決定方式都不恰當。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 114學年度第一學期三年級社會領域期中評量卷
      section: 班級自治活動／二、選擇題
      number: 2
  - no: 3
    type: choice
    subject: 社會
    grade: 3
    unit: 家庭經濟活動
    stem: 儲蓄的方式有很多種，下列哪一項不屬於恰當的儲蓄方法？
    options:
      - 把錢拿去買文具
      - 把零錢投進撲滿裡
      - 把壓歲錢存在郵局
      - 規劃自己的存錢計畫
    answer: 1
    explanation: 儲蓄是把錢留存下來供之後使用；投入撲滿、存在郵局，以及規劃存錢計畫，都與儲蓄有關。把錢拿去買文具是支出，不是儲蓄方法，所以選①；需要時購買文具可以是恰當的消費，本題不是說買文具本身不恰當。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 114學年度第一學期三年級社會領域期中評量卷
      section: 家庭經濟活動／二、選擇題
      number: 2
