questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 奇妙的溶解
    stem: 媽媽要煮紫菜蛋花湯時，加入哪一樣食材會溶解在湯裡？
    options:
      - 白胡椒粉
      - 雞蛋
      - 紫菜
      - 食鹽
    answer: 4
    explanation: 在一般煮湯情況下，食鹽可以溶解在水中；白胡椒粉、雞蛋和紫菜不會像食鹽一樣溶解。答案依題意獨立推核，未取得官方答案。
    source:
      originalPaper: 基隆市五堵國民小學113學年度第一學期中評量三年級自然科試卷
      section: 二、選擇題（每題2分，共24分）
      number: 8
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 奇妙的溶解
    stem: 讀取量筒的正確方法是
    options:
      - 眼睛往下看水面最低處
      - 自己可以看到方便就好
      - 平視水面最低處
      - 平視水面最高處
    answer: 3
    explanation: 量筒盛水時，眼睛與液面同高，平視水面彎月面的最低處讀取刻度，避免視線高低造成誤差。答案依題意獨立推核，未取得官方答案。
    source:
      originalPaper: 基隆市五堵國民小學113學年度第一學期中評量三年級自然科試卷
      section: 二、選擇題（每題2分，共24分）
