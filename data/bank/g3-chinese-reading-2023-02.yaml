groups:
  - no: 1
    paragraphs:
      - 有一個年輕人非常失意，不但沒有公司願意僱用他，三餐還得靠親朋好友幫忙。這一天，當他正要經過路口時，一個彎腰駝背的老人對他說：「年輕人，你願意幫助我走過這條馬路嗎？」心煩意亂的他，無心理會這位老人，不過看到來來往往的車輛，他還是發揮善良本性，扶著老人穿過那條車水馬龍的路口。
      - 「你覺得好些了嗎？年輕人！」年輕人回答：「喔！是……我想是的！」這時，老人突然挺直腰桿向前走去，漸漸消失在茫茫街頭。
      - 在幫助別人後，心裡真的舒坦多了。
      - 在失意的時候，想想還有那些比自己處境更糟的人，其實，些許的付出就能給你最大的快樂。
    members:
      - 1
      - 2
      - 3
    source: &a1
      originalPaper: 112學年度第一學期三年級國語第一次評量試卷
      section: 五、閱讀測驗(每題2分，共16分)
  - no: 2
    paragraphs:
      - 太陽公公剛起來的時候，便可以在公園裡聽到小鳥「啾！啾！啾！」唱著美妙的歌曲。
      - 花圃裡的花也都展開燦爛的笑容，美麗的蝴蝶也在公園裡各處翩翩起舞。池塘裡的鯉魚也以優雅的舞姿來迎接美好的早晨，還有好多的阿公、阿嬤一早就在公園裡，隨著收音機的音樂一起做早操。
      - 下午放學時間，有很多小朋友手拉著手跑來公園盪秋千、溜滑梯和玩翹翹板。
      - 另外許多叔叔、阿姨們，也一起來公園裡慢跑和散步。
      - 公園裡除了有花、草和樹木，也聚集了好多的人，公園真是一個熱鬧的地方！
    members:
      - 4
      - 5
      - 6
      - 7
      - 8
