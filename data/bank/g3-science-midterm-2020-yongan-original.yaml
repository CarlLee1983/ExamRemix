  - no: 7
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: "臺灣一年四季都盛產不同的水果，而每種水果裡的種子數量也不同，下列哪一種水果裡的種子數量最多呢？"
    options:
      - "龍眼"
      - "木瓜"
      - "水蜜桃"
      - "葡萄"
    answer: 2
    explanation: "龍眼和水蜜桃各只有一顆大種子，葡萄約一到幾粒，木瓜切開有很多黑色小種子，數量最多。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: 高雄市永安國小109學年度上學期三年級自然與生活科技科領域期中評量
      section: "二、選擇題：每題 2 分、共 20 分"
      number: 4
  - no: 8
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: "通常花最外層的構造是什麼？"
    options:
      - "花萼"
      - "雄蕊"
      - "雌蕊"
      - "花瓣"
    answer: 1
    explanation: "花由外而內依序是花萼、花瓣、雄蕊、雌蕊，最外層是花萼。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: 高雄市永安國小109學年度上學期三年級自然與生活科技科領域期中評量
      section: "二、選擇題：每題 2 分、共 20 分"
      number: 6
  - no: 9
    type: multi-select
    subject: 自然
    grade: 3
    unit: 植物
    stem: "哪些是屬於植物身體的一部分？請勾選是的選項。"
    options:
      - "(1)根"
      - "(2)腳"
      - "(3)葉"
      - "(4)種子"
      - "(5)翅膀"
      - "(6)果實"
    answer: [1, 3, 4, 6]
    explanation: "植物的身體有根、莖、葉、花、果實和種子；腳和翅膀是動物的身體部位，不屬於植物，所以勾選根、葉、種子和果實。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: 高雄市永安國小109學年度上學期三年級自然與生活科技科領域期中評量
      section: "三、勾選題：每答 2 分、共 34 分／第5題"
      number: 5
