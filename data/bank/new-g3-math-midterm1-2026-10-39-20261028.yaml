    type: word-problem
    subject: 數學
    grade: 3
    unit: 四位數的加減
    stem: 學校舉行義賣，第一天收入 2468 元，第二天收入 4000 元。第二天比第一天多收入多少元？
    answer: 多 1532 元。
    explanation: 比較相差多少，用較大的數減較小的數：$4000 - 2468 = 1532$，相差 1532 元。
    derivedFrom:
      - g3-math-midterm1-2026-10-39
