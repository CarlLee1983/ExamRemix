  - no: 14
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 竹製存錢筒是利用竹子的哪個部位製作的？
    options:
      - 根
      - 莖
      - 葉
      - 花
    answer: 2
    explanation: 竹子的竹筒部位屬於植物的「莖」（地下有地下莖，地上直立的是地上莖），質地堅韌中空，常用於製作容器或工藝品。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 二、選擇題
      number: 5
  - no: 15
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 木製椅子是人們將植物應用在生活的哪個部分？
    options:
      - 衣
      - 住
      - 行
      - 育樂
    answer: 2
    explanation: 木製家具（如桌椅、櫥櫃）屬於日常生活中的「住」（居家生活）相關應用。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 二、選擇題
