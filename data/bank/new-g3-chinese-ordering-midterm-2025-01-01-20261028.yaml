groups:
  - no: 1
    paragraphs:
      - （ㄅ）我從袋子裡拿出紙條，爸爸把紙條接成長尾巴，牢牢貼在風箏後面。我拉住線，爸爸托著修好的風箏，等風吹來時輕輕放手。風箏離開爸爸的手，慢慢向上升。
      - （ㄆ）換上長尾巴的風箏終於平穩地飛在空中，沒有再向一邊倒下。我抬頭望著它，在草地上慢慢放線。原來修好一條斷掉的尾巴，就能讓我們繼續享受放風箏的樂趣。
      - （ㄇ）星期日下午，我和爸爸帶著風箏到草地上。風箏才升起來，就向一邊倒下。爸爸撿起風箏，發現後面的長尾巴斷了，決定先把它修好，再試一次。
    members:
      - 1
    derivedFrom: g3-chinese-ordering-midterm-2025-01#1
  - no: 2
    paragraphs:
      - （ㄅ）落葉和細枝清乾淨後，花圃旁的積水漸漸退去，原來被水蓋住的地面露了出來。我們把工具收好，看到水能順利流走，都覺得剛才的努力很有用。
      - （ㄆ）雨停後，學校花圃旁還積著一大片水。老師走近一看，發現排水口被落葉蓋住了，水流不出去，便請我們協助清理。
      - （ㄇ）老師帶來手套和夾子。我們站在乾燥的地方，用夾子把排水口上的落葉一片片夾起，放進桶子。老師再把卡在口邊的細枝取出，原本不動的積水開始流向排水口。
    members:
      - 2
    derivedFrom: g3-chinese-ordering-midterm-2025-01#1
  - no: 3
    paragraphs:
      - （ㄅ）老師先按頁碼把鬆開的書頁排好，再用適合修書的膠帶固定。我扶住書身，老師把封面對齊貼回去。我們輕輕翻動幾頁，檢查還有沒有鬆開的地方。
      - （ㄆ）午休時，我在圖書角選了一本故事書。正要翻開，卻發現封面和書身分開了，幾張書頁也鬆了。我怕書頁散落，便把書交給老師，請她教我修補。
      - （ㄇ）修補完成後，封面和書頁都固定好了。這本書又能整齊地放回架上，讓大家借閱。我借走它，翻頁時格外小心，希望這本修好的書能陪伴更多同學。
    members:
      - 3
    derivedFrom: g3-chinese-ordering-midterm-2025-01#1
  - no: 4
    paragraphs:
      - （ㄅ）出門騎車前，我按了一下腳踏車鈴。鈴沒有響，還在車把上晃來晃去。媽媽檢查後，發現固定車鈴的螺絲鬆了，便說要先鎖緊，才能出門。
      - （ㄆ）鎖好的車鈴發出清脆的聲音，穩穩地留在車把上。媽媽確認修好了，才陪我到公園騎車。出門前的檢查，讓我們發現並處理了鬆動的車鈴。
      - （ㄇ）媽媽取來工具，請我扶穩車把。她把車鈴轉回合適的位置，再慢慢鎖緊螺絲。我試著碰一碰車鈴，確認它不再搖晃，又伸手按下鈴上的小把手。
    members:
      - 4
    derivedFrom: g3-chinese-ordering-midterm-2025-01#1
  - no: 5
    paragraphs:
      - （ㄅ）架好網後，小鳥沒辦法再啄走網下的種子。過了幾天，受到保護的菜地冒出一排小苗。我和奶奶站在網外看著，開心地等它們慢慢長大。
      - （ㄆ）我幫奶奶拿來細竹竿，她把竹竿插在菜地四周，再將網架高，罩住播種的地方。我們把網邊固定好，檢查沒有留下讓小鳥鑽進去的空隙，才收起工具。
      - （ㄇ）奶奶在菜園播下種子後，發現小鳥常飛來啄食，泥土上留下許多小洞。為了保護剛播下的種子，她決定在這塊菜地上搭一張網。
    members:
      - 5
    derivedFrom: g3-chinese-ordering-midterm-2025-01#1
  - no: 6
    paragraphs:
      - （ㄅ）爸爸先關掉開關，打開電池盒，把舊電池取出。我們看著盒內的標記，請爸爸把新電池放好，再蓋緊盒蓋。妹妹把火車放回軌道，小心地重新打開開關。
      - （ㄆ）換過電池的火車開始往前走，順著軌道繞完一圈。妹妹跟著火車拍手，原本停住的小車又能跑了。我們把舊電池另外收好，等下次交到回收的地方。
      - （ㄇ）妹妹把玩具火車放上軌道，打開開關，火車卻一動也不動。爸爸查看電池盒，發現裡面的電池用完了，便拿出新的電池，準備替火車換上。
    members:
      - 6
    derivedFrom: g3-chinese-ordering-midterm-2025-01#1
  - no: 7
    paragraphs:
      - （ㄅ）白布幕架好後，大家坐在布前，清楚看見紙偶的影子在幕上走動。影子戲終於可以開始了。原本空著的教室角落，成了我們表演故事的小舞臺。
      - （ㄆ）班上要表演影子戲，老師帶來手電筒和紙偶，卻發現教室裡沒有合適的白布幕。沒有布幕，大家很難一起看清楚影子，我們便決定先搭好它。
      - （ㄇ）我們把白布攤平，老師將布的兩邊固定在架子上。同學站在布後，試著把手電筒照向紙偶。老師調整燈和紙偶的位置，直到白布上出現清楚的影子。
    members:
      - 7
    derivedFrom: g3-chinese-ordering-midterm-2025-01#1
  - no: 8
    paragraphs:
      - （ㄅ）我扶著路牌，老師把底座移到平穩的地面，再放上重物固定。我們確認箭頭指向報到處，字也沒有被擋住。老師退後幾步，查看從岔路口能不能看清楚。
      - （ㄆ）運動會當天，通往報到處的路牌被風吹倒了。幾位家長走到岔路口，不知道該往哪裡走。老師發現後，請我一起把倒下的路牌重新立好。
      - （ㄇ）重新立好的路牌穩穩站在岔路口，家長看著箭頭，順利走到報到處。老師不用再一直站在那裡指路了。我看到路牌發揮作用，覺得幫忙整理很有意義。
    members:
      - 8
    derivedFrom: g3-chinese-ordering-midterm-2025-01#1
  - no: 9
    paragraphs:
      - （ㄅ）我和弟弟快拼好一幅圖時，發現少了一片。桌面和盒子裡都沒有，弟弟想起剛才有東西掉到沙發旁。我們便決定到沙發下找一找。
      - （ㄆ）找回的那片拼圖正好放進空著的位置，整幅圖終於完整了。我和弟弟一起欣賞拼好的風景。多虧仔細尋找，我們才找回掉落的拼圖，完成這幅作品。
      - （ㄇ）我拿手電筒照向沙發底下，果然看到缺少的那片拼圖。爸爸幫忙把沙發移開一點，弟弟撿起拼圖，擦掉上面的灰塵，再拿回桌邊。
    members:
      - 9
    derivedFrom: g3-chinese-ordering-midterm-2025-01#1
