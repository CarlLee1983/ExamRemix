questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 家裡確定需要買一件文具。兩店商品、品質和到貨時間都相同：甲店商品18元，這次另須付7元運費；乙店商品22元，這次免運費，沒有其他費用。只比較這次要付的總金額，哪個判斷正確？
    options:
      - 甲店較省，因為商品標價18元低於22元
      - 兩店總金額相同，因為買的是同樣商品
      - 甲店仍只算18元，因為運費不算這次要付的錢
      - 乙店合計22元，比甲店合計25元少3元
    answer: 4
    explanation: 甲店這次要付18加7，共25元；乙店共22元，少付3元。比較支出應把這次必付的費用合計，不能只看商品標價。
