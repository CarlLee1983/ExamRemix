    explanation: "舅媽是母親兄弟的妻子，也就是舅舅的太太，又稱舅母。阿姨的媽媽及媽媽的媽媽都不是舅媽，因此第2項是唯一正解。稱謂另以教育部《國語辭典簡編本》「舅媽」詞條核對。本答案為獨立解題，非官方答案。"
    source:
      originalPaper: 112(上)期中評量社會領域試卷
