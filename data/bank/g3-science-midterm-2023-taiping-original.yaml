      section: 九、下列是水可以傳送動力，改變物品位置的例子
      number: 3
  - no: 7
    type: true-false
    subject: 自然
    grade: 3
    unit: 水的特性
    stem: 洗車時，可以利用水柱沖走車上的灰塵，這是水可以傳送動力的例子。
    answer: true
    explanation: 高壓水柱噴出的水具有動能與力量，能將車身上的灰塵推移沖走，是水傳送動力改變物品位置的應用。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 九、下列是水可以傳送動力，改變物品位置的例子
      number: 4
  - no: 8
    type: choice
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 我們可以利用空氣的什麼特性做出造型氣球？
    options:
      - 佔有空間
      - 具有重量
      - 沒有固定形狀
      - 沒有顏色
    answer: 3
    explanation: 空氣沒有固定的形狀，會隨著容器或氣球的擠壓變形而改變形狀，因此能做出各種造型氣球。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 二、選擇題
      number: 7
  - no: 9
    type: choice
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 下列哪個物品無法拿來裝空氣？
    options:
      - 塑膠袋
      - 寶特瓶
      - 馬克杯
      - 漁網
    answer: 4
    explanation: 漁網具有許多較大的網眼與網孔，空氣會直接從網孔流失，因此無法用來收集或裝空氣。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 二、選擇題
      number: 8
  - no: 10
    type: choice
    subject: 自然
    grade: 3
    unit: 水的特性
    stem: 用注射筒分別裝空氣和水，對準紙偶，將活塞向下壓，哪一個可以推倒紙偶？
    options:
      - 裝水
      - 裝空氣
      - 兩種都可以
      - 兩種都不行
    answer: 3
    explanation: 不論是空氣還是水，在推壓活塞時都能流動並傳送力量，將前方較輕的紙偶推倒。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 二、選擇題
      number: 9
  - no: 11
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 植物有各式各樣的外形，這和植物的生長環境有很大的關係。
    answer: true
    explanation: 植物的根、莖、葉等構造型態，常常是為了適應其所處的生存環境（如水分、陽光等）而演化出的多樣特徵。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
