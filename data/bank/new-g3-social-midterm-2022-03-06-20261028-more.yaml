questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 有人準備把洗水彩筆後的髒水倒進校園生態池，並說：「水裡沒有紙屑，就不算破壞環境。」哪個回應最合理？
    options:
      - 沒有紙屑，就能把任何液體倒進池裡
      - 先把髒水倒進去，再觀察生物會不會受影響
      - 水中即使沒有固體垃圾，也可能有污染物，應依老師指示處理洗筆水
      - 只要池面看起來清澈，就不需要維護
    answer: 3
    explanation: 洗筆水含有顏料等物質；沒有可見紙屑不代表不會污染生態池。應維護公共環境，不把廢水倒進池中。
    derivedFrom:
      - g3-social-midterm-2022-03-06
