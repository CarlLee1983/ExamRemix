questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小組找到三份校方資料：2012年的指引寫圖書館在校園東側；2019年的搬遷公告記載圖書館從東側遷到西側；2025年的指引寫圖書館在西側。用這些資料介紹學校變化，哪個說法合理？
    options:
      - 2025年的指引在西側，所以2012年的指引一定寫錯
      - 2019年搬遷後，2012年當時的圖書館位置也變成西側
      - 兩本指引描述不同時期，位置不同不表示其中必有一本寫錯
      - 資料寫了兩種位置，所以完全無法介紹任何年代的位置
    answer: 3
    explanation: 2012年在東側，2019年搬到西側，2025年在西側，三份資料可以相容。比較資料時要注意描述的時間，不能只因不同年代的位置不同就認定有錯。
