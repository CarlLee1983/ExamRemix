questions:
  - no: 1
    type: fill-blank
    writingGuide: four-line
    subject: 英語
    grade: 3
    stem: |-
      依字母順序補寫 A 到 J 的大寫字母。
      ___ ___ C ___ ___ F G H I J
    answer:
      - A
      - B
      - D
      - E
    explanation: 完整順序是 A B C D E F G H I J；依空格出現順序填 A、B、D、E。前兩格是 C 前的 A、B；中間兩格是 C 與
      F 之間的 D、E。
    derivedFrom:
      - original-english-sequence-02
