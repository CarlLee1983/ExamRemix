  - no: 4
    type: true-false
    subject: 社會
    grade: 3
    stem: 我稱呼鄰居「伯伯」，就表示他一定是爸爸的哥哥。
    answer: false
    explanation: 伯伯也可用來稱呼沒有親屬關係的長輩。
    derivedFrom:
      - g3-social-midterm-2025-02-01
  - no: 5
    type: true-false
    subject: 社會
    grade: 3
    stem: 向經常照顧自己的鄰居說「阿姨，謝謝您」，可以傳達親切與感謝。
    answer: true
    explanation: 借用親屬稱呼配合有禮貌的語句，能表達親近。
    derivedFrom:
      - g3-social-midterm-2025-02-01
  - no: 6
    type: true-false
    subject: 社會
    grade: 3
    stem: 只有有血緣關係的人，才可以用親屬稱呼表達親切。
    answer: false
    explanation: 人們也會借用親屬稱呼稱呼非親屬。
    derivedFrom:
      - g3-social-midterm-2025-02-01
  - no: 7
    type: true-false
    subject: 社會
    grade: 3
    stem: 和熟識的修車店老闆打招呼時，稱呼他「叔叔」，可能比直接喊「喂」更親切。
    answer: true
    explanation: 合宜的稱呼有助表達禮貌及親切感。
