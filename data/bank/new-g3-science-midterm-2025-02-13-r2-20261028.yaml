    stem: 一株藤蔓的莖沿著竹竿纏繞向上長。要繼續記錄它如何利用竹竿生長，最應保留哪項觀察？
    options:
      - 只記錄花瓣的顏色
      - 只記錄葉子的氣味
      - 莖接觸竹竿的位置及纏繞方式
      - 只記錄種子的形狀
    answer: 3
    explanation: 要理解攀爬方式，需要記錄莖與支撐物的接觸和纏繞，無關資訊不能回答此問題。
