# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 老師確認一份標本只可能來自甲、乙、丙其中一株。甲每節長一片葉子、花瓣白色；乙每節長兩片相對的葉子、花瓣黃色；丙每節長兩片相對的葉子、花瓣白色。標本紀錄寫著「對生，花瓣為白色」，它來自哪一株？
    options:
      - 三株都有可能
      - 甲
      - 乙
      - 丙
    answer: 4
    explanation: 對生表示每節長兩片相對的葉子，所以先保留乙、丙；再依白色花瓣排除乙，只剩丙。只看對生或只看白花，都不能單獨選出答案。
