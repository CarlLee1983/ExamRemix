questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 關於植物的敘述，哪一項是正確的？
    options:
      - 所有的花都有雄蕊和雌蕊
      - 果實可以保護裡面的種子
      - 所有植物的果實都可食用
      - 所有植物都在每年3月開花
    answer: 2
    explanation: 果實包覆種子，能在種子發育期間提供保護，因此②正確。並非所有的花都同時有雄蕊和雌蕊，也不是所有果實都可食用；不同植物的開花時間也不同，不會全都固定在3月。答案依原題與植物學資料獨立推核，未取得官方解答。
    source:
      originalPaper: 111學年度三年級第1學期自然領域期中評量試卷
      section: 三、選擇題(4格)
      number: 2
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 霏霏做實驗時不小心將長條形磁鐵摔成兩半，請問將上面寫S極的那一半，用斷裂的地方靠近另一個磁鐵的S極時，會發生什麼事？
    image:
      src: g3-science-midterm-2022-05-original/02.png
      alt: 左側是原有S標示、右邊斷裂的磁鐵半段；右側另一條磁鐵左端標S、右端標N。斷裂面未標示磁極。
    options:
      - 互相排斥
      - 互相吸引
      - 沒有反應
      - 先排斥後吸引
    answer: 2
    explanation: 長條形磁鐵分成兩半後，每一半仍有N極和S極。原來標S的那半段，在斷裂處會形成N極；把這個新斷口靠近另一磁鐵的S極時，異極相吸，所以選②。斷口沒有畫出N標示，需根據分成兩段後仍各有兩極的性質判斷；不是只讀圖上既有的兩個S字。答案依原題與物理資料獨立推核，未取得官方解答。
    source:
      originalPaper: 111學年度三年級第1學期自然領域期中評量試卷
      section: 十、選擇題(2格)
      number: 2
