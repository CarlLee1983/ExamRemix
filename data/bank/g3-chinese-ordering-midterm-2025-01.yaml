questions:
  - no: 1
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 請將上面前三段的內容，依照起因→經過→結果排列。
    options:
      - ㄅ→ㄆ→ㄇ
      - ㄆ→ㄇ→ㄅ
      - ㄅ→ㄇ→ㄆ
      - ㄇ→ㄅ→ㄆ
    answer: 4
    explanation: ㄇ交代昨天媽媽答應今天下午教我做餅乾，構成起因；ㄅ按媽媽指示拌麵糊、壓模、烘烤並端上餐桌，是製作經過；ㄆ描述吃到自己親手做的餅乾及感受，是結果。唯一符合起因→經過→結果的是④ㄇ→ㄅ→ㄆ。
    source:
      originalPaper: 114學年度上學期三年級國語期中評量試卷
