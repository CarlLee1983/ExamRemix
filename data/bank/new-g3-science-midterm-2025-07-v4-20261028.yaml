questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 老師準備甲、乙兩杯相同的水並標記水位。甲杯放入一株植物，只有根浸在水裡；乙杯不放植物。兩杯杯口都封好，甲杯穿過莖的地方也封好，確認沒有漏水，放在同一處。一天後甲杯水位降低、乙杯水位沒有明顯變化。這項比較最支持哪個說法？
    options:
      - 只要放在同一處，兩杯水位就一定會降低相同高度
      - 甲杯水位降低與植物從根取得水分有關
      - 水位降低足以證明甲杯的花直接從杯內吸水
      - 甲杯水位降低只可能是杯子漏水，與植物無關
    answer: 2
    explanation: 兩杯都封好且不漏水，無植株的乙杯水位沒有明顯變化；甲杯只有根接觸水而水位降低，支持水分經根進入植株。這不是說任何未封口杯子的水位下降都只能由植物造成。
