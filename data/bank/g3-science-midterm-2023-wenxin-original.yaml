questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: "植物的莖和葉都是綠色的。"
    answer: false
    explanation: "許多植物的葉子是綠色的，但葉子也有紫色、紅色、黃色等顏色，木本植物的莖多為褐色，所以莖和葉不一定都是綠色。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: "112學年度第1學期臺中市北屯區文心國小三年級自然科學領域第一次定期評量試卷"
      section: "一、是非題(1答2分，共20分)"
      number: 4
  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: "圓形磁鐵其中一面的磁極如果是N極，另一面一定是S極。"
    answer: true
    explanation: "一個磁鐵有兩個磁極，圓形磁鐵的兩個磁極分別在兩個圓面，一面是N極時，另一面就是S極。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: "112學年度第1學期臺中市北屯區文心國小三年級自然科學領域第一次定期評量試卷"
      section: "一、是非題(1答2分，共20分)"
      number: 7
  - no: 3
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: "莖和葉子相連接的部位叫什麼？"
    options:
      - "葉形"
      - "葉脈"
      - "葉緣"
      - "葉柄"
    answer: 4
    explanation: "葉子與莖相連的細長部位叫葉柄，葉形、葉脈、葉緣則是葉片本身的特徵。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: "112學年度第1學期臺中市北屯區文心國小三年級自然科學領域第一次定期評量試卷"
      section: "二、選擇題(1答2分，共42分)"
      number: 11
  - no: 4
    type: choice
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: "浮在水面上的飛盤，受到水給它哪個方向的力？"
    options:
      - "左右搖擺"
      - "向下"
      - "向上"
      - "不一定，方向會不停變化"
    answer: 3
    explanation: "浮在水面上的物體受到水向上的力，這個力叫浮力，方向向上，飛盤因此能浮在水面。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: "112學年度第1學期臺中市北屯區文心國小三年級自然科學領域第一次定期評量試卷"
      section: "二、選擇題(1答2分，共42分)"
      number: 15
