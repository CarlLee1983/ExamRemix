    subject: 自然
    grade: 3
    unit: 力與磁鐵
    stem: 我們可以利用什麼來表示力的大小？
    options:
      - 線段的長度
      - 箭頭
      - 線段的顏色
      - 接觸物體的點
    answer: 1
    explanation: 表示力的圖示中，用線段長度表示力的大小，箭頭表示方向；顏色與作用點不表示力的大小。
