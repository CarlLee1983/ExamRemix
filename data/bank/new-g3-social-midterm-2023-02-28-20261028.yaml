questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小組查校史，找到三篇文章都寫同一年創校。但三篇都註明資料抄自同一本校史，沒有其他資料。哪個判斷最合理？
    options:
      - 只要分成三個網頁，就一定是三份互不相關的證據
      - 重複寫同一年就能保證沒有抄錯
      - 資料出現在網路上，所以內容一定全錯
      - 三篇共用同一來源，還不能把它們當成三個獨立來源互相證明
    answer: 4
    explanation: 三篇的資料都來自同一本校史，來源並沒有因網頁數量增加而變成三個。要互相查核，還需注意資料是否真正獨立。
    derivedFrom:
      - g3-social-midterm-2023-02-28
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    stem: 校史資料只寫「1928年校舍動工，1930年校舍完工」，沒有寫創校日期。同學直接把1928年填成創校年。只根據這份資料，哪個判斷正確？
    options:
      - 目前只能確定動工和完工年份，還不能把動工年直接當創校年
      - 所有學校都一定在校舍動工當年創校
      - 完工年1930一定比動工年更適合直接當創校年
      - 把1928和1930相加，就能求出創校年
    answer: 1
    explanation: 資料記錄的是動工和完工兩件事，沒有提供創校年。不同事件的年份不能在沒有依據時直接互換。
    derivedFrom:
      - g3-social-midterm-2023-02-28
