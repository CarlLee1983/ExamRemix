questions:
  - no: 1
    type: choice
    subject: 國語
    grade: 3
    unit: 字詞
    stem: "下列哪一個詞語的意思是「一點聲音也沒有」？"
    options:
      - "熱鬧"
      - "寂靜"
      - "喧嘩"
      - "嘈雜"
    answer: 2
    explanation: "「寂靜」指安靜、沒有聲音；其餘三個都是吵鬧的意思。"
    confirmed: true
    source:
      originalPaper: 虛構三年級國語小考
      number: 1
