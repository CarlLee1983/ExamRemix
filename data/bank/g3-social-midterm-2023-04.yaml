    stem: "[上課|ㄕㄤˋ ㄎㄜˋ][時|ㄕˊ]，[老師|ㄌㄠˇ ㄕ][在|ㄗㄞˋ][黑板|ㄏㄟ ㄅㄢˇ][上|ㄕㄤˋ][寫|ㄒㄧㄝˇ][了|˙ㄌㄜ]「[舅媽|ㄐㄧㄡˋ ㄇㄚ]」[兩|ㄌㄧㄤˇ][個|ㄍㄜˋ][字|ㄗˋ]；[下列|ㄒㄧㄚˋ ㄌㄧㄝˋ][哪|ㄋㄚˇ][一|ㄧˊ][個|ㄍㄜˋ][才|ㄘㄞˊ][是|ㄕˋ][老師|ㄌㄠˇ ㄕ][對|ㄉㄨㄟˋ][這|ㄓㄜˋ][兩|ㄌㄧㄤˇ][字|ㄗˋ][的|˙ㄉㄜ][解釋|ㄐㄧㄝˇ ㄕˋ]"
    options:
      - "[是|ㄕˋ][阿姨|ㄚ ㄧˊ][的|˙ㄉㄜ][媽媽|ㄇㄚ ㄇㄚ]"
      - "[是|ㄕˋ][舅舅|ㄐㄧㄡˋ ㄐㄧㄡˋ][的|˙ㄉㄜ][太太|ㄊㄞˋ ㄊㄞˋ]"
