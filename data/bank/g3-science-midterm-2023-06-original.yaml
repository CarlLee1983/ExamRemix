    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 水可以使物體移動、傳送動力。
    answer: true
    explanation: 水流具有力量，流動的水可以推動水車轉動或使玩具船順流移動，因此水可以傳送動力使物體移動。答案依原題獨立推核，非官方答案。
