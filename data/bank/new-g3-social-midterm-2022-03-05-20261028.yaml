questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小組想了解「住家附近的環境，為什麼會讓同學採用不同的上學方式」。已經記下誰搭船、誰搭公車。接著蒐集哪一項資料，最能幫助小組了解居住環境的影響？
    options:
      - 同學最喜歡哪一種早餐
      - 同學書包的顏色是否相同
      - 同學放學後最愛看哪一個節目
      - 住家到學校之間有哪些河流、道路和橋梁
    answer: 4
    explanation: 要了解居住環境如何影響上學方式，需要知道住家到學校沿路的河流、道路、橋梁等條件；這些資料有助說明哪些交通方式可通行。早餐、書包顏色和喜歡的節目，不能直接說明路線環境。這是選擇與調查問題相關的資料，不僅憑搭船就斷定每位同學的全部生活情況。
    derivedFrom:
      - g3-social-midterm-2022-03-05
