  - no: 1
    paragraphs:
      - 阿樂向小芸借了一本故事書，約好星期五歸還。星期四，他翻頁太急，把其中一頁撕破了。阿樂怕小芸生氣，便把破頁夾回書裡，心想只要不翻到那一頁，也許就不會被發現。
      - 可是，看著桌上的書，阿樂越想越不安心。他想：「書是我弄破的，不能假裝什麼事都沒發生。」第二天，他把破頁攤給小芸看，說明經過並道歉，又問：「你願意讓我把這頁補好嗎？」
      - 小芸點點頭，找來膠帶，和阿樂一起把書頁補好。阿樂說：「早點把事情說清楚，比一直藏著安心多了。以後借東西，我會更小心。」
