      - { x: 58.48, y: 65.32, width: 4.55, height: 6.18, answer: '—' }
    explanation: 第1棕葉狗尾草、第3竹葉、第4百合具有平行脈，在這三格打勾。第2洋紫荊與第5菩提樹葉是網狀脈，不勾選。答案卷的「—」表示不勾選。
