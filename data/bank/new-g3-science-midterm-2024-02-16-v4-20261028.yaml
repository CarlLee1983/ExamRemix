questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 水的特性
    stem: 用兩個相同的水車，在相同位置和高度倒水。甲次倒水持續10秒，水車共轉12圈；乙次倒水持續20秒，水車共轉16圈。同學只因為16圈比12圈多，就說乙次一定轉得比較快。哪個檢查方法較適當？
    options:
      - 只比較最後的總圈數，不必考慮用了多久
      - 只看哪次使用的杯子較大
      - 只看兩次水車是否都曾轉動，不必再記圈數
      - 取相同長度的一段時間，例如各5秒，記錄這段時間內轉了幾圈再比較
    answer: 4
    explanation: 轉動快慢要把時間長度一起考慮。兩次記錄持續時間不同，不能只以總圈數直接排名；改比較各5秒內的圈數，就能用相同時間觀察水推動水車的快慢。
