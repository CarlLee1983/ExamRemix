  - no: 9
    type: true-false
    subject: 社會
    grade: 3
    stem: 老師說大家口中的「林媽媽」是熱心的家長志工，這個稱呼可以表達大家對她的親近。
    answer: true
    explanation: 借用媽媽等親屬稱呼，可表達親切，不表示每個人都是她的孩子。
