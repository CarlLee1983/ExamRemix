questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小安把課本和習作全部塞進一個沒有分類的收納盒，抽屜表面變整齊了，但每次上課都要翻找很久。他說：「只要看起來整齊，就一定能更快找到上課用品。」哪個回應最合理？
    options:
      - 整理也要方便取用，可以依科目分類放在固定位置
      - 抽屜表面看不到課本，就表示已經很容易找到
      - 每次找很久才拿到課本，也證明這種整理方式很有效率
      - 要提升學習效率，只要把收納盒換成漂亮的顏色
    answer: 1
    explanation: 整理上課用品的目的包含減少翻找、方便學習，不只是讓抽屜表面好看。題目已觀察到未分類造成取用費時，依科目分類並放在固定位置是直接改善方式；看不見用品、翻找費時或換盒子顏色，都不能證明取用更有效率。
    derivedFrom:
      - g3-social-midterm-2023-02-29
