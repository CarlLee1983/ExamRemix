# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 同一段沒有分枝的莖共有五個已標記的節，代號甲、乙、丙、丁、戊，每個代號只用一次。三人各正確記下由下往上的連續三個節：小安記「甲→丙→乙」，小玉記「丙→乙→戊」，小明記「乙→戊→丁」。合起來，整段莖由下往上的順序是哪一個？
    options:
      - 丙→乙→戊→丁→甲
      - 甲→丙→乙→丁→戊
      - 丁→甲→丙→乙→戊
      - 甲→丙→乙→戊→丁
    answer: 4
    explanation: 先用共同的丙→乙把前兩筆接成甲→丙→乙→戊，再依第三筆乙→戊→丁接上丁，得到甲→丙→乙→戊→丁。須保留每筆的方向與先後關係。
