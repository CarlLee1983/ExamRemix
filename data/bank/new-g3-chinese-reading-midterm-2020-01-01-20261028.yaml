    stem: 讀了這篇文章，請寫出一起設計找書籤遊戲的兩位主角是___和___。
    answer: [ 小晴, 阿哲 ]
    explanation: 第一段明說小晴和阿哲一起替班上設計遊戲，後面也由兩人試走及修改說明。兩個空格填小晴與阿哲，順序可以互換。
    derivedFrom: [ g3-chinese-reading-midterm-2020-01-01 ]
  - no: 2
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 一開始寫下找書籤說明的人，覺得自己的說明有什麼優點？
    options:
      - 寫了許多不同的走法
      - 只用一句話，很容易看懂
      - 告訴大家書籤的顏色
      - 列出教室裡所有的東西
    answer: 2
    explanation: 第一段直接說阿哲覺得短短一句話，大家一定很容易看懂，故選②。說明沒有列出多種走法、書籤顏色或教室裡所有的東西。
    derivedFrom: [ g3-chinese-reading-midterm-2020-01-02 ]
  - no: 3
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 第一次照著說明試走的人，為什麼沒有走到藏書籤的地方？
    options:
      - 她忘了帶走那張說明
      - 花盆已經被人搬走
      - 她故意不照說明走
      - 說明沒指明哪扇門，兩人從不同的門出去
    answer: 4
    explanation: 第二段明說兩人分別從前門與後門出去，而最初說明只寫門口。不同的起點使小晴走到櫃子前，故選④；其他原因都沒有本文支持。
    derivedFrom: [ g3-chinese-reading-midterm-2020-01-03 ]
  - no: 4
    type: choice
    subject: 國語
    grade: 3
    unit: 閱讀
    stem: 這個故事主要想告訴我們什麼？
    options:
      - 說明要寫清楚，不能以為別人都懂自己的意思
      - 說明越短，別人就一定越容易看懂
      - 所有遊戲都要把東西藏在花盆旁
      - 只要換一扇門，就能找到所有東西
    answer: 1
    explanation: 故事先呈現說明沒寫清楚門的位置，接著寫兩人補上具體位置才成功。最後阿哲也指出別人不一定知道自己知道的事，因此主旨為①；②與結果相反，③④只是把特定情節錯當通則。
    derivedFrom: [ g3-chinese-reading-midterm-2020-01-04 ]
