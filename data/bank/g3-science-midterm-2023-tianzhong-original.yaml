  - no: 3
    type: true-false
    subject: 自然
    grade: 3
    unit: 水的特性
    stem: "水可以裝在各種形狀的容器中，且形狀會隨著容器的形狀改變。"
    answer: true
    explanation: "水沒有固定的形狀，裝進什麼形狀的容器，水就變成那個形狀。答案依原題獨立推核，非官方答案。"
