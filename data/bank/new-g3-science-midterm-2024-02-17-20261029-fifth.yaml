questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 一個透明硬瓶裝著空氣，瓶蓋已蓋好。把瓶子橫放，瓶身仍保持原來的形狀。小華說：「這能證明瓶內空氣有固定形狀。」哪個說法正確？
    options:
      - 小華正確，瓶身不變形就表示空氣有固定形狀
      - 小華不正確，瓶身形狀不變不能證明空氣有固定形狀
      - 小華正確，空氣只有裝進氣球才沒有固定形狀
      - 小華不正確，因為蓋好蓋子的瓶內一定沒有空氣
    answer: 2
    explanation: 硬瓶瓶身保持形狀，是容器本身的性質，不能據此說空氣有固定形狀。空氣會充滿容器內可占有的空間；瓶內的空氣不會因為蓋上蓋子就消失。①混淆容器與內容物，③把空氣的性質限於氣球，④否認題目已給定的空氣，只有②正確。
