      - g3-social-midterm-2025-02-12
  - no: 5
    type: true-false
    subject: 社會
    grade: 3
    stem: 小琪把每次零用錢的一部分留下，累積到足夠時再買畫具，是儲蓄的做法。
    answer: true
    explanation: 固定留下部分金錢可逐步累積目標金額。
