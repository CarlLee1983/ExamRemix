# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 多采多姿的植物
    stem: 紅盆和藍盆裡的植物各有不會更換的標籤。第1天左邊紅盆有6片葉，右邊藍盆有4片葉；第7天搬動位置後，左邊藍盆有6片葉，右邊紅盆有7片葉。兩株原來的葉子都沒有掉落或被摘走。這段時間哪株新長出的葉子較多？
    options:
      - 藍盆，增加2片，比紅盆增加1片多
      - 一樣多，因為都觀察了7天
      - 紅盆，因為左邊從6片變成7片
      - 紅盆，因為最後7片比6片多
    answer: 1
    explanation: 應按不變的盆栽標籤配對兩天紀錄，不能按移動過的位置。紅盆由6片增至7片，增加1片；藍盆由4片增至6片，增加2片，所以藍盆較多。原葉沒有減少，增加量才等於新長葉片數。
    derivedFrom:
      - g3-science-midterm-2025-10-original-02
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 多采多姿的植物
    stem: 同學仔細觀察同一株植物的同一個標記節。新葉出現後都保留著，沒有掉落、被摘或萎縮消失。第1、3、5天觀察時，均確認沒有可見的新葉；第7天觀察時，見到一片新葉。這片新葉開始看得見的時間，一定落在哪個範圍？
    options:
      - 第3天觀察後，到第5天觀察前
      - 第5天觀察後，到第7天觀察時
      - 一定正好是第7天觀察的那一刻
      - 第1天觀察後，到第3天觀察前
    answer: 2
    explanation: 第5天還確認沒有可見的新葉，第7天已看見，所以開始可見的時間介於這兩次觀察之間，最晚是第7天觀察時，不能斷定恰好在第7天觀察那一刻才出現。
    derivedFrom:
      - g3-science-midterm-2025-10-original-02
