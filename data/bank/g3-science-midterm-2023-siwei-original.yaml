questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 兩條相同的橡皮筋分別被手指拉開，如圖所示。哪一條橡皮筋受到較大的力？
    options: [左圖的橡皮筋, 右圖的橡皮筋, 兩條一樣大, 無法判斷]
    answer: 1
    explanation: 橡皮筋被拉得越長，形狀改變越大，表示受到的力越大。左圖的橡皮筋被拉得比右圖長，所以左圖受力較大。答案依原題獨立推核，非官方答案。
