questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力與磁鐵
    stem: 老師畫線段表示三個力，三個都用相同的比例。甲的線段長2公分，乙長5公分，丙也長5公分。根據線段表示力的方法，哪個大小比較正確？
    options:
      - 甲最大，乙和丙相等
      - 乙比丙大，丙比甲大
      - 三個力都一樣大
      - 乙和丙相等，而且都比甲大
    answer: 4
    explanation: 用相同比例表示力時，線段越長代表力越大；乙、丙都長5公分，所以兩者力相等，且都比線段2公分的甲大。沒有把線長當實際施力位移，也不推算力是多少單位。
