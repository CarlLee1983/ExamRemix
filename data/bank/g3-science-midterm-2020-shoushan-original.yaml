      number: 15
  - no: 5
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 下列哪一個植物的根不是軸根？
    options:
      - 小白菜
      - 空心菜
      - 水稻
      - 青江菜
    answer: 3
    explanation: 小白菜、空心菜、青江菜都有一條明顯的主根，是軸根；水稻的根是許多細長的根，沒有明顯主根，屬於鬚根。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 109學年度第1學期三年級自然領域期中評量試卷
      section: 二、選擇題：每題3分，共30分
      number: 8
  - no: 6
    type: choice
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 哪一種物品受到力的作用後無法恢復原狀？
    options:
      - 紙杯
      - 皮球
      - 橡皮筋
      - 彈簧
    answer: 1
    explanation: 皮球、橡皮筋、彈簧受力變形後都會恢復原狀；紙杯被壓扁或捏皺後不會自己回復，所以選紙杯。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 109學年度第1學期三年級自然領域期中評量試卷
      section: 二、選擇題：每題3分，共30分
      number: 10
