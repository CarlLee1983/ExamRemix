  - no: 9
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 有些房屋和家具是用植物的莖做成的。
    answer: true
    explanation: 許多木本植物的莖質地堅硬粗大，經砍伐加工成木材後，可以用來建造房屋結構或製作桌、椅、床等家具。答案依原題獨立推核，非官方答案。
