  - no: 4
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: "下列哪一項不適合寫在植物的觀察紀錄表呢？"
    options:
      - 植物的生長地點
      - 葉子的顏色
      - 葉子的大小
      - 觀察時穿的衣服
    answer: 4
    explanation: "觀察紀錄表應記錄植物本身的資料，例如生長地點、葉子的顏色和大小；觀察時穿的衣服與植物無關，不適合寫。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: "112學年度上學期三年級自然領域期中學業評量試卷"
      section: "二、選擇題：每題2分，共30分"
