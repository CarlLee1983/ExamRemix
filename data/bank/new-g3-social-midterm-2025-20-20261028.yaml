questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小組做學校介紹：甲先查資料交給乙，乙才能製作海報，海報完成後丙才能練習介紹。三人都有在工作，卻沒約定交接，最後丙拿到海報時已無時間練習。最直接的改善是什麼？
    options:
      - 只要每個人忙過，就不必考慮下一個人何時收到成果
      - 讓丙到最後才知道海報內容，才能證明他反應快
      - 一起排出資料、海報的交接時間，讓後面的人有時間接著完成工作
      - 三人各自重做三份完整海報，仍不需要交接
    answer: 3
    explanation: 乙和丙的工作要用到前一人的成果，不能只看各自有沒有忙。約定交接時間能讓後續工作順利接上。
    derivedFrom:
      - g3-social-midterm-2025-20
