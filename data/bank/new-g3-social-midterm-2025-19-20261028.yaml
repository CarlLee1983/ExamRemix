questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 班際跑步競賽約定各隊跑相同距離再比時間。記錄發現甲隊跑20公尺，乙隊只跑10公尺，乙用的時間較少。只根據這次記錄，應怎麼處理才公平？
    options:
      - 先讓兩隊依相同距離完成再比較，不能把不同距離的時間直接當成同條件成績
      - 乙時間較少，所以已能確定乙的跑步能力較好
      - 甲跑得比較遠，所以不必再按約定比較就必須讓甲第一名
      - 不看距離，直接改成只按選手的人氣決定名次
    answer: 1
    explanation: 約定的比較前提是距離相同，這次兩隊路程不同，時間不能直接用來判同條件表現。應先依相同距離規則比較，不任意宣告任何一隊勝出。
    derivedFrom:
      - g3-social-midterm-2025-19
