# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 多采多姿的植物
    stem: 用細繩在兩株樹幹各標記的同一高度繞一圈，繩子不重疊也不拉長，再把各段繩子拉直放在同一把尺上量。甲繩從3公分刻度到18公分；乙繩從6公分刻度到19公分。下列哪個比較正確？
    options:
      - 乙樹幹較粗，因為19比18大
      - 一樣粗，因為兩段繩子都讀了兩個刻度
      - 不能比較，因為沒有從0刻度放起
      - 甲樹幹較粗，甲一圈15公分、乙13公分
    answer: 4
    explanation: 繩長要用終點刻度減起點刻度。甲為18－3＝15公分，乙為19－6＝13公分，所以甲樹幹一圈較長、較粗。同一把尺的刻度相同，起點不同仍可相減求得長度。
