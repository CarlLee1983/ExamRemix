groups:
  - no: 1
    paragraphs:
      - 有時抬頭會發現天空看起來灰濛濛的，甚至聞起來有些臭臭的，當有這樣的狀況時，就代表空氣可能被汙染了。
      - 存在空氣中的顆粒狀物體稱為「微粒」，它們就像一大片的灰塵那樣，其中，很小的微粒會被歸類成「細懸浮微粒」，它們輕易的飄浮在空氣中並透過風流動，細小的體積使它們容易隨著人類呼吸過程進入身體中。細懸浮微粒的成分可能包含有毒物質，長期吸入這些物質的話，會導致疾病發生，例如：支氣管炎、過敏等，嚴重的話還會造成肺癌。
      - 這些「微粒」是從哪裡來的呢？大致上可以分為兩類，一類來自大自然，例如：火山爆發或海邊岩石瓦解後，變成小碎屑而隨風飄散。另外一類則是人類製造出來的，例如：運輸工具和工廠煙囪排放的廢氣、焚化爐燃燒垃圾、抽菸或燒香等。
      - 為了地球環境著想，我們應該要盡可能減少會產生微粒的行為，平時也可以透過環保署的空氣品質監測網確認空氣品質。當空氣品質不好時，要記得戴上口罩或減少出門，才能保護自己的身體不被傷害。
    members: [1, 2]
    source:
      originalPaper: 113學年度上學期三年級自然科學期中評量試卷
      section: 四、科學閱讀：每格2分、共14分。1. 回答問題，正確的，在（ ）裡打✓，錯誤的打╳：
questions:
  - no: 1
    type: multi-select
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 依據文章內容，下列哪些推論正確？
    options:
      - 沒有被汙染的空氣看起來是白色的，而且聞起來不會有特殊氣味。
      - 吸入過多的細懸浮微粒可能會生病，因此平常應該多關心空氣品質並做好防範。
      - 如果有人在我附近抽菸，會對我的身體造成傷害。
    answer: [2, 3]
    explanation: 依文推定選②③，未取得官方答案。①把沒有被汙染的空氣說成白色，不能由文章推得；乾淨空氣通常看不見且沒有特殊氣味。②文章提醒細懸浮微粒可能含有毒物質，長期吸入有健康風險，因此要關心空氣品質並防範。③附近抽菸會使人暴露於菸煙中的污染物，具有健康風險；原選項保留「會」的說法，並非指每次暴露都必然立即出現疾病。
    source:
      originalPaper: 113學年度上學期三年級自然科學期中評量試卷
      section: 四、科學閱讀：每格2分、共14分。1. 回答問題，正確的，在（ ）裡打✓，錯誤的打╳：
      number: 1
  - no: 2
    type: multi-select
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 下列哪些例子會製造出「微粒」並造成空氣汙染？
    options:
      - 道路施工，工地附近產生很多灰塵。
      - 發生森林大火，有許多濃煙。
      - 將洗碗的廢水排到水溝裡。
      - 到廟裡點香拜拜。
    answer: [1, 2, 4]
    explanation: 依文章與情境推定選①②④，未取得官方答案。施工揚起的灰塵，以及森林大火和點香燃燒產生的煙，都可能使微粒進入空氣，造成污染物暴露風險。③將洗碗廢水排到水溝涉及水體污染風險，並非本題所問的空氣微粒來源；不表示這種排放行為沒有環境危害。
    source:
      originalPaper: 113學年度上學期三年級自然科學期中評量試卷
