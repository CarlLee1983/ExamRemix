groups:
  - no: 1
    paragraphs:
      - 音樂課要練習合奏，阿澄負責打鼓，小萱負責吹直笛。阿澄把鼓點記得很熟，覺得敲得越響，表演就越熱鬧。練習時，他雙手用力敲著鼓，沒有留意旁邊的直笛聲。
      - 老師請阿澄先站到教室後面，自己接過鼓棒，照著他剛才的力道敲。阿澄聽見一陣陣響亮的鼓聲，小萱明明還在吹直笛，他卻幾乎聽不見笛聲。老師問：「除了鼓，你還聽見其他樂器嗎？」阿澄看著小萱，這才明白剛才為什麼聽不清楚。
      - 回到座位後，阿澄把敲鼓的力道放輕，一邊敲，一邊留意小萱的笛聲。這回，直笛的旋律和鼓點都能清楚聽見。阿澄說：「原來合奏不是只管自己的聲音響不響，也要讓別人的聲音被聽見。」兩人又練了一次，音樂比剛才更和諧了。
