questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小組用心智圖整理「認識學校」，已畫出「學習場所」與「校園工作人員」兩條分支。要加入「圖書館」，哪個位置最能表現資料的關係？
    options:
      - 連在「學習場所」分支下
      - 連在「校園工作人員」分支下
      - 取代中央的「認識學校」，刪掉所有其他內容
      - 只畫在紙背面，不和任何主題連結
    answer: 1
    explanation: 圖書館是學習場所，應連在相關分支下。心智圖用主題與分支的連結整理資料關係，不是只把詞語散放在紙上。
    derivedFrom:
      - g3-social-midterm-2022-03-01
