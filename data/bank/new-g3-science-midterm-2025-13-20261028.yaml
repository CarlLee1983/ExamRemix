questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 同一小車一直向前走，老師持續向前推它。前一秒前進2格，後一秒前進4格，每格都一樣長；車身形狀與顏色一直沒變。這項紀錄顯示小車哪方面改變了？
    options:
      - 車身形狀
      - 快慢完全沒變
      - 行進快慢
      - 行進方向反轉
    answer: 3
    explanation: 兩段時間都一秒，後一秒走4格比前一秒2格遠，表示後一段前進較快，行進快慢有改變。紀錄已說方向一直向前、形狀與顏色沒變，不是轉向或變形。這只是比較兩段的快慢，不聲稱能由紀錄算出瞬間加速度。
    derivedFrom:
      - g3-science-midterm-2025-13
