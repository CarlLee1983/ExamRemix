    type: word-problem
    subject: 數學
    grade: 3
    unit: 公分與毫米
    stem: 一條紙帶做書籤用掉 8 公分 7 毫米後，還剩下 26 毫米。這條紙帶原來長幾公分幾毫米？
    answer: 這條紙帶原來長 11 公分 3 毫米。
    explanation: 8 公分 7 毫米 = 87 毫米。用掉的加剩下的：$87 + 26 = 113$ 毫米，也就是 11 公分 3 毫米。
    derivedFrom:
      - g3-math-midterm1-2026-10-36
