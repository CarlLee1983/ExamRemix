questions:
  - no: 1
    type: diagram-label
    subject: 自然
    grade: 3
    unit: 力與磁鐵
    stem: |-
      彎彎搶救磁粉大作戰
      彎彎的小朋友在做實驗時，不小心打翻裝有磁粉的盒子。有的小朋友想到可以利用磁鐵會吸引鐵製品的特性，把磁粉快速清理和回收。請問他們是運用什麼步驟把鐵粉回收的呢？請把順序排出來。
    image:
      src: g3-science-midterm-2021-12-original/01.png
      alt: 四個原操作圖文格，依左上、右上、左下、右下標示ㄅ、ㄆ、ㄇ、ㄈ，下方四個由箭頭連接的未作答括號。
    labels:
      - x: 8.333333333333332
        y: 90.87378640776699
        width: 12.962962962962962
        height: 4.271844660194175
        answer: ㄈ
      - x: 32.77777777777778
        y: 90.87378640776699
        width: 12.962962962962962
        height: 4.271844660194175
        answer: ㄇ
      - x: 57.03703703703704
        y: 90.87378640776699
        width: 12.962962962962962
        height: 4.271844660194175
        answer: ㄆ
      - x: 81.11111111111111
        y: 90.87378640776699
        width: 12.962962962962962
        height: 4.271844660194175
        answer: ㄅ
    explanation: 依操作需要，先準備磁鐵和塑膠袋（ㄈ），再把磁鐵裝進塑膠袋（ㄇ），接著利用隔著塑膠袋的磁鐵吸起磁粉（ㄆ），最後將塑膠袋翻面包住鐵粉（ㄅ）。塑膠袋隔開磁鐵與鐵粉，收集後可把袋子翻轉，使原先在袋外的鐵粉被包入袋內。四格共同表達完整程序，整組算一題。原題同時使用磁粉與鐵粉名稱；依題文明示磁鐵吸引鐵製品的情境解讀，不改成任意粉末皆可磁吸。答案自行推核，未取得官方解答。
    source:
      originalPaper: 110學年度第一學期三年級自然領域期中評量卷
      section: 了解磁鐵在日常生活中的應用，並發現增強磁鐵吸力的方法。／一、情境題(10格)／2.彎彎搶救磁粉大作戰
