  - no: 4
    paragraphs:
      - 班上要辦圖書展，怡君自告奮勇製作宣傳海報。她想把書名、圖畫和活動時間全都一個人完成。可是，寫字時顧不到畫圖，畫圖時又忘了留下寫時間的位置，放學前只做完一小半。
      - 志宏看了看，提議：「妳畫圖很好看，我寫大字比較拿手。不如妳畫書和花邊，我來寫書名和活動時間。」怡君原本想自己做完，後來看到剩下的空白，還是點頭接受了建議。
      - 兩人先在紙上安排位置，再分頭動手。不久，海報就完成了。怡君對志宏說：「原來不必每件事都自己做。把工作分好，讓大家做拿手的事，也能一起做好。」
