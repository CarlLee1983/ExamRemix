questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 參觀不同族群的文化活動後，小安想學一首當地的歡迎歌，也繼續跟家人學自己熟悉的節慶歌謠。同學說「只能喜歡一種文化，學了別人的，就必須放棄自己的」。哪個判斷正確？
    options:
      - 參觀一次不同文化，就必須丟掉所有自己熟悉的文化
      - 可以尊重並學習不同文化，同時珍惜自己家中的文化，不必二選一
      - 只要學過當地歡迎歌，以後就不能再唱家中的節慶歌謠
      - 為了珍惜自己文化，應拒絕了解所有不同文化
    answer: 2
    explanation: 認識多元文化能增加了解，並不要求放棄自己熟悉的文化。兩種學習可以並存，不需以排斥其中一種來證明珍惜另一種。
    derivedFrom:
      - g3-social-midterm-2025-21
