questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 家庭經濟
    stem: 家人這次買文具先付90元，之後把其中一件退回，店家當場退還20元。只看這次交易，從原先家中的錢實際少了多少？
    options:
      - 70元，因為90元付出後又收回20元
      - 110元，因為付出和退回都要加成支出
      - 90元，因為退回的20元不能影響這次花掉多少
      - 20元，因為只要看店家最後交回多少
    answer: 1
    explanation: 實際少掉的錢是付出的90元減去同次交易退回的20元，等於70元。70元加退回的20元可回推原先付的90元。
