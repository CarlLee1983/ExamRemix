  - no: 3
    type: choice
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 下列各種風對我們生活的影響，哪一種是缺點？
    options:
      - 吹乾食物
      - 吹倒電線桿
      - 吹動帆船航行
      - 吹動風力電機發電
    answer: 2
    explanation: 吹乾食物、吹動帆船航行、吹動風力電機發電都是風的優點；風大時吹倒電線桿會造成危害，是缺點。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 彰化縣田中國小111學年度上學期三年級自然領域期中學業評量試卷
      section: 二、選擇題：每題2分，共30分
      number: 7
  - no: 4
    type: choice
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 當海綿被壓入水中會出現何種現象？
    options:
      - 許多小泡泡冒出來
      - 海綿消失不見
      - 水量變少
      - 海綿開始發熱
    answer: 1
    explanation: 海綿裡有許多小孔含著空氣，壓入水中時，空氣被水擠出來，會看到許多小泡泡冒出來。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 彰化縣田中國小111學年度上學期三年級自然領域期中學業評量試卷
      section: 二、選擇題：每題2分，共30分
