    stem: 這道題還沒弄懂，請你□說一次，讓我重新聽清楚。空格中應填入哪個字或詞語？
    options:
      - 在
      - 再
      - 都
      - 才
    answer: 2
    explanation: 「再」表示又一次，符合重新聽一次。「在」表示位置或動作進行；「才」有限定、剛剛等意思；「都」表示全部，均不合此處重複一次的要求。
    derivedFrom:
      - g3-chinese-midterm-2025-02-38
  - no: 29
    type: choice
    subject: 國語
    grade: 3
    stem: 我昨天一直找不到借書證，直到今天早上□找到，並不是昨天就找到了。空格中應填入哪個字或詞語？
    options:
      - 才
      - 都
      - 就
      - 又
    answer: 1
    explanation: 「直到……才……」表示經過等待，到今天早上方才找到；「就」表示較早或隨即，與一直找不到的語意不合；「都」沒有相配的全部對象；「又」表示再次，與首次找到的情境不合。
    derivedFrom:
      - g3-chinese-midterm-2025-02-38
