    unit: 奇妙的溶解
    stem: 老師要量取21毫升水，要求「不用估算，直接對到量筒現有的刻度線」。甲、乙都是正常的量筒，刻度單位均為毫升，量程都是0到50毫升。甲每10毫升才有一條刻度線，乙每1毫升就有一條刻度線。哪支符合老師的要求？
    options:
      - 乙
      - 兩支都符合
      - 兩支都不符合
      - 甲
    answer: 1
    explanation: 乙有每1毫升的刻度線，能直接對到21毫升。甲每10毫升才有刻度線，沒有21毫升的刻度，必須估算，不能符合題目的要求。兩支的量程都足夠，差別在刻度是否夠細。
