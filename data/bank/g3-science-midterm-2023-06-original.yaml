    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 磁鐵的兩個磁極，分別稱為 W 極和 S 極。
    answer: false
    explanation: 磁鐵能指南北，指北的一端稱為 N 極（North），指南的一端稱為 S 極（South），並沒有稱為 W 極的磁極。答案依原題獨立推核，非官方答案。
