questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 想比較推力大小對球滾行距離的影響，每次都讓球從靜止開始，推球時間也相同。下列哪一組安排較能只比較推力大小的影響？
    options:
      - 同一顆球、同一水平地面、同方向，分別輕推與用較大的力推
      - 同一顆球，輕推時放在粗糙地面，大力推時放在光滑地面
      - 輕推小球、大力推大球，其他條件相同
      - 同一顆球，輕推時往上坡推，大力推時往下坡推
    answer: 1
    explanation: 若要比較推力大小，球、地面與推動方向等條件應相同，只改變推力大小。其他三組同時改變地面、球或坡向，滾行距離的差異便不一定只來自推力。
    derivedFrom:
      - g3-science-midterm-2025-11
