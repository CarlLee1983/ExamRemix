# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 四段莖各節的葉片都完整，沒有掉落。「葉子排列方式」和「節數」均已核對正確，只有一筆「總葉片數」抄錯。甲：互生、3節、3片葉；乙：對生、3節、6片葉；丙：互生、4節、8片葉；丁：對生、4節、8片葉。哪筆總葉片數需要更正？
    options:
      - 丙
      - 丁
      - 甲
      - 乙
    answer: 1
    explanation: 互生每節一片葉，對生每節兩片相對的葉。丙是互生、4節，總數應為4片，不是8片；其餘三筆的葉序、節數和總數一致。
