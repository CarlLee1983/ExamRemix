questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 下列哪一種植物的莖高大直立、粗粗壯壯的，表面有一圈圈的紋路？
    options:
      - 木棉
      - 大王椰子
      - 昭和草
      - 樟樹
    answer: 2
    explanation: 四個選項中，大王椰子具有高大直立的幹，幹面可見葉片脫落留下的環狀葉痕，最符合題述，所以選②。單靠高大或粗壯不能區分所有樹木，這題還須合看表面一圈圈的紋路；不是說每株大王椰子的環紋都同樣清楚，也不是說只有這一種棕櫚有環紋。答案依第三方公開預覽原題及官方植物資料獨立推核，未取得校方原PDF或官方答案。
    source:
      originalPaper: 109學年上學期期中評量自然科試卷（三年級）
      section: 二、選擇題(12分)
      number: 2
