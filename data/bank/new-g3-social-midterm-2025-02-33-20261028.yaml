questions:
  - no: 1
    type: multi-select
    subject: 社會
    grade: 3
    stem: 校園巡查記錄如下。哪些情況需要提醒大家遠離危險，並請老師協助處理？請勾選所有正確選項。
    options:
      - 工人正在施工的圍籬內
      - 有管理人員在場、正常開放的閱讀區
      - 剛漏水且尚未處理的濕滑樓梯
      - 地面平整、老師正帶領同學做操的空地
      - 車輛正在倒車的卸貨區
    answer:
      - 1
      - 3
      - 5
    explanation: 施工圍籬內、濕滑樓梯及車輛倒車處有明確危險。題中已說明有人管理的閱讀區，以及平整且由老師帶領使用的空地，並未描述需要遠離的危險。
    derivedFrom:
      - g3-social-midterm-2025-02-33
  - no: 2
    type: multi-select
    subject: 社會
    grade: 3
    stem: 同學手部受傷，老師已處理傷口。他說想有人幫忙收拾掉在地上的課本。哪些回應能表現關心並尊重他的需要？請勾選所有正確選項。
    options:
      - 取笑他連課本也拿不好
      - 幫他撿起課本，放到他指定的位置
      - 未經同意拍攝傷口照片傳給其他人
      - 問他是否還有需要協助的地方，並耐心等他回答
      - 不聽他的說明，強迫他把所有物品都交給我
    answer:
      - 2
      - 4
    explanation: 幫忙撿起他已請求協助的課本，以及耐心詢問還有何需要，都兼顧關心與尊重。取笑、擅自公開受傷照片或強迫他做不需要的事並不恰當。
    derivedFrom:
      - g3-social-midterm-2025-02-34
  - no: 3
    type: multi-select
    subject: 社會
    grade: 3
    stem: 家人整理本月的收支記錄。下列哪些記錄表示家庭付出了金錢，應歸入支出？請勾選所有正確選項。
    options:
      - 繳交本月水費
      - 付錢購買看病需要的藥品
      - 家人領到工作的薪水
      - 賣出自家的二手書，收到買方付款
      - 付錢購買全家晚餐的食材
    answer:
      - 1
      - 2
      - 5
    explanation: 繳水費、付醫藥費和買食材都把金錢付出去，屬支出。領到薪水與售出自家二手書收到款項則是收到錢，不是支出。
    derivedFrom:
      - g3-social-midterm-2025-02-35
