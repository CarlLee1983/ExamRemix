questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 水的特性
    stem: 用相同水車做兩次實驗：第一次讓水柱打在葉片上，水車轉動；第二次把水柱移開，水車逐漸停下。哪項推論有實驗支持？
    options:
      - 水車只要靠近水就一定會轉
      - 沒有碰到葉片的水也提供相同推力
      - 水柱作用在葉片上能推動水車
      - 只有水的重量能使水車動，水是否流動沒有關係
    answer: 3
    explanation: 水柱打中葉片時轉動，移開後停下，支持流動的水可傳送動力。
    derivedFrom:
      - g3-science-midterm-2024-02-16
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 水的特性
    stem: 兩個相同的輕質小船浮在靜止水面。甲船受到水槍水柱朝右推後往右移，乙船沒有受水柱推動仍停著。這次比較主要顯示什麼？
    options:
      - 水只能托住物品而不能推動物品
      - 船只要浮著就一定會往右移
      - 流動水可使原本靜止的物品移動
      - 水柱會讓所有物品都沉下去
    answer: 3
    explanation: 兩船原本都浮著，只有受水柱推的甲船移動，可分辨水的推動作用與托住船的作用。
    derivedFrom:
      - g3-science-midterm-2024-02-16
