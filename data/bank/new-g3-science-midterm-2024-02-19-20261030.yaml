# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 四片完整綠葉的紀錄如下：甲是心形、平滑葉緣、網狀脈；乙是心形、鋸齒葉緣、網狀脈；丙是長形、平滑葉緣、平行脈；丁是長形、鋸齒葉緣、平行脈。老師已按葉脈分成「甲、乙」和「丙、丁」兩組。接著兩組各再依同一種特徵分組，希望每組裡的兩片葉都能分開，應觀察哪項？
    options:
      - 再看葉脈
      - 葉形
      - 葉緣
      - 葉色
    answer: 3
    explanation: 甲乙的葉緣一片平滑、一片鋸齒，丙丁也是如此，所以葉緣能同時分開兩組內的葉片。兩組各自的葉形、葉色與葉脈都相同，不能再用這些特徵分開組內兩片葉。
