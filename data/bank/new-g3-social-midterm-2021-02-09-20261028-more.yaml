questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 家庭經濟
    stem: 家人約定一筆儲蓄專供突然需要的醫療等急用，另一筆才用來買想要的球拍。目前球拍專款還不夠，且沒有急用。哪個安排符合這項約定？
    options:
      - 把急用儲蓄花完買球拍，再說從沒約定過
      - 為了買球拍，停掉每個人的正常三餐
      - 保留急用儲蓄，繼續累積球拍專款
      - 只要有存錢，就不必分辨錢預留的用途
    answer: 3
    explanation: 儲蓄可應付急需，也可累積購物資金。題目已約定兩筆用途不同，應保留急用金，另累積球拍專款。
    derivedFrom:
      - g3-social-midterm-2021-02-09
