  - no: 6
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: "植物和生活息息相關，下列情形是應用在哪一方面？爸爸用竹子製作成竹蜻蜓。"
    options:
      - 食
      - 衣
      - 住
      - 行
      - 育樂
    answer: 5
    explanation: "竹蜻蜓是用竹子做成的玩具，屬於植物在育樂方面的應用。答案依原題獨立推核，非官方答案。"
