questions:
  - no: 1
    type: multi-select
    subject: 自然
    grade: 3
    unit: 觀察植物
    stem: 哪些方法適合觀察植物？請在正確選項前打勾。
    options:
      - 用眼睛觀察葉子的顏色。
      - 摘下不明的葉片放進嘴裡。
      - 用手輕搧，聞植物的氣味。
    answer: [1, 3]
    explanation: 可看顏色並輕搧聞氣味；不明植物不可任意入口。
    source:
      originalPaper: 虛構三年級自然練習
      section: 一、觀察植物（每個答案 1 分，共 3 分）

  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 植物構造
    stem: 哪一張圖主要畫的是葉子？
    options:
      - image: { src: sample-science/leaf.svg, alt: 一片葉子的圖 }
      - text: 另一張圖
        image: { src: sample-science/flower.svg, alt: 一朵花的圖 }
    answer: 1
    explanation: 第一張圖是一片葉子。
    source: { originalPaper: 虛構三年級自然練習, number: 2 }

  - no: 3
    type: diagram-label
    subject: 自然
    grade: 3
    unit: 植物構造
    stem: 在圖上的空格填入代號。甲．葉；乙．根。
    image: { src: sample-science/plant.svg, alt: 植物圖，兩條線分別指向葉和根 }
    labels:
      - { x: 72, y: 15, width: 20, height: 12, answer: 甲 }
      - { x: 72, y: 70, width: 20, height: 12, answer: 乙 }
    explanation: 上方指向葉，下方指向根。
    source:
      originalPaper: 虛構三年級自然練習
      section: 二、植物構造（每格 1 分，共 2 分）

  - no: 4
    type: table-fill
    subject: 自然
    grade: 3
    unit: 植物構造
    stem: 觀察圖片並填入代號。甲．葉；乙．花。
    columns:
      - image: { src: sample-science/leaf.svg, alt: 葉的圖 }
      - image: { src: sample-science/flower.svg, alt: 花的圖 }
    rows:
      - { label: 構造, answers: [甲, 乙] }
    explanation: 左圖是葉，右圖是花。
    source:
      originalPaper: 虛構三年級自然練習
      section: 三、植物圖片（每格 1 分，共 2 分）

  - no: 5
    type: multi-select
    subject: 自然
    grade: 3
    unit: 觀察植物
    stem: 哪些行為可以安全地觀察植物？
    options: [用放大鏡看葉脈, 任意嚐不明葉片, 用尺量葉片長度]
    answer: [1, 3]
    explanation: 用放大鏡看、用尺量都不會傷害自己；不明葉片不能隨意品嚐。
    source: { originalPaper: 虛構三年級自然練習, section: 四、觀察方法 }
