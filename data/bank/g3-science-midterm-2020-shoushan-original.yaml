  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 懸吊長條形磁鐵，當磁鐵靜止時，S極會指向北方。
    answer: false
    explanation: 懸吊的長條形磁鐵靜止時，指向北方的是N極，S極指向南方。答案依原題獨立推核，非官方答案。
