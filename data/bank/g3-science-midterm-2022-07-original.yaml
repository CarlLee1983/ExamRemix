    paragraphs:
      - 今日小盛家晚餐媽媽準備了下列幾道菜，請問下列的菜餚中，分別用到植物身體的哪個部位？請在（　）裡打ˇ
    members: [2, 3, 4, 5, 6, 7]
    source:
      originalPaper: 111學年度上學期三年級自然與生活科技科領域期中評量
      section: 三、題組：(每題2分、共34分)
      number: 1
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物的身體
    stem: 想要比較不同花朵的香味，怎麼做才正確？
    options:
      - 靠近花朵用手搧著聞
      - 把花摘下來聞
      - 用手搓揉花朵，再聞手上的氣味
      - 把鼻子貼近花瓣
    answer: 1
    explanation: 用手輕輕搧動花朵周圍的空氣，讓香味飄向鼻子來聞，不必摘花、搓揉花朵或把鼻子貼近花瓣。
    source:
      originalPaper: 111學年度上學期三年級自然與生活科技科領域期中評量
      section: 二、選擇題：(每題2分、共22分)
      number: 8
