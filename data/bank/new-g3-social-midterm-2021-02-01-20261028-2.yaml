questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 班級的自治活動
    stem: 班上投票前共同約定：「每張選票只能圈一個方案；圈兩個方案的票，不計入任何方案。」計票時發現一張同時圈了甲、乙兩案的選票。哪個處理符合這次約定？
    options:
      - 不把這張票計入甲案或乙案
      - 把這張票各算一票給甲案和乙案
      - 由主席挑一案，把這張票算給它
      - 把這張票算給目前票比較少的一案
    answer: 1
    explanation: 這次投票已事前約定，圈兩案的票不計入任何方案，因此只能依同一約定處理。各算一票違反一票一案；由主席選或補給落後方案，也都是計票時擅自改變規則。這是題目明定的班級投票約定，不宣稱所有投票活動都採同一票種規則。
    derivedFrom:
      - g3-social-midterm-2021-02-01
