questions:
  - no: 1
    type: diagram-label
    subject: 自然
    grade: 3
    unit: 植物
    stem: 依照圖中的指令，選擇葉子的外型特徵，將五種葉子分成兩類並完成表格。
    image:
      src: g3-science-midterm-2020-16-original/01.png
      alt: 原卷葉片分類完整圖：指令要求依葉子外型特徵分類並將代號填入表格；①彩葉草、②百合、③玉蘭花、④構樹、⑤榕樹。表格上列填分類依據，中列左右各填類名，下列左右各填葉片代號。
    labels:
      - { x: 27.8846, y: 68.1667, width: 36.5385, height: 4.8333, answer: '葉脈' }
      - { x: 5.9615, y: 76.1667, width: 36.5385, height: 4.8333, answer: '平行脈' }
      - { x: 54.8077, y: 76.1667, width: 36.5385, height: 4.8333, answer: '網狀脈' }
      - { x: 5.9615, y: 87.5000, width: 36.5385, height: 4.8333, answer: '②' }
      - { x: 54.8077, y: 87.5000, width: 36.5385, height: 4.8333, answer: '①③④⑤' }
    explanation: 答案範例（非唯一正解）：以「葉脈」分類，左類「平行脈」填②，右類「網狀脈」填①③④⑤。這是開放分類題，須人工評分：學生可自選圖中可見的特徵，兩類必須互斥且各有內容；五個代號須各出現一次，且歸類與所選特徵一致。左右順序、代號排列順序及同義類名不影響正確。另一合理範例是依「有無明顯大裂片」分類：「有明顯大裂片」填④，「無明顯大裂片」填①②③⑤。本題來源為第三方原卷掃描，未取得官方答案；以上答案與規準為依圖判讀的人工批改參考。
    source:
      originalPaper: 109學年度第一學期三年級自然領域期中評量試卷
      section: 四、填填看（每答2分，共16分）
