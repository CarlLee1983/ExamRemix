questions:
  - no: 1
    type: fill-blank
    subject: 國語
    grade: 3
    stem: 從①逃、②桃、③挑、④跳選出適合的字，填代號（代號可以重複）。春天，媽媽帶我到果園看___花，再到市場___選水果。
    answer:
      - ②
      - ③
    explanation: 依序組成「桃花」、「挑選」，填②、③。桃花是桃樹開的花；挑選是從多個事物中選出合適的。逃表示逃走，跳表示向上躍起，都不能組成這兩個詞語。
    derivedFrom:
      - g3-chinese-midterm-2025-02-29
  - no: 2
    type: fill-blank
    subject: 國語
    grade: 3
    stem: 從①鐘、②種、③重、④中選出適合的字，填代號（代號可以重複）。園丁在花盆裡播___，再把花盆移到庭院___央。他看了看牆上的時___，發現該休息了，便把___量很輕的空水壺收好。
    answer:
      - ②
      - ④
      - ①
      - ③
    explanation: 依序組成「播種」、「中央」、「時鐘」、「重量」，填②、④、①、③。播種是把種子播進土裡；中央是中間的位置；時鐘用來顯示時間；重量指物體的輕重。四個字各有指定詞義，其餘候選字均不能組成該格的正確詞語。
    derivedFrom:
      - g3-chinese-midterm-2025-02-30
  - no: 3
    type: fill-blank
    subject: 國語
    grade: 3
    stem: 從①桐、②筒、③同、④童選出適合的字，填代號（代號可以重複）。兒___節那天，我和哥哥拿了兩個___樣大小的竹___，裝進豆子並封好兩端，做成會響的沙鈴。
    answer:
      - ④
      - ③
      - ②
    explanation: 依序組成「兒童節」、「同樣」、「竹筒」，填④、③、②。兒童節是兒童的節日；同樣表示相同；竹筒是中空的竹製容器。桐是樹木的名稱，不能放入這三格；各格其餘候選字也不合詞義。
    derivedFrom:
      - g3-chinese-midterm-2025-02-31
  - no: 4
    type: fill-blank
    subject: 國語
    grade: 3
    stem: 從①較、②效、③郊、④交選出適合的字，填代號（代號可以重複）。我們到___外參加拔河比賽。大家每天練習，___果很好，最後贏得獎盃，由隊長___給老師。老師說，參加比賽不必太計___輸贏，大家一起努力才重要。
    answer:
      - ③
      - ②
      - ④
      - ①
    explanation: 依序組成「郊外」、「效果」、「交給」、「計較」，填③、②、④、①。郊外是市區以外的地方；效果是做事產生的成果；交給是把物品轉交給別人；計較輸贏是過分在意勝負。各格的其他候選字都不能組成句中所需詞語。
    derivedFrom:
      - g3-chinese-midterm-2025-02-30
