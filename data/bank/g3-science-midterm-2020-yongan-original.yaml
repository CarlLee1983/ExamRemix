questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: "觀察同棵植物時，一定可以同時觀察到植物的葉、莖、根、花、果實和種子等部位。"
    answer: false
    explanation: "植物不是隨時都同時有花、果實和種子，會依季節與生長階段而不同，所以「一定」同時觀察到全部部位是錯的。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: 高雄市永安國小109學年度上學期三年級自然與生活科技科領域期中評量
      section: "一、是非題：每題 2 分、共 20 分"
      number: 2
  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: "不可以用磁鐵吸引電子產品，以免物品受損而無法使用。"
    answer: true
    explanation: "磁鐵的磁力可能干擾或損壞電視、電腦、磁卡等電子產品，不要拿磁鐵去吸引或靠近它們。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: 高雄市永安國小109學年度上學期三年級自然與生活科技科領域期中評量
      section: "一、是非題：每題 2 分、共 20 分"
      number: 8
  - no: 3
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: "觀察哈密瓜、西瓜、柳丁和蘋果，發現果實裡面的種子都只有一粒。"
    answer: false
    explanation: "這幾種果實裡的種子都不只一粒，例如西瓜、哈密瓜有很多粒，所以敘述是錯的。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: 高雄市永安國小109學年度上學期三年級自然與生活科技科領域期中評量
      section: "一、是非題：每題 2 分、共 20 分"
      number: 10
  - no: 4
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: "「彩葉草的邊邊摸起來凹凹凸凸」這是在形容葉子的哪一個特徵？"
    options:
      - "葉子的形狀"
      - "葉子上的葉脈"
      - "葉子的顏色"
      - "葉子的葉緣"
    answer: 4
    explanation: "葉子邊緣的形狀（鋸齒或波浪）叫葉緣，邊邊凹凹凸凸說的是葉緣。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: 高雄市永安國小109學年度上學期三年級自然與生活科技科領域期中評量
      section: "二、選擇題：每題 2 分、共 20 分"
      number: 1
  - no: 5
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: "「彩葉草的葉面上的紋路像網子一樣」這是在形容葉子的哪一個特徵？"
    options:
      - "葉子的形狀"
      - "葉子上的葉脈"
      - "葉子的顏色"
      - "葉子的葉緣"
    answer: 2
    explanation: "葉面上的紋路叫葉脈，像網子一樣是網狀脈，說的是葉脈。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: 高雄市永安國小109學年度上學期三年級自然與生活科技科領域期中評量
      section: "二、選擇題：每題 2 分、共 20 分"
      number: 2
  - no: 6
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: "「彩葉草的葉子長得像心型一樣」，這是形容彩葉草的哪一個特徵？"
    options:
      - "葉子的形狀"
      - "葉子上的葉脈"
      - "葉子的顏色"
      - "葉子的葉緣"
    answer: 1
    explanation: "像心形說的是整片葉子的外形，屬於葉子的形狀。答案依原題獨立推核，非官方答案。"
    source:
      originalPaper: 高雄市永安國小109學年度上學期三年級自然與生活科技科領域期中評量
      section: "二、選擇題：每題 2 分、共 20 分"
