    stem: 公園裡散發出的香氣可能來自鮮豔的花朵，也可能來自葉子。
    answer: true
    explanation: 有些植物的花或葉都可能散發氣味；題目說的是可能，不表示所有鮮豔花朵或葉子都有香氣。答案依題意獨立推核，未取得官方答案。
    source:
