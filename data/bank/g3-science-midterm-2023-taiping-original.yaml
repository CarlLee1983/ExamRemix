  - no: 12
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 在觀察植物時，可以在同一棵植物上同時看到花朵和果實。
    answer: true
    explanation: 許多植物開花結果具有連續性，在同一時期可能有些花朵正在盛開，而先前受粉的花已經發育成果實。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 臺北市大同區太平國小112學年度第一學期自然科期中評量試題
      section: 一、是非題
