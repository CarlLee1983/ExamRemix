questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: "[書玉|ㄕㄨ ㄩˋ][和|ㄏㄜˊ][同學|ㄊㄨㄥˊ ㄒㄩㄝˊ][盪|ㄉㄤˋ][秋千|ㄑㄧㄡ ㄑㄧㄢ]，[下列|ㄒㄧㄚˋ ㄌㄧㄝˋ][哪|ㄋㄚˇ][一|ㄧˋ][種|ㄓㄨㄥˇ][是|ㄕˋ][正確|ㄓㄥˋ ㄑㄩㄝˋ][的|˙ㄉㄜ][玩法|ㄨㄢˊ ㄈㄚˇ]？"
    options:
      - "[慢慢|ㄇㄢˋ ㄇㄢˋ][盪|ㄉㄤˋ][比較|ㄅㄧˇ ㄐㄧㄠˋ][安全|ㄢ ㄑㄩㄢˊ]"
      - "[兩|ㄌㄧㄤˇ][人|ㄖㄣˊ][一起|ㄧˋ ㄑㄧˇ][站|ㄓㄢˋ][著|˙ㄓㄜ][盪|ㄉㄤˋ]，[表演|ㄅㄧㄠˇ ㄧㄢˇ][特技|ㄊㄜˋ ㄐㄧˋ]"
      - "[盪|ㄉㄤˋ][到|ㄉㄠˋ][最高|ㄗㄨㄟˋ ㄍㄠ][點|ㄉㄧㄢˇ][再|ㄗㄞˋ][跳|ㄊㄧㄠˋ][下來|ㄒㄧㄚˋ ㄌㄞˊ]"
      - "[以|ㄧˇ][單腳|ㄉㄢ ㄐㄧㄠˇ][站立|ㄓㄢˋ ㄌㄧˋ][的|˙ㄉㄜ][方式|ㄈㄤ ㄕˋ][盪|ㄉㄤˋ][秋千|ㄑㄧㄡ ㄑㄧㄢ]。"
    answer: 1
    explanation: 四個選項中，慢慢盪比站立表演、盪高後跳下或單腳站立安全；後三種玩法較容易失去平衡、跌落或受傷。因此第1項是正確選項。本答案為依題意獨立解題，非官方答案。
    source:
      originalPaper: 114(上)期中評量社會領域試卷
      section: 二、選擇題：每格2分，共40分。
      number: 15
