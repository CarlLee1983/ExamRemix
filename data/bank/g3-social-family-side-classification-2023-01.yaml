    explanation: 依題目稱謂的父系、母系方向分類：爸爸一列為ㄅ奶奶、ㄇ姑姑、ㄊ堂姐、ㄋ伯伯；媽媽一列為ㄆ阿姨、ㄈ舅媽、ㄉ外婆。奶奶是爸爸的媽媽，姑姑是爸爸的姊妹，堂姐是爸爸兄弟的女兒，伯伯是爸爸的哥哥；阿姨是媽媽的姊妹，舅媽是媽媽兄弟的太太，外婆是媽媽的媽媽。同一列內代號順序可交換，應按兩列完整集合核對，不限定答案卷所示順序。獨立核答與校方官方答案卷相符；分類不表示兩方家族不能因婚姻而互有親屬關係。
