# 明義109官方空白卷局部候選。無官方答案，獨立解題；待獨立review。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 上課時老師會用磁鐵將圖卡吸在黑板上，這是由於黑板裡可能有什麼材料呢？
    options: [木頭, 塑膠, 鐵, 玻璃]
    answer: 3
    explanation: 題目已說這面黑板能讓磁鐵吸住圖卡；在四種提供的材料中，鐵能被一般磁鐵吸引，所以選③。不是說所有黑板都含鐵，也不是說所有能被磁鐵吸引的材料都只有鐵；這裡是在原題四個材料選項中判斷。
    source:
      originalPaper: 109學年度第一學期三年級自然科期中定期評量試卷
      section: 一、選擇題：(每題2分、共20分)
      number: 4
  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 我們可以輕易的觀察到所有植物的種子。
    answer: false
    explanation: 不能說所有植物的種子都能輕易觀察到。有些種子藏在果實內，不能只看植物外表就看見；像蕨類等植物也不產生種子，不能把所有植物都當成有種子。因此這個說法錯誤。
    source:
      originalPaper: 109學年度第一學期三年級自然科期中定期評量試卷
      section: 二、是非題：(每個答案2分、共30分)；2.在校園裡觀察植物時，下列的作法正確的打○，錯誤的打×。
      number: 5
