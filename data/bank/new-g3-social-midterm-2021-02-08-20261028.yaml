    type: choice
    subject: 社會
    grade: 3
    unit: 家庭經濟
    stem: 只比較同樣四週已領到的工作收入：甲家每週領150元，連續四週都領到；乙家這四週共領650元，沒有其他工作收入。哪個說法正確？
    options:
      - 只拿甲家一週150元和乙家四週650元比較，就是相同期間
      - 甲家每週領一次，所以四週收入一定比較多
      - 乙家650元要再乘四次，才是題目說的四週收入
      - 甲家四週共600元，乙家四週比甲家多50元
    answer: 4
    explanation: 甲家150乘4等於600元，乙家已給四週合計650元。應比較同一期間，650減600等於50元。
