    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 正在滾動的球被手接住而停下，這能說明什麼？
    options:
      - 受力能使運動中的物體停止
      - 只有靜止物體才會受力
      - 球停止代表它沒有受到力
      - 力只能改變顏色而不能改變運動
    answer: 1
    explanation: 手對滾動球施力使它停止，屬於運動狀態改變。
