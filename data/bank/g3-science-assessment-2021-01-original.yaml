groups:
  - no: 1
    paragraphs:
      - 植物是許多動物的食物，但有些植物不想被吃，而有各種抗蟲對策。像是除蟲菊會製造能滅蟲的「除蟲菊酯」保護自己不被蟲吃。人們發現後，也會從除蟲菊萃取這些成分製造殺蟲劑，幫助消除蚊蟲。不過殺蟲劑能殺蚊蟲，難免對人體也有毒性，所以要謹慎使用，才不會危害健康。
    members:
      - 2
      - 3
      - 4
    source:
      originalPaper: 110學年度第一學期第一次評量三年級自然科評量試卷
      section: 六、素養科學閱讀：請閱讀短文後回答下列問題。(每格3分，共9分)
questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 臺灣欒樹的果實芳香甜美，可以吸引動物採食傳播。
    answer: false
    explanation: 臺灣欒樹結的是乾燥的蒴果，不是靠芳香甜美的果肉吸引動物採食的典型果實；其燈籠狀膜質蒴果可隨風移動。不能把其他甜美果實吸引動物的方式套到臺灣欒樹。官方答案為×，獨立核算一致。
    source:
      originalPaper: 110學年度第一學期第一次評量三年級自然科評量試卷
      section: 一、是非題(每題2分，共30分)
      number: 11
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 根據文中敘述，除蟲菊屬於下列哪一項呢？
    options:
      - 動物
      - 植物
      - 蚊蟲
      - 殺蟲劑
    answer: 2
    explanation: 文章把除蟲菊列為具有抗蟲方式的植物，並說人們從它萃取成分製造殺蟲劑；除蟲菊本身和製成的殺蟲劑有別，故選②。官方答案②，獨立核算一致。
    source:
      originalPaper: 110學年度第一學期第一次評量三年級自然科評量試卷
      section: 六、素養科學閱讀：請閱讀短文後回答下列問題。(每格3分，共9分)
      number: 1
  - no: 3
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 除蟲菊酯對除蟲菊有什麼功能？
    options:
      - 幫助製造養分
      - 吸引動物來幫傳粉
      - 驅除吃除蟲菊的昆蟲
      - 吸引動物幫忙傳播種子
    answer: 3
    explanation: 文中說該成分能滅蟲、保護除蟲菊不被蟲吃，因此在四個選項中只有③符合抗蟲功能；其他三項分別是製造養分、傳粉與傳種子的功能，本文都未把它們歸給此成分。官方答案③，獨立核算一致。
    source:
      originalPaper: 110學年度第一學期第一次評量三年級自然科評量試卷
      section: 六、素養科學閱讀：請閱讀短文後回答下列問題。(每格3分，共9分)
      number: 2
  - no: 4
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 下列哪一項敘述正確？
    options:
      - 植物不會想辦法對抗動物
      - 殺蟲劑都對人體無害
      - 只有昆蟲會吃植物
      - 人類會利用除蟲菊的成分來消滅蚊蟲
    answer: 4
    explanation: 本文明說人們萃取除蟲菊的成分製造殺蟲劑、消除蚊蟲，故選④。①不符文中的抗蟲對策，②忽略本文對人體毒性的提醒，③不符開頭「植物是許多動物的食物」。官方答案④，獨立核算一致。
    source:
      originalPaper: 110學年度第一學期第一次評量三年級自然科評量試卷
      section: 六、素養科學閱讀：請閱讀短文後回答下列問題。(每格3分，共9分)
      number: 3
