questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 老師準備兩株大小相近、葉片數相近的同種植物，甲的根能接觸水，乙的根以不透水材料隔開水；其他條件相同。若要比較根是否接觸水的影響，應觀察哪項？
    options:
      - 只比較兩株花朵的顏色
      - 只比較兩株種子的外形
      - 只比較兩株花瓣的片數
      - 兩株植物一段時間後的葉片是否仍挺立
    answer: 4
    explanation: 在其他條件相近時，可觀察植株是否出現缺水萎垂來比較根能否取得水分的影響；花色、種子外形與花瓣片數不能直接回答此吸水問題。
    derivedFrom:
      - g3-science-midterm-2025-07
