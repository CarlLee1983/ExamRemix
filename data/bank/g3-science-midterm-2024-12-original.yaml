# 原卷完整兩題：做一做1是一題六空；做一做5是不可拆分計容量的三成員題組。
questions:
  - no: 1
    type: fill-blank
    subject: 自然
    grade: 3
    unit: 植物與生活
    stem: |-
      植物與我們的生活息息相關，食、衣、住、行都需要用到。下列是不同植物和使用它們來製造出的產品，請配對出正確答案。(12分)
      A.稻子　B.竹葉　C.小白菜
      D.棉花　E.柳橙　F.⁠樟⁠樹
      (1)(___)家具　(2)(___)炒青菜
      (3)(___)果汁　(4)(___)衣服
      (5)(___)斗笠　(⁠6⁠)⁠(⁠___⁠)⁠白⁠米⁠飯
    answer: [F, C, E, D, B, A]
    explanation: 樟樹的木材可製成家具；小白菜可炒成青菜；柳橙可製成果汁；棉花的纖維可製成衣服；依原題選項，竹葉可用來製作斗笠；稻子的米粒煮熟後成為白米飯。答案依題文與植物用途推導，未取得官方解答。
    source:
      originalPaper: 113學年度上學期期中學習三年級自然與科技科試題
      section: 做一做
      number: 1
  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 磁力強弱
    stem: A.組合2個磁鐵能吸住的迴紋針數量最多。
    answer: false
    explanation: 表中組合2個磁鐵最多吸住4個迴紋針，組合3個磁鐵最多吸住5個，所以不是2個磁鐵吸住的數量最多，應畫╳。答案由原表推導，未取得官方解答。
    source:
      originalPaper: 113學年度上學期期中學習三年級自然與科技科試題
      section: 做一做5（6分）
  - no: 3
    type: true-false
    subject: 自然
    grade: 3
    unit: 磁力強弱
    stem: B.組合2個磁鐵的磁力比1個磁鐵的磁力強。
    answer: true
    explanation: 在原題默認迴紋針規格與測試條件可比的前提下，組合2個磁鐵最多吸住4個迴紋針，1個磁鐵最多吸住2個，可依原題的比較方式判定前者磁力較強，應畫○。原題未明示控制條件；答案依題意推導，未取得官方解答。
    source:
      originalPaper: 113學年度上學期期中學習三年級自然與科技科試題
      section: 做一做5（6分）
  - no: 4
    type: true-false
    subject: 自然
    grade: 3
    unit: 磁力強弱
    stem: C.每多組合1個磁鐵，就能多吸住2支迴紋針。
    answer: false
    explanation: 磁鐵從1個增加到2個時，最多吸住的迴紋針從2個增加到4個，多2個；從2個增加到3個時，從4個增加到5個，只多1個，所以不是每次都多2支，應畫╳。答案由原表推導，未取得官方解答。
    source:
      originalPaper: 113學年度上學期期中學習三年級自然與科技科試題
      section: 做一做5（6分）
