questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 圖書志工整理自然類書架。這個書架約定書背編號由小到大排列，現在相鄰兩本是12號和14號。一本同樣屬於自然類的13號書應放在哪裡？
    options:
      - 只因封面漂亮，就放在12號前面
      - 改放故事類，因為不想移動自然類書籍
      - 放在12號和14號之間
      - 不看編號，放在任何空位都符合約定
    answer: 3
    explanation: 題目已確定三本都屬自然類，此時要遵守的是同類書的編號順序。12小於13，13小於14，因此13號在兩者之間。
