questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 老師量一條材料的長度：拉以前是8公分，輕拉時是10公分；放手一分鐘後是9公分。只根據這三次量到的長度，哪個判斷正確？
    options:
      - 放手後已完全恢復原來的長度
      - 放手後的長度和輕拉時完全相同
      - 放手後比輕拉時更長
      - 放手後有縮短，但還沒有完全恢復原來的長度
    answer: 4
    explanation: 放手後的9公分比拉住時的10公分短，所以有縮短；但仍比原來8公分長，尚未完全恢復原長。只記錄到放手一分鐘，不能推論材料此後永遠不會恢復。
