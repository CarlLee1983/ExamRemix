questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 同時在操場和花圃測風，兩面旗子掛在相同高度、離障礙物的距離相近。操場使用薄紙旗，花圃使用同樣大小的厚布旗。看到紙旗晃得較明顯，就判定操場風一定較強。若要讓兩地比較較公平，應先怎麼做？
    options:
      - 直接按照這次旗子晃動的程度排名即可
      - 把花圃的旗子改得更大，讓它一定比紙旗更容易動
      - 改用材質、厚薄和大小都相同的旗子，再同時觀察
      - 將兩面旗子都移到操場，當作操場與花圃的比較
    answer: 3
    explanation: 不同材質與厚薄的旗子，受到相近的風也可能晃動不同。使用相同指標，再同時、同高度比較兩處，才能減少旗子本身差異的影響；把兩旗都移到操場就不能比較兩個地點。
    derivedFrom:
      - g3-science-midterm-2024-02-20
