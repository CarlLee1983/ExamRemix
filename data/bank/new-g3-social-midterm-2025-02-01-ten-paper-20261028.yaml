questions:
  - no: 1
    type: true-false
    subject: 社會
    grade: 3
    stem: 買早餐時，小欣有禮貌地稱呼年長的店員「阿姨」，可以表達親切。
    answer: true
    explanation: 親屬稱呼也可用在合宜的人際互動中，表示親切。
    derivedFrom:
