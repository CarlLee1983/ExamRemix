# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: 測試前，小安還沒有拍打空氣砲，旁邊開著的電扇就已把紙偶吹倒。接著他拍打杯口，看到紙偶仍倒在桌上，便記成「這次空氣砲成功擊倒紙偶」。這樣的紀錄足以證明這次空氣砲測試成功。
    answer: false
    explanation: 紙偶在拍打之前已倒下，之後仍倒著，不能證明是這次拍打使它倒下。應先排除電扇干擾、扶正紙偶，再觀察拍打前後的變化，才能記錄本次操作的效果。
