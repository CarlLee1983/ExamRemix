questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 家裡週日只需要用一次打氣筒。媽媽已確認可向鄰居免費借用，用完當天歸還；買一支要80元，兩種方式都能完成這次打氣。若只想完成這次需要、避免不必要購買，哪個決定合適？
    options:
      - 依約借用打氣筒，完成後按時歸還
      - 有使用需要，就一定得買一支自己擁有
      - 因為借用免費，用完就可以不歸還
      - 已確認能免費借用，仍因自己沒有打氣筒就認為一定無法完成
    answer: 1
    explanation: 題目已確認借用能完成這次需求且不花購買費用。需要使用不等於必須擁有，借來的物品仍須按約歸還。
    derivedFrom:
      - g3-social-midterm-2025-02-26
