questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 老師把一支普通鐵釘、一塊正常的雙極條形磁鐵和一根純塑膠棒打亂後，標成甲、乙、丙，沒有說明各是哪一件。選定每件物品的一端，在不接觸物品時，先用另一塊磁鐵的N極靠近，再用S極靠近；每次都測同一端。乙在兩次測試中都明顯被吸引。乙最可能是哪一件？
    options:
      - 正常的雙極條形磁鐵
      - 普通鐵釘
      - 純塑膠棒
      - 三者都有可能，完全無法區分
    answer: 2
    explanation: 鐵釘會被磁鐵的N極與S極吸引。若乙是正常雙極條形磁鐵的固定一端，對N、S兩極應有一次吸引、一次排斥；純塑膠棒則不會這樣被磁力吸引。題目限定不接觸且觀察到清楚的磁力作用，因此②唯一符合。這是以兩種磁極重複測同一端來分辨物品，不是只靠一次吸引就判磁鐵。
