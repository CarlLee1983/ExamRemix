# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力與磁鐵
    stem: 甲、乙用不同的圖例記錄同一種標準力。甲的圖例是「1公分代表1份標準力」，畫了4公分的線段；乙的圖例是「1公分代表2份同樣的標準力」，畫了3公分的線段。依照各自的圖例，哪一個記錄的力較大？
    options:
      - 一樣大
      - 已提供圖例仍無法比較
      - 甲
      - 乙
    answer: 4
    explanation: 必須先使用各自的圖例換成相同單位。甲代表4份標準力，乙代表3×2＝6份標準力，所以乙較大。兩張圖的圖例不同，不能直接比較紙上線段長度。本題的標準力份數是題目明示的記錄約定，沒有把線段長度當成實際測力單位。
