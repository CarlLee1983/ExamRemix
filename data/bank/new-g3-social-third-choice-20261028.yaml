questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小組要用心智圖一起整理「校園的學習場所」、「學校工作人員」和「學校活動」。哪個放在中央的主題最能包含這三個分支？
    options:
      - 圖書館的借書時間
      - 認識我們的學校
      - 體育股長的工作
      - 運動會賽跑成績
    answer: 2
    explanation: 中央主題要能涵蓋各分支；「認識我們的學校」可包含場所、人員和活動。其餘三項各只涉及其中一部分，不適合統整這三個分支。
    derivedFrom:
      - g3-social-midterm-2022-03-01
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    stem: 老師說：「這個月每逢星期二，都在圖書館上閱讀課。」哪則簡短筆記保留了上課地點和時間的重點？
    options:
      - 圖書館：這個月只去一次
      - 星期二：每次都在操場
      - 這個月每週二：圖書館閱讀課
      - 圖書館：每天上閱讀課
    answer: 3
    explanation: 「這個月每週二」保留了這個月內每逢星期二的時間資訊，「圖書館閱讀課」保留了地點和活動。其他選項把次數、地點或頻率改錯。
    derivedFrom:
      - g3-social-midterm-2024-03-05
  - no: 3
    type: choice
    subject: 社會
    grade: 3
    stem: 甲、乙都能做兩項打掃工作，且做同一項工作所需時間相同。甲只做一項，需20分鐘；乙也只做一項，需5分鐘。有人說「每人一項，工作量就一定公平」。哪個回應較合理？
    options:
      - 項目數相同就一定一樣辛苦，不必看內容
      - 只要抽籤分好，永遠都不能再討論
      - 讓做得比較久的人以後都不用做任何事
      - 還要了解工作內容與負擔，不能只數項目
    answer: 4
    explanation: 題目已說兩人做同一項工作的時間相同，因此20分鐘和5分鐘的差異來自工作內容。項目數雖相同，負擔仍可能不同，應共同了解內容再討論分工；不能只數項目或永久免除一人的責任。
    derivedFrom:
      - g3-social-midterm-2022-03-04
  - no: 4
    type: choice
    subject: 社會
    grade: 3
    stem: 小組要介紹「今天校園裡哪些地方設有飲水機」。手上有十年前的校園簡介。哪個做法最適合確認今天的情形？
    options:
      - 把舊簡介的年份擦掉，當作今天的資料
      - 只問從未來過學校的網友猜位置
      - 在老師同意下實地觀察並記錄目前的飲水機位置
      - 只根據十年前的位置，認定十年間完全沒有變動
    answer: 3
    explanation: 要介紹今天的位置，應使用能反映目前情形的資料。經老師同意實地觀察並記錄可直接了解現況；舊簡介可供參考，卻不能單獨保證今天的位置完全相同。
    derivedFrom:
      - g3-social-midterm-2023-02-28
  - no: 5
    type: choice
    subject: 社會
    grade: 3
    stem: 小芸和小安屬於同一族群，家中也過同樣的傳統節日。有人因此說「他們喜歡的運動一定完全相同」。哪個判斷較合理？
    options:
      - 同一族群的人，所有興趣都必須一樣
      - 有共同文化，仍可能有不同的個人興趣
      - 只要喜歡不同運動，就一定不是同一族群
      - 只要過同一節日，就不必再認識每個人的想法
    answer: 2
    explanation: 族群有共同語言、習俗等文化特徵，但每個人仍可有不同興趣；不能由共同的傳統節日推定喜歡的運動完全一樣，也不能因運動興趣不同就否定族群關係。
    derivedFrom:
      - g3-social-midterm-2025-02-23
