questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 課文寫「不是所有休閒活動都要花錢」。小明只把「所有休閒活動都要花錢」畫線，複習時也只讀畫線部分。這種畫線最主要的問題是什麼？
    options:
      - 畫線越長，原句就一定越正確
      - 只要有畫線，漏掉任何字都不會影響意思
      - 漏掉「不是」後，畫線部分和原句的意思相反
      - 所有重點都必須是花錢的活動名稱
    answer: 3
    explanation: 「不是」決定這句話不是在說每種活動都要花錢。省略這個否定詞會把原意翻轉，因此整理重點不能漏掉決定意思的詞。
    derivedFrom:
      - g3-social-midterm-2022-04-03
