questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物與磁鐵
    stem: 做一份蛋餅只用了小麥磨成的麵粉、雞蛋和水，沒有其他原料。只看這份原料紀錄，哪個分類最完整？
    options:
      - 全部原料都來自植物
      - 全部原料都來自動物
      - 有植物來源，也有動物來源，水另外記錄
      - 只要煮熟，就不能再知道原料來源
    answer: 3
    explanation: 麵粉由小麥製成，是植物來源；雞蛋是動物來源，水則另記為水，不硬歸入動物或植物。因此③完整保留三種原料的來源。烹煮不會改變紀錄中已知的原料出處，不能只用一種來源概括整份混合食物。
    derivedFrom:
      - g3-science-midterm-2020-21
