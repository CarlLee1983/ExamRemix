# 普仁111上期中；原答案卷未見，以下答案均自行解題。
questions:
  - no: 1
    type: true-false
    subject: 社會
    grade: 3
    stem: "[家人|ㄐㄧㄚ ㄖㄣˊ][辛苦|ㄒㄧㄣ ㄎㄨˇ][工作|ㄍㄨㄥ ㄗㄨㄛˋ][獲得|ㄏㄨㄛˋ ㄉㄜˊ][收入|ㄕㄡ ㄖㄨˋ]，[是|ㄕˋ][為了|ㄨㄟˋ ˙ㄌㄜ][要|ㄧㄠˋ][支應|ㄓ ㄧㄥˋ][生活|ㄕㄥ ㄏㄨㄛˊ][中|ㄓㄨㄥ][的|˙ㄉㄜ][各項|ㄍㄜˋ ㄒㄧㄤˋ][消費|ㄒㄧㄠ ㄈㄟˋ]。"
    answer: true
    explanation: "家庭生活中的飲食、居住、交通等消費需要金錢，家人工作獲得的收入可用來支應這些開銷。這是在判斷工作收入與生活消費的關係，不表示每一筆收入都必須立即花完。本答案為依題意自行解題，非官方答案。"
    source:
      originalPaper: 111(上)期中評量社會領域試卷
      section: 一、是非題：每題2分，共24分。
      number: 4
  - no: 2
    type: true-false
    subject: 社會
    grade: 3
    stem: "[兄弟姐妹|ㄒㄩㄥ ㄉㄧˋ ㄐㄧㄝˇ ㄇㄟˋ][面對|ㄇㄧㄢˋ ㄉㄨㄟˋ][事情|ㄕˋ ㄑㄧㄥˊ][的|˙ㄉㄜ][想法|ㄒㄧㄤˇ ㄈㄚˇ][若|ㄖㄨㄛˋ][不同|ㄅㄨˋ ㄊㄨㄥˊ]，[身為|ㄕㄣ ㄨㄟˊ][弟妹|ㄉㄧˋ ㄇㄟˋ][就|ㄐㄧㄡˋ][得|ㄉㄟˇ][聽|ㄊㄧㄥ][哥哥|ㄍㄜ ㄍㄜ][姐姐|ㄐㄧㄝˇ ㄐㄧㄝˇ][的|˙ㄉㄜ]，[照|ㄓㄠˋ][他們|ㄊㄚ ˙ㄇㄣ][的|˙ㄉㄜ][想法|ㄒㄧㄤˇ ㄈㄚˇ][去|ㄑㄩˋ][做|ㄗㄨㄛˋ]。"
    answer: false
    explanation: "兄弟姐妹有不同想法時，應互相傾聽、說明理由並溝通；不能只因自己排行較小，就認為必須無條件照哥哥姐姐的想法做。尊重年長手足不等於放棄表達與判斷。本答案為依題意自行解題，非官方答案。"
    source:
      originalPaper: 111(上)期中評量社會領域試卷
      section: 一、是非題：每題2分，共24分。
