questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 班級的自治活動
    stem: 全班20人各投一票，事前約定「得票超過全班人數的一半，才算當選」。甲得10票、乙得6票、丙得4票。只依這項約定，哪個判斷正確？
    options:
      - 目前沒有人達到當選門檻，不能只因甲票最多就宣布他當選
      - 甲票最多，所以不必再看過半門檻
      - 甲正好得到一半，和超過一半完全相同
      - 乙和丙的票加起來10票，所以乙已經當選
    answer: 1
    explanation: 20人的一半是10人；「超過一半」需要多於10票。甲雖最多但只有10票，三人都未達到約定門檻。
    derivedFrom:
      - g3-social-midterm-2021-02-01
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    unit: 班級的自治活動
    stem: 班級約定這次投票不能從選票查出投票人。選票沒有姓名，卻印有每個人的座號，而班級名冊列有座號和姓名。有人說「沒寫姓名，就一定保密」。哪個判斷正確？
    options:
      - 只要不寫姓名，任何其他身分標記都不會影響保密
      - 座號仍能對照名冊找到投票人，這種選票尚未符合保密約定
      - 把每張票公開貼在名冊旁，就能讓投票更保密
      - 只要先知道誰投哪一案，再擦掉姓名就算全程保密
    answer: 2
    explanation: 名冊可以把座號連回姓名，因此座號也能辨認投票人。是否保密要看能不能查出誰投票，不能只看有沒有姓名。
    derivedFrom:
      - g3-social-midterm-2021-02-01
