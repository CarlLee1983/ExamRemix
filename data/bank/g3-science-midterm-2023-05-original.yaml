questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物大發現
    stem: 落地生根葉子特別厚，有什麼特殊的功能？
    options:
      - 幫助排水
      - 傳播種子
      - 儲存水分
      - 爭取陽光
    answer: 3
    explanation: 落地生根肥厚的肉質葉片可以儲存水分，因此選③。題目問的是葉片特別厚的特殊功能，不是葉片一般接收陽光的作用；葉緣長出小植株也不是傳播種子。答案依原題與可靠植物資料獨立推核，未取得官方答案。
    source:
      originalPaper: 112學年度第一學期期中評量三年級自然與生活科技試卷
      section: 二、選擇題（每題3分，共36分）
      number: 2
