questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 無子西瓜的果實裡沒有種子，是因為果農把它挑掉了。
    answer: false
    explanation: 無子西瓜是經由特殊的育種方式培育出來的品種，本來就不會長出成熟的種子，不是果農一顆一顆把種子挑掉。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 109學年度第1學期三年級自然科期中定期評量試卷
      section: 一、是非題：每題2分，共20分
      number: 2
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 將磁鐵靠近撒滿鐵粉的桌面，鐵粉會聚集在磁鐵周圍，有些地方很密集，有些地方比較稀疏。下列關於磁力的敘述，哪一項是正確的？
    options:
      - 磁鐵必須碰觸到鐵粉，才能吸引它
      - 磁鐵的磁力大小無法比較
      - 磁鐵周圍的鐵粉分布越密集的地方，代表磁力越大
      - 將鐵粉改成沙子，也可以看出磁鐵磁力的分布範圍
    answer: 3
    explanation: 鐵粉越密集的地方，表示磁力越大；磁鐵不必碰到鐵粉就能吸引它；磁力大小可以由鐵粉分布比較；沙子不會被磁鐵吸引，看不出磁力分布。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 109學年度第1學期三年級自然科期中定期評量試卷
      section: 四、閱讀題 1(1)：每題2分，共10分
  - no: 3
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 景觀綠肥植物（如波斯菊、向日葵、油菜）的應用中，可以裝飾環境、達到美化環境的作用，是利用它們身體的哪個部位？
    options:
      - 根
      - 莖
      - 葉
      - 花
      - 果實
    answer: 4
    explanation: 波斯菊、向日葵、油菜等景觀綠肥植物開出的花色彩繽紛，可以裝飾環境、美化環境，所以是利用花。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 109學年度第1學期三年級自然科期中定期評量試卷
      section: 四、閱讀題 2(1)：每題2分，共10分
  - no: 4
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 種植景觀綠肥植物，可以帶動農村發展休閒觀光農業、防止雜草滋生、避免雨水直接沖刷造成土壤流失、成為蜜蜂採蜜的來源，植物枯萎後掩埋，被土壤內微生物分解，還能成為下次種植農作物的肥料。下列哪一項不是種植景觀綠肥植物的優點？
    options:
      - 促進發展休閒觀光農業
      - 蜜蜂採蜜的來源
      - 供給下一次農作物的養分
      - 可以當作當地居民建築物房子的材料
    answer: 4
    explanation: 景觀綠肥植物可以帶動休閒觀光、提供蜜源、枯萎後當肥料；它們不是用來蓋房子的建材。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 109學年度第1學期三年級自然科期中定期評量試卷
      section: 四、閱讀題 2(2)：每題2分，共10分
