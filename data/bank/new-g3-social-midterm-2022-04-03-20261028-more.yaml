questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 課文寫：「分工前先了解各人的能力，再討論工作份量，最後確認每人負責的事。」想在複習時快速看出分工的三個重點，哪種畫線方式最有幫助？
    options:
      - 把整段每個字都塗滿，讓重點和其他字一樣醒目
      - 只畫出「前、再、最後」而不保留做什麼
      - 標出「了解各人的能力、討論工作份量、確認每人負責的事」
      - 只畫出句末的句號
    answer: 3
    explanation: 三組詞語保留各步驟的主要行動，可幫助複習；只標時間詞、標點或塗滿整段，無法清楚區分內容重點。
