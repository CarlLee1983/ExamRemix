questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 班際競賽後，小組發現裁判把自己隊伍的分數多加了，而依公布的規則，改正後自己隊伍會失去第一名。哪個做法符合公平競爭的精神？
    options:
      - 把原始成績單藏起來，保住第一名
      - 只有對手被多加分時才提出，自己被多加分就不說
      - 請老師協助向裁判反映，依原始紀錄核對並更正
      - 要求裁判事後更改規則，讓自己一定維持第一名
    answer: 3
    explanation: 公平競爭應依相同規則與正確成績評比。發現自己被多加分，仍應反映並核對，不能因改正後失去名次就隱瞞。
    derivedFrom:
      - g3-social-midterm-2025-19
