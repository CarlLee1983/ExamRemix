  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 風與空氣
    stem: "物體內只要有縫隙，就有空氣，因此空氣無所不在。"
    answer: true
    explanation: "物體內有縫隙的地方就有空氣，我們身邊的各個地方幾乎都有空氣，所以說空氣無所不在。答案依原題獨立推核，非官方答案。"
    source:
