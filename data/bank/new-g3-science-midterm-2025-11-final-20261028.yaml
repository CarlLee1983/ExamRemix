questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 老師用同一扇門做兩次測試，每次都從相同的關門位置開始，兩次都從門的同一側，朝開門方向垂直門板推，推力大小和推的時間都相同。一次推靠近門軸的位置，一次推靠近把手的位置，觀察到門開始轉動的情形不同。這個比較最能說明什麼？
    options:
      - 只要推力大小相同，門的轉動情形就一定相同
      - 門只有受到向上的力才會轉動
      - 施力的位置也會影響門的轉動，不能只看推力大小
      - 門有沒有轉動只和門板顏色有關
    answer: 3
    explanation: 兩次都用同一扇門，起始位置、推力大小、相對門板的推力方向和施力時間相同，主要改變的是推的位置，也就是力的作用點。門轉動情形不同，表示除了力的大小與方向，作用點也會影響施力的結果。
    derivedFrom:
      - g3-science-midterm-2025-11
