  - no: 16
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 哪種植物的根會露出地面，一條一條的，而且粗細差不多？
    options:
      - 酒瓶椰子
      - 樟樹
      - 臺灣欒樹
      - 金桔
    answer: 1
    explanation: 酒瓶椰子為單子葉植物，基部常長出叢生、粗細相近的支持根（鬚根系），露出於地面附近。答案依原題獨立推核，非官方答案。
