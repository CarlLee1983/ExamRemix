questions:
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 生物與非生物
    stem: 同學每隔一分鐘記錄一次花圃中的蝸牛，三次都看到一隻，便把1＋1＋1相加，記成花圃裡至少有三隻蝸牛。要檢查這個算法是否重複計數，最需要補充哪項觀察？
    options:
      - 三次看到的蝸牛是否屬於相同種類
      - 三次看到的是否為同一個體，例如是否能追蹤移動或辨認外形特徵
      - 三次觀察時的氣溫是否相同
      - 三次觀察時有沒有陽光
    answer: 2
    explanation: 三次都看到一隻，不代表一定是三個不同個體；同一隻蝸牛可能被重複記錄。需追蹤位置移動或辨認個體特徵，再決定能否相加成三隻，不能只把觀察次數當成個體數。
    derivedFrom:
      - g3-science-midterm-2025-02-18
