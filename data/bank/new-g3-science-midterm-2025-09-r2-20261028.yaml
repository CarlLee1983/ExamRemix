    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 想用植物材料製作需要支撐書本的小架子，哪種材料最適當？
    options:
      - 剛摘下的柔軟薄葉
      - 散落的花瓣
      - 成熟柔軟的果肉
      - 較堅硬的木板
    answer: 4
    explanation: 木板來自木質莖，較堅硬而能支撐；柔軟葉片、花瓣及果肉不適合用來承重。
