questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 班級自治活動
    stem: 下列哪一項不屬於一般召開班會的程序？
    options: [家長報告, 報告事項, 討論事項, 臨時動議]
    answer: 1
    explanation: 一般班會程序包括報告事項、討論事項及臨時動議；家長報告通常不是班會的固定程序，因此選①。個別班會可以依需要邀請家長分享，本題問的是一般程序，並不是說家長絕對不能報告。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 113學年度上學期三年級社會領域期中評量試卷
      section: 二、選擇題：每格2分、共52分
      number: 5
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    unit: 家庭生活
    stem: 為什麼愛惜自己的身體，避免受傷也算是孝順的行為？
    options:
      - 我們受傷了，就會大哭大鬧
      - 我們受傷了，父母會擔心難過
      - 我們受傷了，會被父母責罵
      - 我們受傷了，可以不用上學
    answer: 2
    explanation: 愛惜身體、注意安全，能減少父母因我們受傷而擔心難過，表達對父母的體貼，因此選②。大哭大鬧、怕被責罵或想不用上學，都沒有說明愛惜身體與體貼父母之間的關係；受傷時仍應求助，不必因此自責。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 113學年度上學期三年級社會領域期中評量試卷
      section: 二、選擇題：每格2分、共52分
      number: 22
  - no: 3
    type: choice
    subject: 社會
    grade: 3
    unit: 校園生活規範
    stem: 家雨喜歡溜滑梯，但是下課時間很多人都想玩，她應該怎麼做
    options:
      - 不管有多少人都直接插隊
      - 叫前面的人讓他先玩
      - 推擠排隊的人
      - 依序排隊，耐心等待
    answer: 4
    explanation: 大家都想使用溜滑梯時，依序排隊、耐心等待能尊重他人的先後順序，減少爭搶與推擠造成的危險，因此選④。插隊、要求前面的人讓自己先玩或推擠，都不符合本題情境中的秩序與安全。原卷②印作「他」，此處照錄。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 113學年度上學期三年級社會領域期中評量試卷
      section: 二、選擇題：每格2分、共52分
      number: 26
