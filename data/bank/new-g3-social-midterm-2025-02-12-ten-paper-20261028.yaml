      - g3-social-midterm-2025-02-12
  - no: 2
    type: true-false
    subject: 社會
    grade: 3
    stem: 想買價格較高的球鞋，只要一直想著它，完全不存錢也算完成儲蓄計畫。
    answer: false
    explanation: 儲蓄需要實際累積金錢，不能只有想法。
