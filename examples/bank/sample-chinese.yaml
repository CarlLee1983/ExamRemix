    type: true-false
    subject: 國語
    grade: 3
    unit: 字詞
    stem: "「寂靜」和「喧嘩」的意思相近。"
    answer: false
    explanation: "「寂靜」是沒有聲音，「喧嘩」是吵鬧，意思相反。"
    confirmed: true
    source:
