  - no: 2
    type: true-false
    subject: 社會
    grade: 3
    stem: 鄰居不是我的親戚，所以用「叔叔」稱呼他一定是失禮的。
    answer: false
    explanation: 合宜地借用親屬稱呼，可表達禮貌和親切，不限真正的親戚。
    derivedFrom:
      - g3-social-midterm-2025-02-01
  - no: 3
    type: true-false
    subject: 社會
    grade: 3
    stem: 社區的長輩喜歡大家叫他「陳爺爺」，小安這樣稱呼他，有助親切互動。
    answer: true
    explanation: 依對方接受的方式稱呼，可拉近彼此距離。
    derivedFrom:
