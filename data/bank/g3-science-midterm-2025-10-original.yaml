questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 生活中的力
    stem: 將長尾夾放入水中，長尾夾會沉下去，是因為長尾夾沒有受到浮力的作用。
    answer: false
    explanation: 長尾夾在水中下沉，並不表示沒有受到水向上的浮力。一般浸在水中下沉的物體仍受到浮力，只是浮力不足以使它浮起，所以原敘述錯誤。本題判斷下沉過程，不將它擴張成任何物體密貼容器底部時都必然符合相同受力情形。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 114學年度上學期三年級自然領域期中評量卷
      section: 察覺生活中不同的力，並了解磁鐵的特性與生活應用。／一、是非題(對的畫○，錯的打×)：(2格)
      number: 1
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 多采多姿的植物
    stem: 觀察植物時，下面哪一種方式不適合用來記錄葉子表面的特徵？
    options: [拍照, 拓印, 文字記錄觸感, 聞一聞]
    answer: 4
    explanation: 拍照可留下葉面外觀，拓印可留下葉面紋路，文字可記下觸摸到的粗糙或光滑等特徵。聞一聞是辨別氣味，不能用來記錄本題所問的葉子表面特徵，因此選④。這不是說氣味不能成為植物觀察的資料；本題特別問葉面特徵的記錄方式。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 114學年度上學期三年級自然領域期中評量卷
      section: 能運用五官或工具(測量樹圍、用放大鏡觀察、用手搧聞氣味)等觀察自然的方式。／二、選擇題：(5格)
      number: 1
  - no: 3
    type: choice
    subject: 自然
    grade: 3
    unit: 多采多姿的植物
    stem: 想要比較兩棵植物莖的粗細，可以怎麼做？
    options: [用尺量一量莖的粗細, 輕輕拉一拉莖, 用鋸子將莖鋸下, 用鼻子聞一聞氣味]
    answer: 1
    explanation: 用尺量一量能取得可比較的莖粗細資料，因此選①。拉一拉不會量出粗細，用鋸子鋸下會傷害植物且不是本題需要的方法，聞氣味也不能比較粗細。測量時應選可比較的位置、輕柔操作，不把粗細與莖的氣味或被拉動的情況混為一談。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 114學年度上學期三年級自然領域期中評量卷
      section: 能運用五官或工具(測量樹圍、用放大鏡觀察、用手搧聞氣味)等觀察自然的方式。／二、選擇題：(5格)
      number: 2
  - no: 4
