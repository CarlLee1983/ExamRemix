questions:
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 小杰早上在打掃校園環境時，常常被分配到外掃區打掃落葉，落葉的形狀像手掌，它可能是下列哪種植物？
    options: [槭樹, 榕樹, 菩提樹]
    answer: 1
    explanation: 槭樹的葉片常呈掌狀分裂，像張開的手掌，符合題目的形狀描述；榕樹葉通常為橢圓形，菩提樹葉通常為心形而有長尾尖。這是在題列三種植物中判斷可能來源，不表示所有掌狀葉都只能屬於槭樹。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 99學年度第一學期期中定期評量三年級自然與生活科技領域試題
      section: 二、選擇題：每題2分，共30分。
      number: 1
  - no: 3
    type: choice
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 下列哪一項不是磁鐵在生活中常見的應用？
    options:
      - 裝在冰箱門框內，使冰箱緊閉
      - 裝在跳棋裡，使棋子固定在棋盤上
      - 製作成外套上的拉鍊，使衣服拉起來。
    answer: 3
    explanation: 一般外套拉鍊靠兩排鏈齒互相咬合來開合，主要不是利用磁鐵；冰箱門框內的磁條、磁性跳棋則利用磁力固定。本題問常見應用，不宣稱任何特殊拉鍊都不可能使用磁性零件。答案依原題獨立推核，未取得官方答案。
    source:
      originalPaper: 99學年度第一學期期中定期評量三年級自然與生活科技領域試題
      section: 二、選擇題：每題2分，共30分。
      number: 15
