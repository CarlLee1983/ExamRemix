    answer: 4
    explanation: 依共同校園圖的北箭頭，圖下方是南、右方是東。以籃球場為基準，301教室在右下方，即東南方，應選④。其餘三個方向分別在右上、左下、左上，與301教室的位置不符。答案依原圖獨立推核，未取得官方答案。
