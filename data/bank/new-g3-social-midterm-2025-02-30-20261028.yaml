questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小安看到不認識的人在教室外停留兩次，但沒有看到他進教室或拿東西。要把目前知道的情況告訴老師，哪個說法最合適？
    options:
      - 那個人一定已偷走全班的東西
      - 我沒看到他拿東西，所以已能保證任何人都不必注意
      - 我看到不認識的人在教室外停留兩次，請老師協助確認
      - 只要是不認識的人，我就能確定他所有想法
    answer: 3
    explanation: 通報應先說清楚實際看到的位置與行為，再由老師協助確認。沒有看見拿東西，不能直接指控偷竊，也不能反過來保證完全安全。
    derivedFrom:
      - g3-social-midterm-2025-02-30
