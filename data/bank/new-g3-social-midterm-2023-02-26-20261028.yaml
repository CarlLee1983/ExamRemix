questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小琳檢查社會錯題，發現三題都把主席和司儀的工作弄混；其他題目已能說明理由。若先針對目前最常錯的地方複習，哪個安排最合適？
    options:
      - 只把已經懂的學校名稱重抄十次
      - 只把三個正確選項號碼背下來，不看自己混淆什麼
      - 把錯題藏起來，認為不看就等於已經學會
      - 比較主席與司儀的職務，再不看答案說說兩者差別
    answer: 4
    explanation: 錯題紀錄指出主要混淆的是兩種職務，應針對這個差別理解並自行檢查。重抄已懂的內容或只背號碼不能直接處理這項混淆。
    derivedFrom:
      - g3-social-midterm-2023-02-26
