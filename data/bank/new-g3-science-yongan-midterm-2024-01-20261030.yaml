  - no: 2
    type: true-false
    subject: 自然
    grade: 3
    unit: 空氣與水
    stem: 用同一個等臂天平，每次測量前都先調平，每盤只放一件物品。先比較甲、乙，甲側較低；再比較乙、丙，乙側較低。測量過程中，三件物品的重量都沒有改變。即使甲、丙還沒直接放上去比較，仍能判定甲比丙重。
    answer: true
    explanation: 第一次可知甲比乙重，第二次可知乙比丙重。因此甲比乙重、乙又比丙重，可推得甲比丙重。這裡兩次都只比較同一批單件物品，重量也沒有變動。
