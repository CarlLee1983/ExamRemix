questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 同學想知道校園裡陌生紅色果實能不能吃，哪個做法適當？
    options:
      - 每人吃一口就能確定安全
      - 看起來像糖果就可以吃
      - 只要鳥吃過，人就一定能吃
      - 先請教老師並查可靠資料，不自行試吃
    answer: 4
    explanation: 陌生果實不能靠外觀或動物取食判定對人安全，應先查證，不自行品嚐。
    derivedFrom:
      - g3-science-midterm-2025-06
  - no: 2
    type: choice
    subject: 自然
    grade: 3
    unit: 植物
    stem: 要比較校園葉片的形狀，又希望減少傷害植物，哪種方式適當？
    options:
      - 先在植株旁觀察記錄，必要時依老師指示使用掉落葉
      - 把每株植物的葉子全部摘光
      - 折斷枝條後才開始觀察
      - 把整株拔起才能比較葉形
    answer: 1
    explanation: 直接觀察記錄或使用適當的掉落葉，可降低對植株的傷害，無須摘光或拔起。
    derivedFrom:
      - g3-science-midterm-2025-06
