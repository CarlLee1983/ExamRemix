# 普仁113上期中，原第1頁二13；答案自行解題，非官方答案。
questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: "[哪|ㄋㄚˇ][個|ㄍㄜˋ][不是|ㄅㄨˊ ㄕˋ][製作|ㄓˋ ㄗㄨㄛˋ]T[表格|ㄅㄧㄠˇ ㄍㄜˊ][的|˙ㄉㄜ][好處|ㄏㄠˇ ㄔㄨˋ]？"
    options:
      - "[可以|ㄎㄜˇ ㄧˇ][整理|ㄓㄥˇ ㄌㄧˇ][重點|ㄓㄨㄥˋ ㄉㄧㄢˇ]"
      - "[方便|ㄈㄤ ㄅㄧㄢˋ][分析|ㄈㄣ ㄒㄧ][資料|ㄗ ㄌㄧㄠˋ]"
      - "[能|ㄋㄥˊ][將|ㄐㄧㄤ][資料|ㄗ ㄌㄧㄠˋ][進行|ㄐㄧㄣˋ ㄒㄧㄥˊ][分類|ㄈㄣ ㄌㄟˋ]"
      - "[可以|ㄎㄜˇ ㄧˇ][自己|ㄗˋ ㄐㄧˇ][讀|ㄉㄨˊ][就|ㄐㄧㄡˋ][好|ㄏㄠˇ]，[不用|ㄅㄨˊ ㄩㄥˋ][再|ㄗㄞˋ][聽|ㄊㄧㄥ][老師|ㄌㄠˇ ㄕ][講解|ㄐㄧㄤˇ ㄐㄧㄝˇ]。"
    answer: 4
    explanation: "T表格可把資料分欄整理，幫助分類、看出重點並比較分析。它是協助學習的工具，不代表做了表格就不用聽老師講解。因此第4項不是製作T表格的好處。本答案為依題意獨立解題，非官方答案。"
    source:
      originalPaper: 113(上)期中評量社會領域試卷
      section: 二、選擇題（每題2分，共40分）
      number: 13
