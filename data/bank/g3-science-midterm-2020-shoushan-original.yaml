  - no: 3
    type: true-false
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 有些物體受到力的作用後，會恢復原本的形狀，是因為它具有彈性。
    answer: true
    explanation: 物體受力變形後能恢復原狀的性質叫做彈性，例如橡皮筋、彈簧。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 109學年度第1學期三年級自然領域期中評量試卷
      section: 一、是非題：每題2分，共30分
      number: 8
  - no: 4
    type: true-false
    subject: 自然
    grade: 3
    unit: 植物
    stem: 榕樹有一條條從樹枝上垂下來的構造，是榕樹的莖。
    answer: false
    explanation: 榕樹從樹枝垂下的一條條構造是氣生根，屬於根，不是莖。答案依原題獨立推核，非官方答案。
    source:
      originalPaper: 109學年度第1學期三年級自然領域期中評量試卷
