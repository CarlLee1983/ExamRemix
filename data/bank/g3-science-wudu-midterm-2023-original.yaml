  - no: 6
    type: choice
    subject: 自然
    grade: 3
    unit: 植物大發現
    stem: 花粉是由哪一個構造產生的？
    options:
      - 雄蕊
      - 雌蕊
      - 花瓣
      - 花萼
    answer: 1
    explanation: 花粉由雄蕊的花藥產生，因此四個構造中選雄蕊。答案依題意獨立推核，未取得官方答案。
    source:
      originalPaper: 基隆市五堵國民小學112學年度第一學期期中評量三年級自然與生活科技試卷
      section: 二、選擇題（每題3分，共36分）
      number: 1
  - no: 7
    type: choice
    subject: 自然
    grade: 3
    unit: 植物大發現
    stem: 小明不小心將朝天椒的盆栽踢倒，過了一段時間後會發現朝天椒的根、莖如何生長？
    options:
      - 根向下生長，莖向上生長
      - 根向上生長，莖向下生長
      - 根、莖沿著地板平行生長
      - 根、莖向下生長
    answer: 1
    explanation: 一般情況下，根會朝下生長，莖會朝上生長，因此選①；這是在問後續生長的方向。答案依題意獨立推核，未取得官方答案。
    source:
      originalPaper: 基隆市五堵國民小學112學年度第一學期期中評量三年級自然與生活科技試卷
