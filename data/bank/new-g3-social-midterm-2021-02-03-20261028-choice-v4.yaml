questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    unit: 班級的自治活動
    stem: 今天班會的原定議程已有「球具借還方式」和「同樂會時間」。到了臨時動議，要從下列建議選一項，須同時符合未排入原定議程、又適合全班共同討論。哪一項符合？
    options:
      - 討論雨天班級共用雨具如何擺放
      - 討論球具借還方式
      - 請某位同學公開自己的帳號密碼
      - 討論同樂會時間
    answer: 1
    explanation: 雨天共用雨具擺放是班級公共事務，且不在原定的兩項議程中。球具和同樂會已排入；公開同學密碼涉及個人秘密，不合適。
    derivedFrom:
      - g3-social-midterm-2021-02-03
