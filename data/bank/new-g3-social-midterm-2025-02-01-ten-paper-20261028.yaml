      - g3-social-midterm-2025-02-01
  - no: 8
    type: true-false
    subject: 社會
    grade: 3
    stem: 小宇平常親切地叫早餐店女老闆「阿姨」；爸爸的妹妹來作客時，若依親屬關係稱呼，則應叫她「姑姑」。
    answer: true
    explanation: 對非親屬可以借用親屬稱呼表達親切；實際親屬關係中，爸爸的妹妹是姑姑。
