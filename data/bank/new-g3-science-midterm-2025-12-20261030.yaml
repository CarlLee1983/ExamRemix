# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: choice
    subject: 自然
    grade: 3
    unit: 力與運動
    stem: 小美把一塊材料捏成球形，再壓扁。放手後，它仍然是扁的。小美接著再次用手，把它重新捏成原來的球形。下列哪個判斷最合理？
    options:
      - 最後變回球形，是小美再次施力造成的
      - 材料從來沒有變形
      - 最後回到球形，就足以證明它具有彈性
      - 材料是放手後自己恢復球形的
    answer: 1
    explanation: 材料放手後仍扁，後來是再次用手施力才變回球形。判斷是否自行恢復，不能把人為重新塑形當成材料自己的恢復。
