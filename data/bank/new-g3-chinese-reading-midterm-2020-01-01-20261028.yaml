groups:
  - no: 1
    paragraphs:
      - 小晴和阿哲替班上設計找書籤的遊戲。小晴把書籤藏在教室外的花盆旁，阿哲在紙上寫下說明：「走到門口，向左轉，就能找到書籤。」他覺得只用短短一句話，大家一定很容易看懂。
      - 小晴照著說明試走，卻走到走廊的櫃子前。阿哲很奇怪，明明自己向左轉就能看到花盆，為什麼小晴找不到呢？兩人一比，才發現教室有前後兩扇門。阿哲從黑板旁的前門出去，小晴卻從後門出去。
      - 他們把說明改成：「從黑板旁的門出去，找到走廊上的花盆，書籤就在花盆旁。」小晴再試一次，這回很快就找到了。阿哲說：「原來我知道的事，別人不一定知道。說明寫清楚，大家才不會走錯。」
    members: [ 1, 2, 3, 4 ]
    derivedFrom: g3-chinese-reading-midterm-2020-01#1
  - no: 2
    paragraphs:
      - 小庭和阿文負責收集同學的意見，決定班上的遊戲時間要玩什麼。阿文提出躲避球，幾位同學大聲歡呼。他便說：「聽起來大家都想玩躲避球，就選它吧！」小庭卻看到幾位同學一直沒有開口。
      - 小庭提議讓每個人在小紙條上寫下一種最想玩的遊戲，再一起數票。阿文同意了。兩人打開紙條，發現跳繩得到的票最多，躲避球的票反而比較少。原來有些想跳繩的同學沒有出聲，剛才的歡呼並不能代表全班的意見。
      - 兩人把票數告訴全班，依照結果選了跳繩。阿文說：「還好我們沒有只聽歡呼聲。每個人都有機會表示意見，才知道大家真正的選擇。」
    members: [ 5, 6, 7, 8 ]
    derivedFrom: g3-chinese-reading-midterm-2020-01#1
