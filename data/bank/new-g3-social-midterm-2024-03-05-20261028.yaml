questions:
  - no: 1
    type: choice
    subject: 社會
    grade: 3
    stem: 小安筆記中的星號代表「還要查證」，同學卻以為星號代表「已確定正確」。小安要把這份筆記交給同學使用，哪個做法最能避免誤讀？
    options:
      - 在筆記附上星號的意思，先和同學確認讀法一致
      - 只把星號畫得更大，仍不說它的意思
      - 認為大家一定會自動知道每個人自訂符號的意思
      - 把星號改成另一個沒說明的新符號就一定不會誤讀
    answer: 1
    explanation: 同一個自訂符號可能被讀成不同意思，分享筆記時需要說明符號和意思的對應。畫得更大或換符號，仍不能解決讀法不一致。
    derivedFrom:
      - g3-social-midterm-2024-03-05
  - no: 2
    type: choice
    subject: 社會
    grade: 3
    stem: 課堂內容是「因為下大雨，戶外觀察改到室內」。小組約定筆記箭頭表示「原因→結果」。哪個簡記符合這段內容和約定？
    options:
      - 改到室內→大雨
      - 大雨→改到室內
      - 大雨→照常戶外觀察
      - 改到室內→天氣晴朗
    answer: 2
    explanation: 原文的原因是大雨，結果是改到室內。既然箭頭約定由原因指向結果，兩者不能倒置，也不能改成原文沒有的結果。
    derivedFrom:
      - g3-social-midterm-2024-03-05
