# 第十份補題：依已核原題衍生的不同完整推理任務，非原卷逐字題。
questions:
  - no: 1
    type: true-false
    subject: 自然
    grade: 3
    unit: 磁鐵
    stem: 甲、乙、丙是三支各有N、S兩極的長條形磁鐵，每支磁鐵的兩端分別貼著一張N和一張S紙標籤。老師確認恰好有一支磁鐵的兩張標籤貼反，其餘兩支都貼對。每次只取兩支磁鐵，把各自貼著N標籤的固定端靠近，發現甲與乙相斥、甲與丙相吸、乙與丙相吸。因此，兩張標籤貼反的是丙磁鐵。
    answer: true
    explanation: 甲、乙的受測端相斥，表示兩端實際是同極。如果它們都是S，甲乙兩支就都貼反，違反恰好一支貼反的條件，所以甲乙受測端都是N。丙的受測端與它們都相吸，實際是S，卻貼成N，因此丙貼反。
