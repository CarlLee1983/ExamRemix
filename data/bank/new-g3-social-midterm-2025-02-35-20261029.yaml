questions:
  - no: 1
    type: multi-select
    subject: 社會
    grade: 3
    stem: 家人用「餐飲費」記餐點花費，用「交通費」記乘車花費。這次付了90元，收據明細寫車資30元、午餐60元。只依明細，下列哪些記錄或說法正確？
    options:
      - 交通費記30元。
      - 餐飲費記60元。
      - 因為只拿到一張收據，90元只能全部記在同一欄。
      - 兩項費用合計90元。
      - 交通費和餐飲費各記90元。
    answer: [1, 2, 4]
    explanation: 按明細，車資30元歸交通費，午餐60元歸餐飲費，合計30＋60＝90元。一張收據可以有不同種類的支出，應按明細分項；若兩欄各記90元，就會把同一筆付款重複記成180元。
    derivedFrom:
      - g3-social-midterm-2025-02-35
