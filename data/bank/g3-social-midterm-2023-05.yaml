# 普仁112上期中，三1各小項原為逐項打○/×，非改造勾選題。
# 題意各自完整，不依賴三2、四2或五的共用故事。原印「介紹的更流暢」照錄。
questions:
  - no: 1
    type: true-false
    subject: 社會
    grade: 3
    stem: "[下列|ㄒㄧㄚˋ ㄌㄧㄝˋ][關於|ㄍㄨㄢ ㄩˊ]「[自我|ㄗˋ ㄨㄛˇ][介紹|ㄐㄧㄝˋ ㄕㄠˋ]」[的|˙ㄉㄜ][敘述|ㄒㄩˋ ㄕㄨˋ]，[哪些|ㄋㄚˇ ㄒㄧㄝ][是|ㄕˋ][正確|ㄓㄥˋ ㄑㄩㄝˋ][的|˙ㄉㄜ]？\n[事先|ㄕˋ ㄒㄧㄢ][練習|ㄌㄧㄢˋ ㄒㄧˊ]，[讓|ㄖㄤˋ][自己|ㄗˋ ㄐㄧˇ][介紹|ㄐㄧㄝˋ ㄕㄠˋ][的|˙ㄉㄜ][更|ㄍㄥˋ][流暢|ㄌㄧㄡˊ ㄔㄤˋ]。"
    answer: true
    explanation: "自我介紹前先練習，能熟悉要說的內容與順序，讓表達更流暢。原卷把「得更流暢」印成「的更流暢」，題庫照錄原字；這個用字不影響本題判斷練習對表達流暢的幫助。本答案為依題意自行解題，非官方答案。"
    source:
